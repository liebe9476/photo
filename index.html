<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 AI·SW체험 한마당 수피아여고 포토부스</title>

  <style>
    /* ============================================================
       0. 오프라인 자립형 기본 스타일 (외부 CDN 인터넷 의존성 0%)
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #111a2e 0%, #080d18 60%, #03060c 100%);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 0 10px 10px;
    }

    /* 뷰파인더 웹캠: 거울처럼 자연스럽게 볼 수 있도록 좌우반전(scaleX -1) 적용 */
    #webcamView {
      transform: scaleX(-1) !important;
      -webkit-transform: scaleX(-1) !important;
      will-change: transform;
    }

    /* 뷰파인더 코너 L자 브래킷 */
    .corner-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 10;
    }
    .corner-tl { top: 12px; left: 12px; border-top: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-tr { top: 12px; right: 12px; border-top: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }

    /* 카메라 플래시 애니메이션 */
    @keyframes flashEffect {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: flashEffect 0.35s ease-out forwards;
    }

    /* 영수증 톱니 절취선 데코 */
    .receipt-edge {
      position: relative;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
    }
    .receipt-edge::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 10px;
      background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
      background-size: 14px 14px;
      transform: rotate(180deg);
    }

    /* 버튼 기본 스타일 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 800;
      border-radius: 14px;
      transition: all 0.15s ease;
      outline: none;
      border: 1px solid transparent;
    }
    .btn:active {
      transform: scale(0.97);
    }

    /* ============================================================
       감열 영수증 인쇄 전용 CSS (Epson TM-m30III 80mm 완벽 가득 채움)
       ============================================================ */
    @page {
      size: 80mm auto;
      margin: 0 !important;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      html, body {
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: hidden !important;
      }

      body > *:not(#browserPrintZone) {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        max-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
      }

      #browserPrintZone {
        display: block !important;
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        line-height: 0 !important;
        font-size: 0 !important;
        overflow: hidden !important;
        page-break-before: avoid !important;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
        break-before: avoid !important;
        break-inside: avoid !important;
        break-after: avoid !important;
      }

      #browserPrintZone img {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        display: block !important;
        vertical-align: top !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       1. 상단 헤더 (제목, 아이콘, 전체화면 버튼)
       ============================================================ -->
  <header style="width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 68px 16px 0; margin-bottom: 4px; z-index: 20;">
    <div style="width: 80px; display: none;" class="desktop-spacer"></div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-top: 0;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg style="width: 24px; height: 24px; fill: #38bdf8; filter: drop-shadow(0 0 8px rgba(56,189,248,0.7));" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0 5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
        </svg>

        <h1 style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); font-weight: 900; background: linear-gradient(to right, #38bdf8, #2dd4bf, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">
          2026 AI·SW체험 수피아여고 포토부스
        </h1>

        <svg style="width: 24px; height: 24px; fill: #2dd4bf; filter: drop-shadow(0 0 8px rgba(45,212,191,0.7));" viewBox="0 0 24 24">
          <path d="m19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9m-7.5.5L9 4L6.5 9.5L1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5m7.5 5.5l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15Z"/>
        </svg>
      </div>

      <p style="font-size: clamp(0.75rem, 1.6vw, 0.9rem); color: #94a3b8; font-weight: 500; margin-top: 4px; letter-spacing: 0.2px;">
        화면을 보고 멋진 포즈를 취하면 영수증포토가 바로 인쇄됩니다!!
      </p>
    </div>

    <!-- 우측 제어 버튼 (블루투스 페어링 상태 및 전체화면 토글) -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- 블루투스 프린터 연결 버튼 -->
      <button id="bleConnectBtn" type="button" onclick="connectBluetoothPrinter()" title="블루투스 프린터 연결"
              class="btn" style="padding: 8px 10px; background: rgba(30, 41, 59, 0.9); color: #38bdf8; border: 1px solid #0284c7; font-size: 12px; z-index: 50;">
        <svg id="bleStatusIcon" style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M14.88 16.29L13 18.17V14.41m0-4.82l1.88 1.88L13 13.35M7 12l4-4V2.5l5.5 5.5L12.5 12l4 4l-5.5 5.5V16l-4-4m4-11v6.17l2.09-2.08L11 3.08v4.09M11 16.83V20.9l2.09-2.09L11 16.83Z"/>
        </svg>
      </button>

      <!-- 전체화면 토글 버튼 -->
      <button id="fullscreenToggleBtn" type="button" onclick="toggleFullscreen()" title="전체화면 전환"
              class="btn" style="padding: 8px 12px; background: rgba(30, 41, 59, 0.9); color: #cbd5e1; border: 1px solid #475569; font-size: 12px; z-index: 50;">
        <svg id="fullscreenIconSvg" style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ============================================================
       2. 메인 컨텐츠 영역
       ============================================================ -->
  <main style="width: 100%; max-width: 1350px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 0; position: relative; margin: 0; padding: 0 8px;">

    <!-- [A] 촬영 대기 및 진행 화면 (4:3 비율 최적화 와이드 대형 뷰파인더) -->
    <div id="captureSection" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 0; min-height: 0; padding: 0; margin-top: 14px;">

      <!-- 헤더와의 간격을 줄이고 크기를 확대한 직각 뷰파인더 -->
      <div id="viewfinderFrame" style="position: relative; width: min(92vw, 73vh, 1020px); aspect-ratio: 4 / 3; background: #000; border: 3.5px solid #38bdf8; box-shadow: 0 25px 60px -10px rgba(0,0,0,0.9), 0 0 30px rgba(56,189,248,0.25); display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 0;">

        <!-- 웹캠 비디오 엘리먼트 (아이패드 Safari 인라인 재생 지원) -->
        <video id="webcamView" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); -webkit-transform: scaleX(-1);"></video>

        <!-- 코너 L자 브래킷 -->
        <div class="corner-bracket corner-tl"></div>
        <div class="corner-bracket corner-tr"></div>
        <div class="corner-bracket corner-bl"></div>
        <div class="corner-bracket corner-br"></div>

        <!-- 카메라 플래시 효과 오버레이 -->
        <div id="cameraFlashOverlay" style="position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; z-index: 30;"></div>

        <!-- 상단 HUD -->
        <div style="position: absolute; top: 16px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 12px; color: #ffffff; pointer-events: none; z-index: 10;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444;"></div>
            <span style="letter-spacing: 1px; font-weight: bold;">LIVE REC</span>
          </div>
          <div id="shotStatusHud" style="letter-spacing: 2px; font-weight: bold;">
            SHOT [ 0 / 1 ]
          </div>
        </div>

        <!-- 중앙 조준선 Crosshair -->
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.25;">
          <div style="width: 32px; height: 1px; background: #fff;"></div>
          <div style="width: 1px; height: 32px; background: #fff; position: absolute;"></div>
        </div>

        <!-- 하단 HUD -->
        <div style="position: absolute; bottom: 16px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 11px; color: #ffffff; pointer-events: none; z-index: 10;">
          <div>SPEER GIRL'S HIGH SCHOOL</div>
          <div style="color: #38bdf8; font-weight: bold; letter-spacing: 1px;">AI·SW</div>
        </div>

        <!-- 카운트다운 오버레이 -->
        <div id="countdownBox" style="position: absolute; inset: 0; background: transparent; display: none; align-items: center; justify-content: center; z-index: 25; pointer-events: none;">
          <span id="countdownNumber" style="font-size: clamp(4.5rem, 14vw, 7.5rem); font-weight: 900; color: #ffffff; font-family: monospace; filter: drop-shadow(0 0 25px rgba(56,189,248,0.95));">
            4
          </span>
        </div>
      </div>

      <!-- 1컷 촬영 시작하기 버튼 (한 줄 더 여유 있게 간격 확대) -->
      <button id="startShootBtn" onclick="runShootingSequence()" class="btn"
              style="width: min(92vw, 73vh, 1020px); padding: 14px 20px; background: linear-gradient(135deg, #0284c7, #2563eb, #4f46e5); color: #ffffff; font-size: 18px; letter-spacing: 0.5px; border-radius: 14px; border: 1px solid rgba(125,211,252,0.4); box-shadow: 0 10px 25px -5px rgba(2,132,199,0.5); flex-shrink: 0; margin-top: 28px;">
        <svg style="width: 22px; height: 22px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0 5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
        </svg>
        <span>촬영 시작하기</span>
      </button>

    </div>

    <!-- [B] 결과 화면 (영수증 미리보기 + 블루투스/와이파이 인쇄 컨트롤) -->
    <div id="resultSection" style="display: none; width: 100%; height: 100%; flex-direction: row; align-items: center; justify-content: center; gap: 32px; min-height: 0; padding: 0 10px;">

      <!-- 좌측: 영수증 스티커 미리보기 -->
      <div style="height: 70vh; max-height: 560px; min-height: 380px; width: auto; display: flex; align-items: center; justify-content: center; padding: 12px 14px 18px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); flex-shrink: 0;">
        <div class="receipt-edge" style="height: 100%; aspect-ratio: 800 / 1080; background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 0;">
          <img id="stickerPreviewImg" alt="실제 인쇄 영수증 미리보기"
               style="width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: pixelated; background: #ffffff;" />
        </div>
      </div>

      <!-- 우측: 결과 안내 및 조작 버튼 -->
      <div style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; gap: 16px; max-width: 380px; width: 100%; align-self: center;">
        <div>
          <h2 style="font-size: clamp(1.2rem, 2.5vw, 1.55rem); font-weight: 900; color: #ffffff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;">
            <span>🎉 영수증 사진이 완성되었습니다!</span>
          </h2>
          <p id="resultGuideText" style="font-size: 13px; color: #cbd5e1; line-height: 1.55; margin-top: 8px;">
            화면에는 <strong style="color: #38bdf8;">선명한 컬러</strong>로 표시되며, 인쇄 시에는 크롬 블루투스 직통 통신으로 <strong style="color: #38bdf8;">Epson TM-m30III</strong> 감열지에 대화상자 없이 바로 인쇄됩니다.
          </p>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
          <!-- 1) 인쇄하기 버튼 -->
          <button id="printActionBtn" onclick="printReceiptSticker()" class="btn"
                  style="width: 100%; padding: 15px 20px; background: linear-gradient(135deg, #10b981, #0d9488, #059669); color: #ffffff; font-size: 17px; border-radius: 14px; border: 1px solid rgba(110,231,183,0.4); box-shadow: 0 10px 25px -5px rgba(16,185,129,0.5);">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3m-3 11H8v-5h8v5m3-7c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m-1-9H6V4h12v4Z"/>
            </svg>
            <span id="printBtnLabel">영수증 인쇄하기</span>
          </button>

          <!-- 2) 다시 촬영하기 버튼 -->
          <button id="retakeActionBtn" onclick="resetBoothToCamera()" class="btn"
                  style="width: 100%; padding: 12px 18px; background: #1e293b; color: #cbd5e1; font-size: 15px; border-radius: 14px; border: 1px solid #475569;">
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/>
            </svg>
            <span>다시 촬영하기</span>
          </button>
        </div>

        <div style="font-size: 11px; color: #64748b; font-family: monospace;">
          * 45초 동안 입력이 없으면 처음 대기 화면으로 자동 복귀합니다.
        </div>
      </div>
    </div>
  </main>

  <!-- 캔버스 및 감열 인쇄 DOM 영역 -->
  <canvas id="thermalStripCanvas" width="800" height="1080" style="display: none;"></canvas>
  <div id="browserPrintZone" style="display: none;">
    <img id="browserPrintImg" src="" alt="print-strip" />
  </div>

  <!-- 토스트 알림 메시지 바 -->
  <div id="appToast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; background: #0f172a; border: 1px solid #38bdf8; color: #fff; padding: 10px 18px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); transition: opacity 0.3s ease; opacity: 0; pointer-events: none; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px;">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">안내 메시지</span>
  </div>

  <script>
    const CONFIG = {
      AUTO_RESET_SECONDS: 45,
      FESTIVAL_TITLE: '2026 AI·SW 체험 한마당',
      CLUB_NAME: "Speer Girl's High School"
    };

    // DOM 요소 캐싱
    const webcamView = document.getElementById('webcamView');
    const captureSection = document.getElementById('captureSection');
    const resultSection = document.getElementById('resultSection');
    const shotStatusHud = document.getElementById('shotStatusHud');
    const countdownBox = document.getElementById('countdownBox');
    const countdownNumber = document.getElementById('countdownNumber');
    const cameraFlashOverlay = document.getElementById('cameraFlashOverlay');
    const startShootBtn = document.getElementById('startShootBtn');
    const printActionBtn = document.getElementById('printActionBtn');
    const printBtnLabel = document.getElementById('printBtnLabel');
    const stickerPreviewImg = document.getElementById('stickerPreviewImg');
    const thermalCanvas = document.getElementById('thermalStripCanvas');
    const thermalCtx = thermalCanvas.getContext('2d');
    const browserPrintImg = document.getElementById('browserPrintImg');

    let singleCapturedFrame = null;
    let autoResetTimer = null;
    let finalColorDataUrl = '';
    let finalDitheredDataUrl = '';
    let currentMediaStream = null;

    // Web Bluetooth GATT 변수
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    /**
     * 감열 프린터 특화: 스튜디오 영수증 사진 부스(Atkinson Dithering) 초고화질 알고리즘
     */
    function applyThermalPortraitDithering(sourceCanvas, targetWidth, targetHeight) {
      const ditherCanvas = document.createElement('canvas');
      ditherCanvas.width = targetWidth;
      ditherCanvas.height = targetHeight;
      const dCtx = ditherCanvas.getContext('2d');

      dCtx.imageSmoothingEnabled = true;
      dCtx.imageSmoothingQuality = 'high';
      dCtx.drawImage(sourceCanvas, 0, 0, targetWidth, targetHeight);

      const imgData = dCtx.getImageData(0, 0, targetWidth, targetHeight);
      const data = imgData.data;
      const totalPixels = targetWidth * targetHeight;

      const rawLuma = new Float32Array(totalPixels);
      const processed = new Float32Array(totalPixels);

      // [1단계] 표준 BT.709 인지 휘도(Luminance) 변환
      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        rawLuma[i] = 0.2126 * data[idx] + 0.7152 * data[idx + 1] + 0.0722 * data[idx + 2];
      }

      // [2단계] 영수증 포토부스 전용 정밀 언샵 마스크
      for (let y = 1; y < targetHeight - 1; y++) {
        const row = y * targetWidth;
        for (let x = 1; x < targetWidth - 1; x++) {
          const idx = row + x;
          const blur = (
            rawLuma[idx - targetWidth - 1] + rawLuma[idx - targetWidth] + rawLuma[idx - targetWidth + 1] +
            rawLuma[idx - 1]               + rawLuma[idx]               + rawLuma[idx + 1] +
            rawLuma[idx + targetWidth - 1] + rawLuma[idx + targetWidth] + rawLuma[idx + targetWidth + 1]
          ) / 9.0;

          const highPass = rawLuma[idx] - blur;
          let val = rawLuma[idx] + highPass * 0.88;

          // [3단계] 또렷한 인물 톤 밸런스 조정
          val = Math.min(255, Math.max(0, val + 18)); 
          let norm = val / 255.0;
          norm = Math.pow(norm, 0.74); 
          val = norm * 255.0;

          if (val < 45) {
            val = val * 0.85;
          }

          processed[idx] = Math.min(255, Math.max(0, val));
        }
      }

      for (let x = 0; x < targetWidth; x++) {
        processed[x] = rawLuma[x];
        processed[(targetHeight - 1) * targetWidth + x] = rawLuma[(targetHeight - 1) * targetWidth + x];
      }
      for (let y = 0; y < targetHeight; y++) {
        processed[y * targetWidth] = rawLuma[y * targetWidth];
        processed[y * targetWidth + (targetWidth - 1)] = rawLuma[y * targetWidth + (targetWidth - 1)];
      }

      // [4단계] Atkinson Dithering
      const THRESHOLD = 140;

      for (let y = 0; y < targetHeight; y++) {
        const row = y * targetWidth;
        const next1 = (y + 1) * targetWidth;
        const next2 = (y + 2) * targetWidth;

        for (let x = 0; x < targetWidth; x++) {
          const idx = row + x;
          const oldVal = processed[idx];
          const newVal = oldVal < THRESHOLD ? 0 : 255;
          processed[idx] = newVal;

          const err = (oldVal - newVal) >> 3;

          if (err !== 0) {
            if (x + 1 < targetWidth) processed[idx + 1] += err;
            if (x + 2 < targetWidth) processed[idx + 2] += err;

            if (y + 1 < targetHeight) {
              if (x - 1 >= 0) processed[next1 + (x - 1)] += err;
              processed[next1 + x] += err;
              if (x + 1 < targetWidth) processed[next1 + (x + 1)] += err;
            }

            if (y + 2 < targetHeight) {
              processed[next2 + x] += err;
            }
          }
        }
      }

      // [5단계] 1-bit 순수 흑백 버퍼 기록
      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        const c = processed[i] < 128 ? 0 : 255;
        data[idx] = c;
        data[idx + 1] = c;
        data[idx + 2] = c;
        data[idx + 3] = 255;
      }

      dCtx.putImageData(imgData, 0, 0);
      return ditherCanvas;
    }

    /**
     * 영수증 스티커 합성 렌더링 함수
     */
    function renderReceiptStrip(isDithered = false) {
      if (!singleCapturedFrame) return '';

      const tw = 800;
      const th = 1080;
      thermalCanvas.width = tw;
      thermalCanvas.height = th;

      thermalCtx.fillStyle = '#ffffff';
      thermalCtx.fillRect(0, 0, tw, th);

      thermalCtx.textAlign = 'center';
      thermalCtx.fillStyle = '#000000';
      thermalCtx.font = '900 54px sans-serif';
      thermalCtx.fillText(CONFIG.FESTIVAL_TITLE, tw / 2, 106);

      thermalCtx.font = 'bold 28px sans-serif';
      thermalCtx.fillStyle = '#222222';
      thermalCtx.fillText(CONFIG.CLUB_NAME, tw / 2, 150);

      const drawDecoLine = (y) => {
        thermalCtx.save();
        thermalCtx.strokeStyle = '#000000';
        thermalCtx.lineWidth = 1.5;
        thermalCtx.beginPath();
        thermalCtx.moveTo(30, y - 4);
        thermalCtx.lineTo(tw - 30, y - 4);
        thermalCtx.stroke();

        thermalCtx.lineWidth = 2.5;
        thermalCtx.setLineDash([12, 6, 4, 6]);
        thermalCtx.beginPath();
        thermalCtx.moveTo(30, y + 2);
        thermalCtx.lineTo(tw - 30, y + 2);
        thermalCtx.stroke();
        thermalCtx.restore();
      };

      drawDecoLine(194);

      const photoW = 740;
      const photoH = 555;
      const photoX = (tw - photoW) / 2;
      const photoY = 228;

      if (isDithered) {
        const ditheredPhoto = applyThermalPortraitDithering(singleCapturedFrame, photoW, photoH);
        thermalCtx.drawImage(ditheredPhoto, photoX, photoY, photoW, photoH);
      } else {
        thermalCtx.drawImage(singleCapturedFrame, photoX, photoY, photoW, photoH);
      }

      thermalCtx.strokeStyle = '#000000';
      thermalCtx.lineWidth = 3;
      thermalCtx.strokeRect(photoX, photoY, photoW, photoH);

      const bottomLineY = photoY + photoH + 34;
      drawDecoLine(bottomLineY);

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      const dateTextY = bottomLineY + 62;
      thermalCtx.font = 'bold 27px monospace';
      thermalCtx.fillStyle = '#000000';
      thermalCtx.fillText(`DATE: ${dateStr}`, tw / 2, dateTextY);

      thermalCtx.font = 'bold 33px sans-serif';
      thermalCtx.fillStyle = '#000000';
      thermalCtx.fillText('방문해주셔서 감사합니다!!', tw / 2, dateTextY + 46);

      const barcodeY = dateTextY + 70;
      const barcodeH = 40;
      const barPattern = [
        3,2,1,3,2,1,4,1,2,3,1,2,4,2,1,3,2,1,3,4,1,2,3,1,2,4,1,3,2,1,
        2,3,1,4,2,1,3,2,1,3,2,4,1,2,3,1,3,2,4,1,2,1,3,2,4,1,3,2,1,2,
        3,1,2,4,1,3,2,1,3,2,4,1,2,3,1,4,2,1,3,2,1,3,4,1,2,3,1,2,4,1
      ];

      let totalBarW = 0;
      for (let i = 0; i < barPattern.length; i++) {
        totalBarW += barPattern[i] * 2.8;
      }
      let curBx = (tw - totalBarW) / 2;

      thermalCtx.fillStyle = '#000000';
      for (let i = 0; i < barPattern.length; i++) {
        const w = barPattern[i] * 2.8;
        if (i % 2 === 0) {
          thermalCtx.fillRect(curBx, barcodeY, w - 0.5, barcodeH);
        }
        curBx += w;
      }

      thermalCtx.font = 'bold 26px sans-serif';
      thermalCtx.fillStyle = '#111111';
      thermalCtx.fillText('수피아여고 인공지능공학 연구반', tw / 2, barcodeY + barcodeH + 32);

      return thermalCanvas.toDataURL('image/png');
    }

    /**
     * Epson TM-m30III 전용 1-bit 순수 ESC/POS 바이너리 커맨드 생성
     * 유효 인쇄 폭 576 dots (80mm 롤 용지 표준 규격)
     */
    function generateEscPosRasterBytes(canvas) {
      const printW = 576;
      const printH = Math.round(canvas.height * (printW / canvas.width));

      const scaled = document.createElement('canvas');
      scaled.width = printW;
      scaled.height = printH;
      const sCtx = scaled.getContext('2d');
      sCtx.drawImage(canvas, 0, 0, printW, printH);

      const imgData = sCtx.getImageData(0, 0, printW, printH);
      const pixels = imgData.data;

      const bytesPerLine = printW >> 3; // 72 바이트
      const buffer = [];

      // 1) 프린터 초기화 (ESC @)
      buffer.push(0x1B, 0x40);

      // 2) 줄간격 0 설정 (ESC 3 0)
      buffer.push(0x1B, 0x33, 0x00);

      // 3) GS v 0 래스터 그래픽 출력 (GS v 0 m xL xH yL yH d1...dk)
      // m = 0 (정배율), xL/xH = 가로 바이트 수(72, 0), yL/yH = 세로 픽셀 수
      const xL = bytesPerLine & 0xFF;
      const xH = (bytesPerLine >> 8) & 0xFF;
      const yL = printH & 0xFF;
      const yH = (printH >> 8) & 0xFF;

      buffer.push(0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH);

      for (let y = 0; y < printH; y++) {
        const row = y * printW;
        for (let b = 0; b < bytesPerLine; b++) {
          let byteVal = 0;
          for (let bit = 0; bit < 8; bit++) {
            const x = (b << 3) + bit;
            const idx = (row + x) * 4;
            // 흑색 픽셀(휘도 128 미만)이면 1bit 마킹
            if (pixels[idx] < 128) {
              byteVal |= (1 << (7 - bit));
            }
          }
          buffer.push(byteVal);
        }
      }

      // 4) 출력 후 용지 피드 및 자동 절단 (GS V 66 0)
      buffer.push(0x1B, 0x64, 0x04); // 피드 4줄 (ESC d 4)
      buffer.push(0x1D, 0x56, 0x42, 0x00); // 완전 컷 (GS V B 0)

      return new Uint8Array(buffer);
    }

    /**
     * Web Bluetooth를 통한 Epson TM-m30III 연결
     * 크롬 브라우저 전용: 대화상자 없이 직통 출력 가능
     */
    async function connectBluetoothPrinter() {
      if (!navigator.bluetooth) {
        showToast("이 브라우저는 Web Bluetooth를 지원하지 않습니다. (Chrome 권장)", "⚠️");
        return null;
      }

      try {
        showToast("TM-m30III 블루투스 검색 중...", "🔍");

        const device = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'TM' },
            { namePrefix: 'EPSON' },
            { namePrefix: 'TM-m30' }
          ],
          optionalServices: [
            '000018f0-0000-1000-8000-00805f9b34fb', // Serial / Printer Service
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2', // Epson Custom Service
            '49535343-fe7d-4ae5-8fa9-9fafd205e455', // Standard BLE POS
            0xFF00, 0xFFE0
          ]
        });

        const server = await device.gatt.connect();
        bluetoothDevice = device;

        // 사용 가능한 서비스 및 특성(Characteristic) 탐색
        const services = await server.getPrimaryServices();
        for (const service of services) {
          try {
            const characteristics = await service.getCharacteristics();
            for (const char of characteristics) {
              if (char.properties.write || char.properties.writeWithoutResponse) {
                bluetoothCharacteristic = char;
                break;
              }
            }
            if (bluetoothCharacteristic) break;
          } catch (e) {}
        }

        if (bluetoothCharacteristic) {
          const btn = document.getElementById('bleConnectBtn');
          if (btn) btn.style.color = '#10b981';
          showToast("블루투스 프린터 연결 성공! ✨", "🖨️");
          return bluetoothCharacteristic;
        } else {
          throw new Error("쓰기 가능한 블루투스 특성을 찾지 못했습니다.");
        }
      } catch (err) {
        console.warn("Bluetooth connection cancelled or failed:", err);
        showToast("블루투스 연결 취소 또는 실패: " + err.message, "⚠️");
        return null;
      }
    }

    /**
     * 블루투스 청크 전송 (BLE MTU 크기에 맞춰 100~512바이트 분할 전송)
     */
    async function sendBytesToBluetooth(bytes) {
      if (!bluetoothCharacteristic) {
        const char = await connectBluetoothPrinter();
        if (!char) throw new Error("프린터가 연결되지 않았습니다.");
      }

      const chunkSize = 128; // BLE 안정 전송 패킷 단위
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.slice(i, i + chunkSize);
        if (bluetoothCharacteristic.writeValueWithoutResponse) {
          await bluetoothCharacteristic.writeValueWithoutResponse(chunk);
        } else {
          await bluetoothCharacteristic.writeValue(chunk);
        }
        await sleep(15); // 패킷 버퍼 플러시 딜레이
      }
    }

    /**
     * 감열 프린터 출력 파이프라인 (대화상자 0초 즉시 출력)
     */
    async function printReceiptSticker() {
      printActionBtn.disabled = true;
      printBtnLabel.innerText = "프린터 전송 중...";
      clearTimeout(autoResetTimer);

      try {
        // 인쇄용 그레이스케일 디더링 캔버스 렌더링
        finalDitheredDataUrl = renderReceiptStrip(true);

        showToast("블루투스로 직통 인쇄 중...", "🖨️");

        // 1) ESC/POS 바이너리 생성
        const rawBytes = generateEscPosRasterBytes(thermalCanvas);

        // 2) 크롬 Web Bluetooth 직통 스트리밍 (대화상자 0.001초도 없음)
        if (navigator.bluetooth) {
          await sendBytesToBluetooth(rawBytes);

          printBtnLabel.innerText = "출력 완료!";
          showToast("영수증이 즉시 출력되었습니다! ✨", "🎉");

          setTimeout(() => {
            printActionBtn.disabled = false;
            printBtnLabel.innerText = "영수증 인쇄하기";
            resetBoothToCamera();
          }, 3000);
          return;
        }

        // Web Bluetooth 미지원 환경 안전 폴백
        throw new Error("Web Bluetooth 미지원 브라우저");

      } catch (err) {
        console.warn("Bluetooth Direct Print fallback:", err);
        showToast("표준 인쇄 모드로 전환합니다.", "ℹ️");

        if (browserPrintImg) {
          browserPrintImg.src = finalDitheredDataUrl;
          if (browserPrintImg.decode) {
            try { await browserPrintImg.decode(); } catch (e) {}
          }
        }
        setTimeout(() => {
          window.print();
          printActionBtn.disabled = false;
          printBtnLabel.innerText = "영수증 인쇄하기";
        }, 300);
      }
    }

    /**
     * 1컷 촬영 시퀀스
     */
    async function runShootingSequence() {
      startShootBtn.disabled = true;
      singleCapturedFrame = null;
      shotStatusHud.innerText = `SHOT [ 1 / 1 ]`;

      // 4초 카운트다운
      countdownBox.style.display = 'flex';
      for (let c = 4; c >= 1; c--) {
        countdownNumber.innerText = c;
        await sleep(1000);
      }
      countdownBox.style.display = 'none';

      // 플래시 애니메이션
      cameraFlashOverlay.classList.remove('flash-active');
      void cameraFlashOverlay.offsetWidth;
      cameraFlashOverlay.classList.add('flash-active');

      const vw = webcamView.videoWidth || 1280;
      const vh = webcamView.videoHeight || 720;

      // 4:3 뷰파인더 앵글 중앙 크롭 매핑
      const targetAspect = 4 / 3;
      let cropW, cropH;
      if (vw / vh > targetAspect) {
        cropH = vh;
        cropW = vh * targetAspect;
      } else {
        cropW = vw;
        cropH = vw / targetAspect;
      }
      const cropX = (vw - cropW) / 2;
      const cropY = (vh - cropH) / 2;

      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = 800;
      frameCanvas.height = 600;
      const fCtx = frameCanvas.getContext('2d');
      fCtx.imageSmoothingEnabled = true;
      fCtx.imageSmoothingQuality = 'high';

      // 인쇄 및 결과물: 글씨와 로고가 똑바로 읽히도록 원본 정방향(비반전)으로 캡처
      fCtx.drawImage(webcamView, cropX, cropY, cropW, cropH, 0, 0, frameCanvas.width, frameCanvas.height);

      singleCapturedFrame = frameCanvas;
      await sleep(200);

      // [미리보기]: 생생한 원본 컬러(isDithered = false)로 표시
      finalColorDataUrl = renderReceiptStrip(false);
      stickerPreviewImg.src = finalColorDataUrl;

      captureSection.style.display = 'none';
      resultSection.style.display = 'flex';
      printActionBtn.disabled = false;
      printBtnLabel.innerText = "영수증 인쇄하기";

      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(resetBoothToCamera, CONFIG.AUTO_RESET_SECONDS * 1000);
    }

    function resetBoothToCamera() {
      clearTimeout(autoResetTimer);
      resultSection.style.display = 'none';
      captureSection.style.display = 'flex';
      startShootBtn.disabled = false;
      shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
      singleCapturedFrame = null;
    }

    /**
     * 웹캠 하드웨어 초기화 (iPadOS Safari 오프라인 완벽 구동)
     */
    async function initWebcam() {
      if (currentMediaStream) {
        try {
          currentMediaStream.getTracks().forEach(t => t.stop());
        } catch (e) {}
      }

      const constraintsAttempts = [
        {
          video: {
            facingMode: 'user',
            width: { ideal: 1280, min: 640 },
            height: { ideal: 720, min: 480 }
          },
          audio: false
        },
        {
          video: { facingMode: 'user' },
          audio: false
        },
        {
          video: true,
          audio: false
        }
      ];

      let stream = null;
      for (const attempt of constraintsAttempts) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(attempt);
          if (stream) break;
        } catch (err) {
          console.warn("Retrying constraints attempt:", err);
        }
      }

      if (stream) {
        currentMediaStream = stream;
        webcamView.srcObject = stream;
        webcamView.setAttribute('playsinline', '');
        webcamView.setAttribute('webkit-playsinline', '');
        webcamView.muted = true;
        webcamView.style.transform = 'scaleX(-1)';
        webcamView.style.webkitTransform = 'scaleX(-1)';

        try {
          await webcamView.play();
          shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
        } catch (playErr) {
          console.warn("Autoplay deferred by iPadOS gesture policy", playErr);
          shotStatusHud.innerText = "TOUCH TO START";
        }
      } else {
        shotStatusHud.innerText = "CAMERA ERROR";
        showToast("카메라 권한을 확인해주세요.", "⚠️");
      }
    }

    /**
     * 전체화면 토글
     */
    async function toggleFullscreen() {
      try {
        const isFull = !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );

        if (!isFull) {
          const target = document.documentElement;
          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target.webkitRequestFullscreen) {
            await target.webkitRequestFullscreen();
          } else if (target.mozRequestFullScreen) {
            await target.mozRequestFullScreen();
          } else if (target.msRequestFullscreen) {
            await target.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            await document.mozCancelFullScreen();
          } else if (document.msExitFullscreen) {
            await document.msExitFullscreen();
          }
        }
      } catch (err) {
        console.warn("Fullscreen toggle error:", err);
      }
    }

    function syncFullscreenUI() {
      const isFull = !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
      const icon = document.getElementById('fullscreenIconSvg');
      if (icon) {
        if (isFull) {
          icon.innerHTML = '<path d="M14 14h5v2h-3v3h-2v-5m-4 0v5H8v-3H5v-2h5m4-9v5h5V8h-3V5h-2m-6 3V5H6v3h3v2H4V8h4Z"/>';
        } else {
          icon.innerHTML = '<path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>';
        }
      }
    }

    document.addEventListener('fullscreenchange', syncFullscreenUI);
    document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
    document.addEventListener('mozfullscreenchange', syncFullscreenUI);
    document.addEventListener('MSFullscreenChange', syncFullscreenUI);

    // iPadOS 제스처 자동재생 해제용 리스너
    document.addEventListener('touchstart', function unlockIOSAutoplay() {
      if (webcamView && webcamView.paused && webcamView.srcObject) {
        webcamView.play().then(() => {
          shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
        }).catch(() => {});
      }
    }, { once: true, passive: true });

    function showToast(msg, icon = "✨") {
      const toast = document.getElementById('appToast');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.style.opacity = '1';

      setTimeout(() => {
        toast.style.opacity = '0';
      }, 3200);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.onload = initWebcam;
  </script>
