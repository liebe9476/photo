<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 AI·SW체험 수피아여고 포토부스</title>
  <!-- QR 코드 생성 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      color: #1e293b;
    }

    #appContainer {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 전체화면 플로팅 버튼 */
    .fullscreen-fab {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: all 0.2s;
      z-index: 60;
    }
    .fullscreen-fab:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    /* 2단 메인 화면 (좌측 뷰파인더 + 우측 제어) */
    #mainBoothArea {
      flex: 1;
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 0;
      background: #e7e9df;
    }

    /* 좌측 뷰파인더 */
    #viewfinderContainer {
      flex: 1;
      height: 100%;
      position: relative;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcamView {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
      display: block;
    }

    /* 뷰파인더 3x3 가이드 */
    .grid-line {
      position: absolute;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.35);
      z-index: 15;
    }
    .grid-v1 { left: 33.333%; top: 0; bottom: 0; width: 1px; }
    .grid-v2 { left: 66.666%; top: 0; bottom: 0; width: 1px; }
    .grid-h1 { top: 33.333%; left: 0; right: 0; height: 1px; }
    .grid-h2 { top: 66.666%; left: 0; right: 0; height: 1px; }

    .live-badge {
      position: absolute;
      top: 22px;
      left: 24px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 6px #ef4444;
    }

    #flashOverlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
    }
    .flash-anim {
      animation: flashAnim 0.35s ease-out forwards;
    }
    @keyframes flashAnim {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    #countdownBox {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 35;
      pointer-events: none;
    }
    #countdownNum {
      font-size: clamp(5rem, 15vw, 8.5rem);
      font-weight: 900;
      color: #ffffff;
      font-family: monospace;
      text-shadow: 0 4px 25px rgba(0,0,0,0.7);
    }

    /* 우측 버튼 패널 */
    #sideActionPanel {
      width: clamp(280px, 34vw, 420px);
      height: 100%;
      background: #e7e9df;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 24px;
      position: relative;
      flex-shrink: 0;
    }

    .side-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 34px;
      max-width: 320px;
    }

    .booth-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.2);
      color: #0284c7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 10px;
    }

    .booth-main-title {
      font-size: clamp(1.2rem, 2.2vw, 1.55rem);
      font-weight: 900;
      color: #1e293b;
      letter-spacing: -0.6px;
      line-height: 1.35;
    }

    .booth-sub-caption {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      font-weight: 500;
    }

    .pill-shoot-btn {
      width: min(90%, 280px);
      padding: 22px 30px;
      background: #f1f3ee;
      border: 1px solid #d5d8cd;
      border-radius: 9999px;
      font-size: 1.45rem;
      font-weight: 800;
      color: #1a1a1a;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0,0,0,0.04);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: all 0.15s ease-in-out;
    }
    .pill-shoot-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
    }
    .pill-shoot-btn:active {
      transform: scale(0.96);
      background: #e2e5da;
    }

    /* 결과 모달 */
    #resultModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .result-content {
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid #334155;
      max-width: 860px;
      width: 100%;
      max-height: 94vh;
      display: flex;
      flex-direction: row;
      gap: 28px;
      padding: 28px;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.9);
      overflow-y: auto;
    }

    .preview-card {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 310px;
    }

    /* 촬영된 원본 컬러 사진 프리뷰 */
    #previewImg {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .preview-tag {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .result-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #f8fafc;
    }

    .result-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .result-header p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .print-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
    }
    .print-btn:active {
      transform: scale(0.97);
    }

    .retake-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #334155;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    #toastNotice {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 120;
    }

    /* 백그라운드 인쇄 프레임 (깜빡임 없음) */
    #hiddenPrintFrame {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 10px;
      height: 10px;
      border: none;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="appContainer">
    <button type="button" class="fullscreen-fab" onclick="toggleFullscreen()" title="전체화면 전환">
      <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24">
        <path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>
      </svg>
      <span>전체화면</span>
    </button>

    <main id="mainBoothArea">
      <!-- 좌측 뷰파인더 -->
      <section id="viewfinderContainer">
        <video id="webcamView" autoplay playsinline muted></video>

        <div class="live-badge">
          <div class="live-dot"></div>
          <span>LIVE</span>
        </div>

        <div class="grid-line grid-v1"></div>
        <div class="grid-line grid-v2"></div>
        <div class="grid-line grid-h1"></div>
        <div class="grid-line grid-h2"></div>

        <div id="flashOverlay"></div>
        <div id="countdownBox">
          <span id="countdownNum">3</span>
        </div>
      </section>

      <!-- 우측 패널 -->
      <aside id="sideActionPanel">
        <div class="side-title-container">
          <div class="booth-chip">
            <svg style="width: 12px; height: 12px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 18a8 8 0 0 1-8-8a8 8 0 0 1 8-8a8 8 0 0 1 8 8a8 8 0 0 1-8 8m1-13h-2v6h6v-2h-4V7Z"/>
            </svg>
            SPEER HIGH SCHOOL
          </div>
          <h2 class="booth-main-title">
            2026 AI·SW체험<br/>수피아여고 포토부스
          </h2>
          <p class="booth-sub-caption">카메라를 정면으로 바라보고 버튼을 눌러주세요</p>
        </div>

        <button id="shootButton" class="pill-shoot-btn" onclick="triggerPhotoShoot()">
          촬영하기
        </button>
      </aside>
    </main>
  </div>

  <!-- 결과 모달 -->
  <div id="resultModal">
    <div class="result-content">
      <div class="preview-card">
        <!-- 원본 컬러 사진 미리보기 -->
        <img id="previewImg" alt="촬영 원본 컬러 사진" />
        <span class="preview-tag">ORIGINAL COLOR PHOTO</span>
      </div>

      <div class="result-details">
        <div class="result-header">
          <h2>사진이 성공적으로 촬영되었습니다! 🎉</h2>
          <p>미리보기는 선명한 원본 컬러로 제공되며, [영수증 인쇄하기] 클릭 시 72×72mm 규격의 부드러운 아날로그 감열 앳킨슨 포토로 즉시 출력됩니다.</p>
        </div>

        <div class="action-group">
          <button id="printBtn" class="print-btn" onclick="printReceipt()">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3m-3 11H8v-5h8v5m3-7c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m-1-9H6V4h12v4Z"/>
            </svg>
            <span id="printBtnText">영수증 인쇄하기</span>
          </button>

          <button class="retake-btn" onclick="closeModalAndResume()">
            다시 촬영하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 인쇄 합성용 숨김 DOM -->
  <canvas id="offscreenReceiptCanvas" style="display: none;"></canvas>
  <div id="qrHiddenHolder" style="display: none;"></div>
  <iframe id="hiddenPrintFrame"></iframe>

  <div id="toastNotice"></div>

  <script>
    // DOM 캐싱
    const webcamView = document.getElementById('webcamView');
    const shootButton = document.getElementById('shootButton');
    const flashOverlay = document.getElementById('flashOverlay');
    const countdownBox = document.getElementById('countdownBox');
    const countdownNum = document.getElementById('countdownNum');
    const resultModal = document.getElementById('resultModal');
    const previewImg = document.getElementById('previewImg');
    const printBtn = document.getElementById('printBtn');
    const printBtnText = document.getElementById('printBtnText');
    const offscreenCanvas = document.getElementById('offscreenReceiptCanvas');
    const offscreenCtx = offscreenCanvas.getContext('2d');
    const hiddenPrintFrame = document.getElementById('hiddenPrintFrame');

    let currentMediaStream = null;
    let capturedColorCanvas = null;
    let finalPrintReceiptDataUrl = '';

    // 1. 카메라 초기화
    async function initializeCamera() {
      try {
        currentMediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        webcamView.srcObject = currentMediaStream;
      } catch (e) {
        console.warn('카메라 초기화 실패:', e);
        showToast('카메라 권한을 확인해주세요.');
      }
    }

    /**
     * 2. 순수 정통 앳킨슨(Atkinson) 렌더링 엔진
     * - 원, 반경, 중심점, 거리 계산 수식 100% 완전 영구 제거 (원형 왜곡 원천 차단)
     * - 완전한 수평 평면 처리 + 화사하고 밝은 피부톤
     * - 안경테/눈동자는 얇고 진한 1픽셀 블랙선 보존
     */
    function renderPureAtkinsonPhoto(sourceCanvas, targetWidth, targetHeight) {
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0, targetWidth, targetHeight);

      const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
      const data = imgData.data;
      const totalPixels = targetWidth * targetHeight;
      const grayBuffer = new Float32Array(totalPixels);

      // 1단계: 원/거리 계산 없는 완전한 1:1 절대 평면 휘도 변환 + 한층 더 밝고 화사한 톤 보정
      for (let y = 0; y < targetHeight; y++) {
        const row = y * targetWidth;
        for (let x = 0; x < targetWidth; x++) {
          const i = row + x;
          const p = i * 4;
          const r = data[p];
          const g = data[p + 1];
          const b = data[p + 2];

          // 표준 인지 휘도 (원이나 중심 계산 없이 순수 1:1 수평 변환)
          let lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;

          // 안경테, 눈동자, 짙은 눈썹(lum < 68)은 깊은 1픽셀 블랙으로 또렷하게 앵커링
          if (lum < 68) {
            lum = lum * 0.85;
          } else {
            // 얼굴 피부톤과 전체 배경을 더욱 화사하고 뽀얗게 올려주는 밝은 감마(1.58) 및 미드톤 리프팅(+26)
            const norm = Math.max(0, Math.min(1, (lum - 68) / (255 - 68)));
            lum = 68 + Math.pow(norm, 1.0 / 1.58) * (255 - 68) + 26.0;
          }

          grayBuffer[i] = Math.min(255, Math.max(0, lum));
        }
      }

      // 2단계: 정통 앳킨슨 오차 확산 (6방향 각 1/8씩 분산, 2/8 자연 소멸)
      for (let y = 0; y < targetHeight; y++) {
        const row = y * targetWidth;
        for (let x = 0; x < targetWidth; x++) {
          const idx = row + x;
          const oldVal = grayBuffer[idx];
          const newVal = oldVal < 128 ? 0 : 255;
          grayBuffer[idx] = newVal;

          const err = (oldVal - newVal) / 8.0;

          if (x + 1 < targetWidth) grayBuffer[idx + 1] += err;
          if (x + 2 < targetWidth) grayBuffer[idx + 2] += err;
          if (y + 1 < targetHeight) {
            if (x - 1 >= 0) grayBuffer[(y + 1) * targetWidth + (x - 1)] += err;
            grayBuffer[(y + 1) * targetWidth + x] += err;
            if (x + 1 < targetWidth) grayBuffer[(y + 1) * targetWidth + (x + 1)] += err;
          }
          if (y + 2 < targetHeight) {
            grayBuffer[(y + 2) * targetWidth + x] += err;
          }

          // 1비트 모노크롬 픽셀 기록
          const p = idx * 4;
          data[p] = newVal;
          data[p + 1] = newVal;
          data[p + 2] = newVal;
          data[p + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    /**
     * QR 코드 캔버스 생성 함수 (수피아여고 공식)
     */
    function generateQRCodeCanvas(text, size) {
      return new Promise((resolve) => {
        const holder = document.getElementById('qrHiddenHolder');
        holder.innerHTML = '';
        new QRCode(holder, {
          text: text,
          width: size,
          height: size,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        setTimeout(() => {
          const qrCanvas = holder.querySelector('canvas');
          if (qrCanvas) {
            resolve(qrCanvas);
          } else {
            const qrImg = holder.querySelector('img');
            if (qrImg) {
              const cvs = document.createElement('canvas');
              cvs.width = size;
              cvs.height = size;
              const c = cvs.getContext('2d');
              c.drawImage(qrImg, 0, 0, size, size);
              resolve(cvs);
            } else {
              const cvs = document.createElement('canvas');
              cvs.width = size;
              cvs.height = size;
              resolve(cvs);
            }
          }
        }, 120);
      });
    }

    /**
     * 3. 72 × 72 mm 물리 규격 영수증 합성 (576 × 576 px 1:1 정방형)
     * TM-m30III 80mm 용지의 유효 인쇄 폭 72mm = 정확히 576 도트
     */
    async function composeTargetReceipt() {
      if (!capturedColorCanvas) return '';

      const tw = 576; // 정확히 72mm (203.2 DPI)
      const photoSize = 576; // 72x72mm 1:1 정사각형
      const th = 760; // 72mm 사진 + 여백 + 하단 QR코드

      offscreenCanvas.width = tw;
      offscreenCanvas.height = th;

      // 순백색 바탕
      offscreenCtx.fillStyle = '#ffffff';
      offscreenCtx.fillRect(0, 0, tw, th);

      // 사진 영역: 순수 앳킨슨(Atkinson) 렌더링
      const atkinsonPhoto = renderPureAtkinsonPhoto(capturedColorCanvas, photoSize, photoSize);
      offscreenCtx.drawImage(atkinsonPhoto, 0, 0, photoSize, photoSize);

      // 하단 QR 코드 렌더링
      try {
        const qrSize = 150;
        const qrCanvas = await generateQRCodeCanvas('https://speer.hs.kr/', qrSize);
        const qrX = Math.round((tw - qrSize) / 2);
        const qrY = photoSize + 18;
        offscreenCtx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
      } catch (err) {
        console.warn('QR 코드 생성 오류:', err);
      }

      return offscreenCanvas.toDataURL('image/png');
    }

    /**
     * 4. 사진 촬영 시퀀스
     * - 2단계 스텝다운(Step-down Resizing)으로 GPU 렌즈 메쉬 왜곡 원천 차단
     */
    async function triggerPhotoShoot() {
      shootButton.disabled = true;

      countdownBox.style.display = 'flex';
      for (let c = 3; c >= 1; c--) {
        countdownNum.innerText = c;
        await sleep(1000);
      }
      countdownBox.style.display = 'none';

      // 플래시 효과
      flashOverlay.classList.remove('flash-anim');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-anim');

      const vw = webcamView.videoWidth || 1280;
      const vh = webcamView.videoHeight || 720;
      const cropSize = Math.min(vw, vh);
      const cropX = (vw - cropSize) / 2;
      const cropY = (vh - cropSize) / 2;

      // 1단계: 1:1 정방형 800px 축소
      const stepCanvas = document.createElement('canvas');
      stepCanvas.width = 800;
      stepCanvas.height = 800;
      const sCtx = stepCanvas.getContext('2d');
      sCtx.imageSmoothingEnabled = true;
      sCtx.imageSmoothingQuality = 'high';
      sCtx.translate(800, 0);
      sCtx.scale(-1, 1);
      sCtx.drawImage(webcamView, cropX, cropY, cropSize, cropSize, 0, 0, 800, 800);

      // 2단계: 최종 576x576px (72x72mm)로 무왜곡 다운샘플링
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 576;
      tempCanvas.height = 576;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.imageSmoothingEnabled = true;
      tCtx.imageSmoothingQuality = 'high';
      tCtx.drawImage(stepCanvas, 0, 0, 800, 800, 0, 0, 576, 576);

      capturedColorCanvas = tempCanvas;

      // 미리보기: 촬영된 선명한 원본 컬러 그대로 표시
      previewImg.src = capturedColorCanvas.toDataURL('image/png');

      // 인쇄용: 순수 앳킨슨 흑백 + QR코드 합성
      finalPrintReceiptDataUrl = await composeTargetReceipt();

      resultModal.style.display = 'flex';
      shootButton.disabled = false;
    }

    /**
     * 5. 무왜곡 72×72mm 규격 백그라운드 인쇄 파이프라인
     * - 화면 깜빡임이 없는 Iframe 인쇄
     * - 용지 가로 폭 전체에 100% 꽉 차게 렌더링
     */
    function printReceipt() {
      printBtn.disabled = true;
      printBtnText.innerText = '인쇄 전송 중...';

      try {
        const frameDoc = hiddenPrintFrame.contentWindow.document;
        frameDoc.open();
        frameDoc.write(`
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8">
            <title>Receipt Print</title>
            <style>
              @page {
                size: 80mm auto;
                margin: 0 !important;
              }
              *, *::before, *::after {
                box-sizing: border-box !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
              }
              html, body {
                width: 100% !important;
                min-width: 100% !important;
                margin: 0 auto !important;
                padding: 0 !important;
                background: #ffffff !important;
                overflow: hidden !important;
              }
              .receipt-wrapper {
                width: 100% !important;
                min-width: 100% !important;
                margin: 0 auto !important;
                padding: 0 !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
              }
              .receipt-img {
                width: 100% !important;
                min-width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                display: block !important;
                margin: 0 auto !important;
                image-rendering: pixelated !important;
                image-rendering: crisp-edges !important;
              }
            </style>
          </head>
          <body>
            <div class="receipt-wrapper">
              <img class="receipt-img" src="${finalPrintReceiptDataUrl}" alt="receipt" />
            </div>
          </body>
          </html>
        `);
        frameDoc.close();

        setTimeout(() => {
          hiddenPrintFrame.contentWindow.focus();
          hiddenPrintFrame.contentWindow.print();
          printBtnText.innerText = '인쇄 완료!';
          showToast('영수증 인쇄가 시작되었습니다.');
        }, 300);

      } catch (err) {
        console.warn('Iframe 인쇄 실패, 백업 인쇄로 전환:', err);
        window.print();
      }

      setTimeout(() => {
        printBtn.disabled = false;
        printBtnText.innerText = '영수증 인쇄하기';
        closeModalAndResume();
      }, 2500);
    }

    function closeModalAndResume() {
      resultModal.style.display = 'none';
      shootButton.disabled = false;
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        console.warn('전체화면 에러', e);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotice');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 2500);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.onload = initializeCamera;
  </script>
</body>
</html>
