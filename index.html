<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 AI·SW체험 수피아여고 포토부스</title>

  <style>
    /* ============================================================
       0. 오프라인 자립형 기본 스타일 (외부 CDN 인터넷 의존성 0%)
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #111a2e 0%, #080d18 60%, #03060c 100%);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    /* 카메라 거울 모드 (좌우 반전) */
    .mirror-mode {
      transform: scaleX(-1);
    }

    /* 뷰파인더 코너 L자 브래킷 (내부 배치) */
    .corner-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 10;
    }
    .corner-tl { top: 12px; left: 12px; border-top: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-tr { top: 12px; right: 12px; border-top: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }

    /* 카메라 플래시 애니메이션 */
    @keyframes flashEffect {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: flashEffect 0.35s ease-out forwards;
    }

    /* 영수증 톱니 절취선 데코 */
    .receipt-edge {
      position: relative;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
    }
    .receipt-edge::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 10px;
      background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
      background-size: 14px 14px;
      transform: rotate(180deg);
    }

    /* 버튼 기본 스타일 (모서리 둥글게 유지) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 800;
      border-radius: 14px;
      transition: all 0.15s ease;
      outline: none;
      border: 1px solid transparent;
    }
    .btn:active {
      transform: scale(0.97);
    }

    /* 감열 영수증 인쇄 전용 CSS (Epson TM-m30III 80mm 규격 전폭 100% 꽉 채움) */
    @media print {
      @page {
        size: 80mm auto !important;
        margin: 0mm !important;
      }
      *, *::before, *::after {
        box-sizing: border-box !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      html, body {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        min-height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
      }
      body * {
        display: none !important;
        visibility: hidden !important;
      }
      #browserPrintZone, #browserPrintZone * {
        display: block !important;
        visibility: visible !important;
      }
      #browserPrintZone {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        box-sizing: border-box !important;
      }
      #browserPrintZone img {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: pixelated !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between">

  <!-- ============================================================
       1. 상단 헤더 (제목, 아이콘, 블루투스 상태 & 제어 버튼)
       ============================================================ -->
  <header style="width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; margin-top: 4px; z-index: 20;">
    <!-- 좌측 균형용 빈 영역 -->
    <div style="width: 80px; display: none;" class="desktop-spacer"></div>

    <!-- 중앙 타이틀 블록 -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <!-- 카메라 SVG 아이콘 -->
        <svg style="width: 24px; height: 24px; fill: #38bdf8; filter: drop-shadow(0 0 8px rgba(56,189,248,0.7));" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
        </svg>

        <h1 style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); font-weight: 900; background: linear-gradient(to right, #38bdf8, #2dd4bf, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">
          2026 AI·SW체험 수피아여고 포토부스
        </h1>

        <!-- 스파클 SVG 아이콘 -->
        <svg style="width: 24px; height: 24px; fill: #2dd4bf; filter: drop-shadow(0 0 8px rgba(45,212,191,0.7));" viewBox="0 0 24 24">
          <path d="m19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9m-7.5.5L9 4L6.5 9.5L1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5m7.5 5.5l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15Z"/>
        </svg>
      </div>

      <p style="font-size: clamp(0.72rem, 1.6vw, 0.88rem); color: #94a3b8; font-weight: 500; margin-top: 4px; letter-spacing: 0.2px;">
        화면을 보고 멋진 포즈를 취하면 영수증포토가 바로 인쇄됩니다!!
      </p>
    </div>

    <!-- 우측 제어 버튼 (전체화면 토글만 유지) -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- 전체화면 토글 버튼 -->
      <button id="fullscreenToggleBtn" onclick="toggleFullscreen()" title="전체화면 전환"
              class="btn" style="padding: 7px 11px; background: rgba(30, 41, 59, 0.9); color: #cbd5e1; border: 1px solid #475569; font-size: 12px;">
        <svg id="fullscreenIconSvg" style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>
        </svg>
        <span id="fullscreenText" style="display: none; font-family: monospace; font-size: 11px;">전체화면</span>
      </button>
    </div>
  </header>

  <!-- ============================================================
       2. 메인 컨텐츠 영역 (뷰파인더 대기 vs 영수증 결과)
       ============================================================ -->
  <main style="width: 100%; max-width: 1150px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; position: relative; margin: 2px 0; padding: 0 8px;">

    <!-- [A] 촬영 대기 및 진행 화면 (직각 사각 뷰파인더 & 코너 브래킷) -->
    <div id="captureSection" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; min-height: 0; padding-top: 4px;">

      <!-- 유연한 가변 뷰파인더 프레임 (직각 사각) -->
      <div style="position: relative; width: 100%; max-width: 880px; flex: 1; min-height: 38vh; max-height: 64vh; background: #000; border: 3px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; outline: 1px solid rgba(56,189,248,0.4); overflow: hidden;">

        <!-- 웹캠 비디오 엘리먼트 -->
        <video id="webcamView" autoplay playsinline muted class="mirror-mode" style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>

        <!-- 안쪽 코너 L자 브래킷 -->
        <div class="corner-bracket corner-tl"></div>
        <div class="corner-bracket corner-tr"></div>
        <div class="corner-bracket corner-bl"></div>
        <div class="corner-bracket corner-br"></div>

        <!-- 카메라 플래시 효과 오버레이 -->
        <div id="cameraFlashOverlay" style="position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; z-index: 30;"></div>

        <!-- 상단 테크니컬 HUD 정보 (SHOT 카운터) -->
        <div style="position: absolute; top: 14px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 13px; color: #ffffff; pointer-events: none; z-index: 10;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444;"></div>
            <span style="letter-spacing: 1px; font-weight: bold;">LIVE REC</span>
          </div>
          <div id="shotStatusHud" style="letter-spacing: 2px; font-weight: bold;">
            SHOT [ 0 / 1 ]
          </div>
        </div>

        <!-- 중앙 조준선 Crosshair -->
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.25;">
          <div style="width: 32px; height: 1px; background: #fff;"></div>
          <div style="width: 1px; height: 32px; background: #fff; position: absolute;"></div>
        </div>

        <!-- 하단 테크니컬 HUD (흰색 폰트) -->
        <div style="position: absolute; bottom: 14px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 13px; color: #ffffff; pointer-events: none; z-index: 10;">
          <div id="hudConnectionMode">BLUETOOTH // TM-m30III</div>
          <div id="hudPrinterStatus" style="color: #38bdf8;">TM UTILITY READY</div>
        </div>

        <!-- 카운트다운 오버레이 (블러 없이 선명하게 비디오 투시) -->
        <div id="countdownBox" style="position: absolute; inset: 0; background: transparent; display: none; align-items: center; justify-content: center; z-index: 25; pointer-events: none;">
          <span id="countdownNumber" style="font-size: clamp(5rem, 15vw, 8rem); font-weight: 900; color: #ffffff; font-family: monospace; filter: drop-shadow(0 0 25px rgba(56,189,248,0.95));">
            3
          </span>
        </div>
      </div>

      <!-- 1컷 촬영 시작하기 버튼 (둥근 모서리 rounded-xl) -->
      <button id="startShootBtn" onclick="runShootingSequence()" class="btn"
              style="width: 100%; max-width: 440px; padding: 14px 20px; background: linear-gradient(135deg, #0284c7, #2563eb, #4f46e5); color: #ffffff; font-size: 18px; letter-spacing: 0.5px; border-radius: 14px; border: 1px solid rgba(125,211,252,0.4); box-shadow: 0 10px 25px -5px rgba(2,132,199,0.5); flex-shrink: 0; margin-top: 4px;">
        <svg style="width: 22px; height: 22px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
        </svg>
        <span>1컷 촬영 시작하기</span>
      </button>

    </div>

    <!-- [B] 결과 화면 (가로/세로 완벽 핏 영수증 미리보기 + 블루투스 출력) -->
    <div id="resultSection" style="display: none; width: 100%; height: 100%; flex-direction: row; align-items: center; justify-content: center; gap: 32px; min-height: 0; padding: 0 10px; margin-top: 6px;">

      <!-- 좌측: 영수증 스티커 캔버스 미리보기 (컬러 모드로 선명하게 노출) -->
      <div style="height: 64vh; max-height: 560px; min-height: 380px; width: auto; display: flex; align-items: center; justify-content: center; padding: 12px 14px 18px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); flex-shrink: 0;">
        <div class="receipt-edge" style="height: 100%; aspect-ratio: 576/880; background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;">
          <!-- 이미지 태그를 우선 활용하여 캔버스 컬러 렌더링 결과를 완벽하게 표시 -->
          <img id="stickerPreviewImg" alt="영수증 미리보기"
               style="width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: -webkit-optimize-contrast; background: #ffffff;" />
          <canvas id="stickerDisplayCanvas" width="576" height="880" style="display: none;"></canvas>
        </div>
      </div>

      <!-- 우측: 결과 안내 및 조작 버튼 (수직 중앙 정렬) -->
      <div style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; gap: 16px; max-width: 380px; width: 100%; align-self: center;">

        <div>
          <h2 style="font-size: clamp(1.2rem, 2.5vw, 1.55rem); font-weight: 900; color: #ffffff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;">
            <span>🎉 멋진 영수증 사진이 완성되었습니다!</span>
          </h2>
          <p style="font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 8px;">
            촬영된 사진을 확인해보세요. 아래 <strong style="color: #38bdf8;">[인쇄하기]</strong> 버튼을 누르면 감열 영수증 모드(흑백 그레이스케일)로 변환되어 <strong style="color: #2dd4bf;">Epson TM-m30III</strong>에서 스티커로 즉시 출력됩니다.
          </p>
        </div>

        <!-- 조작 버튼 2종: 인쇄하기 & 다시 촬영하기 -->
        <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
          <!-- 1) 인쇄하기 버튼 -->
          <button id="printActionBtn" onclick="printReceiptSticker()" class="btn"
                  style="width: 100%; padding: 15px 20px; background: linear-gradient(135deg, #10b981, #0d9488, #059669); color: #ffffff; font-size: 17px; border-radius: 14px; border: 1px solid rgba(110,231,183,0.4); box-shadow: 0 10px 25px -5px rgba(16,185,129,0.5);">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3m-3 11H8v-5h8v5m3-7c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m-1-9H6V4h12v4Z"/>
            </svg>
            <span id="printBtnLabel">블루투스로 인쇄하기</span>
          </button>

          <!-- 2) 다시 촬영하기 버튼 -->
          <button id="retakeActionBtn" onclick="resetBoothToCamera()" class="btn"
                  style="width: 100%; padding: 12px 18px; background: #1e293b; color: #cbd5e1; font-size: 15px; border-radius: 14px; border: 1px solid #475569;">
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/>
            </svg>
            <span>다시 촬영하기</span>
          </button>
        </div>

        <div style="font-size: 11px; color: #64748b; font-family: monospace;">
          * 45초 동안 입력이 없으면 처음 대기 화면으로 자동 복귀합니다.
        </div>

      </div>

    </div>

  </main>

  <!-- 3. 백그라운드 캔버스 및 감열 인쇄 DOM 영역 -->
  <canvas id="thermalStripCanvas" width="576" height="880" style="display: none;"></canvas>
  <div id="browserPrintZone" style="display: none;">
    <img id="browserPrintImg" src="" alt="print-strip" />
  </div>

  <!-- 5. 토스트 알림 메시지 바 -->
  <div id="appToast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; background: #0f172a; border: 1px solid #38bdf8; color: #fff; padding: 10px 18px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); transition: opacity 0.3s ease; opacity: 0; pointer-events: none; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px;">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">안내 메시지</span>
  </div>

  <!-- ============================================================
       6. 스크립트 로직 (1컷 컬러 프리뷰 & 흑백 감열 변환 인쇄)
       ============================================================ -->
  <script>
    // ==========================================
    // 1. 시스템 설정 (CONFIG)
    // ==========================================
    const CONFIG = {
      AUTO_RESET_SECONDS: 45,
      FESTIVAL_TITLE: '2026 수피아 AI·SW',
      CLUB_NAME: 'SPEER HIGH SCHOOL // AI LAB'
    };

    // DOM 요소
    const webcamView = document.getElementById('webcamView');
    const captureSection = document.getElementById('captureSection');
    const resultSection = document.getElementById('resultSection');
    const shotStatusHud = document.getElementById('shotStatusHud');
    const hudConnectionMode = document.getElementById('hudConnectionMode');
    const hudPrinterStatus = document.getElementById('hudPrinterStatus');
    const countdownBox = document.getElementById('countdownBox');
    const countdownNumber = document.getElementById('countdownNumber');
    const cameraFlashOverlay = document.getElementById('cameraFlashOverlay');
    const startShootBtn = document.getElementById('startShootBtn');
    const printActionBtn = document.getElementById('printActionBtn');
    const printBtnLabel = document.getElementById('printBtnLabel');
    const displayCanvas = document.getElementById('stickerDisplayCanvas');
    const displayCtx = displayCanvas.getContext('2d');
    const stickerPreviewImg = document.getElementById('stickerPreviewImg');
    const thermalCanvas = document.getElementById('thermalStripCanvas');
    const thermalCtx = thermalCanvas.getContext('2d');
    const browserPrintZone = document.getElementById('browserPrintZone');
    const browserPrintImg = document.getElementById('browserPrintImg');

    let singleCapturedFrame = null;
    let autoResetTimer = null;
    let finalColorDataUrl = '';
    let finalDitheredDataUrl = '';

    // ------------------------------------------------------------
    // [4] 1컷 영수증 합성 (화면 미리보기용: 생생한 컬러 모드)
    // ------------------------------------------------------------
    function generateCompositeColorSticker() {
      const W = 576;
      const H = 880; // 1컷에 최적화된 영수증 길이

      displayCanvas.width = W;
      displayCanvas.height = H;

      // 1. 깨끗한 흰색 바탕 클리어
      displayCtx.fillStyle = '#ffffff';
      displayCtx.fillRect(0, 0, W, H);

      displayCtx.fillStyle = '#0f172a';
      displayCtx.textAlign = 'center';

      // 상단 헤더
      displayCtx.font = 'bold 34px sans-serif';
      displayCtx.fillText('★ 2026 수피아 AI·SW ★', W / 2, 54);

      displayCtx.font = 'bold 22px sans-serif';
      displayCtx.fillText('수피아여고 포토 영수증', W / 2, 88);

      displayCtx.font = '16px monospace';
      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      displayCtx.fillText(`DATE: ${dateStr}`, W / 2, 118);

      // 상단 점선 구분선 (좌우 여백을 줄여 폭 가득 채움)
      displayCtx.lineWidth = 2.5;
      displayCtx.strokeStyle = '#0f172a';
      displayCtx.beginPath();
      displayCtx.setLineDash([8, 6]);
      displayCtx.moveTo(16, 134);
      displayCtx.lineTo(W - 16, 134);
      displayCtx.stroke();
      displayCtx.setLineDash([]);

      // 1컷 단일 대형 사진 렌더링 (용지 폭을 꽉 채우도록 여백 최소화: 544px 전폭)
      const imgW = 544;
      const imgH = 544;
      const startX = 16;
      const startY = 146;

      // 사진 외곽 테두리 (블랙 프레임)
      displayCtx.fillStyle = '#0f172a';
      displayCtx.fillRect(startX - 2, startY - 2, imgW + 4, imgH + 4);

      if (singleCapturedFrame) {
        try {
          const fW = singleCapturedFrame.width || 1280;
          const fH = singleCapturedFrame.height || 720;
          const targetRatio = imgW / imgH; // 1:1 정방형 포토
          const frameRatio = fW / fH;
          let sx = 0, sy = 0, sw = fW, sh = fH;

          if (frameRatio > targetRatio) {
            sw = fH * targetRatio;
            sx = (fW - sw) / 2;
          } else {
            sh = fW / targetRatio;
            sy = (fH - sh) / 2;
          }
          // [핵심] 원본 컬러 그대로 드로잉
          displayCtx.drawImage(singleCapturedFrame, sx, sy, sw, sh, startX, startY, imgW, imgH);
        } catch (e) {
          console.error("Frame draw error:", e);
          displayCtx.drawImage(singleCapturedFrame, startX, startY, imgW, imgH);
        }
      } else {
        displayCtx.fillStyle = '#e2e8f0';
        displayCtx.fillRect(startX, startY, imgW, imgH);
      }

      // 하단 점선 구분선
      const bottomLineY = startY + imgH + 18;
      displayCtx.beginPath();
      displayCtx.setLineDash([8, 6]);
      displayCtx.moveTo(16, bottomLineY);
      displayCtx.lineTo(W - 16, bottomLineY);
      displayCtx.stroke();
      displayCtx.setLineDash([]);

      // 하단 푸터 텍스트
      displayCtx.fillStyle = '#0f172a';
      displayCtx.font = 'bold 22px sans-serif';
      displayCtx.fillText('광주수피아여자고등학교', W / 2, bottomLineY + 34);

      displayCtx.font = '15px monospace';
      displayCtx.fillText(CONFIG.CLUB_NAME, W / 2, bottomLineY + 58);

      // 모의 바코드 렌더링 (용지 폭에 맞게 양끝 확장)
      const bcY = bottomLineY + 74;
      const bcH = 34;
      let bcX = 32;
      while (bcX < W - 32) {
        const barWidth = (Math.sin(bcX * 12.3) > 0) ? 3 : 1.5;
        displayCtx.fillRect(bcX, bcY, barWidth, bcH);
        bcX += barWidth + ((Math.cos(bcX * 5.7) > 0) ? 3 : 2);
      }

      // 화면 미리보기용 컬러 DataURL 생성 및 표시
      finalColorDataUrl = displayCanvas.toDataURL('image/png');
      if (stickerPreviewImg) {
        stickerPreviewImg.src = finalColorDataUrl;
      }
    }

    // ------------------------------------------------------------
    // [5] 인쇄 시 실행되는 Floyd-Steinberg 흑백 디더링/그레이 모드 변환
    // ------------------------------------------------------------
    function applyDitheringForThermalPrint() {
      const W = displayCanvas.width;
      const H = displayCanvas.height;

      thermalCanvas.width = W;
      thermalCanvas.height = H;

      const imgData = displayCtx.getImageData(0, 0, W, H);
      const data = imgData.data;

      // 고정밀 그레이스케일 변환
      const gray = new Float32Array(W * H);
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }

      // Floyd-Steinberg 오차 확산 디더링 (감열 프린터 최적화)
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const oldVal = gray[idx];
          const newVal = oldVal < 128 ? 0 : 255;
          gray[idx] = newVal;
          const err = oldVal - newVal;

          if (x + 1 < W) gray[idx + 1] += err * (7 / 16);
          if (x - 1 >= 0 && y + 1 < H) gray[(y + 1) * W + (x - 1)] += err * (3 / 16);
          if (y + 1 < H) gray[(y + 1) * W + x] += err * (5 / 16);
          if (x + 1 < W && y + 1 < H) gray[(y + 1) * W + (x + 1)] += err * (1 / 16);
        }
      }

      // 흑백 점(Dot) 반영
      for (let i = 0; i < gray.length; i++) {
        const val = gray[i] < 128 ? 0 : 255;
        data[i * 4] = val;
        data[i * 4 + 1] = val;
        data[i * 4 + 2] = val;
        data[i * 4 + 3] = 255;
      }

      thermalCtx.putImageData(imgData, 0, 0);
      finalDitheredDataUrl = thermalCanvas.toDataURL('image/png');
      return finalDitheredDataUrl;
    }

    // ------------------------------------------------------------
    // [6] 인쇄 실행 파이프라인 (그레이/디더링 변환 후 즉각 인쇄)
    // ------------------------------------------------------------
    async function printReceiptSticker() {
      printActionBtn.disabled = true;
      printBtnLabel.innerText = "흑백 감열 변환 중...";
      clearTimeout(autoResetTimer);

      try {
        // [핵심] 인쇄 클릭 시 그레이/디더링 흑백 이미지 생성
        const ditheredUrl = applyDitheringForThermalPrint();

        showToast("인쇄 데이터를 프린터로 전송합니다...", "🖨️");

        // 인쇄 전용 영역 이미지에 디더링 이미지 장착 및 디코딩 대기
        if (browserPrintImg) {
          browserPrintImg.src = ditheredUrl;
          if (browserPrintImg.decode) {
            try {
              await browserPrintImg.decode();
            } catch (decErr) {
              console.warn("Decode warn:", decErr);
            }
          }
        }

        setTimeout(() => {
          try {
            printBtnLabel.innerText = "프린터 출력 중...";
            window.print();
            printBtnLabel.innerText = "출력 완료!";
            showToast("영수증 인쇄가 시작되었습니다! ✨", "🎉");

            setTimeout(() => {
              printActionBtn.disabled = false;
              printBtnLabel.innerText = "블루투스로 인쇄하기";
              resetBoothToCamera();
            }, 3000);
          } catch (printErr) {
            console.error("Print call error:", printErr);
            showToast("인쇄 호출 실패: " + printErr.message, "⚠️");
            printActionBtn.disabled = false;
            printBtnLabel.innerText = "다시 인쇄 시도";
          }
        }, 200);

      } catch (err) {
        console.error("Print Pipeline Error:", err);
        showToast("인쇄 처리 중 오류: " + err.message, "⚠️");
        printActionBtn.disabled = false;
        printBtnLabel.innerText = "다시 인쇄 시도";
      }
    }

    // ------------------------------------------------------------
    // [7] 1컷 촬영 시퀀스 (3초 카운트다운 -> 플래시 -> 컬러 합성)
    // ------------------------------------------------------------
    async function runShootingSequence() {
      startShootBtn.disabled = true;
      singleCapturedFrame = null;

      shotStatusHud.innerText = `SHOT [ 1 / 1 ]`;

      // 3초 카운트다운
      countdownBox.style.display = 'flex';
      for (let c = 3; c >= 1; c--) {
        countdownNumber.innerText = c;
        await sleep(1000);
      }
      countdownBox.style.display = 'none';

      // 플래시 효과
      cameraFlashOverlay.classList.remove('flash-active');
      void cameraFlashOverlay.offsetWidth;
      cameraFlashOverlay.classList.add('flash-active');

      // 웹캠 1컷 캡처
      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = webcamView.videoWidth || 1280;
      frameCanvas.height = webcamView.videoHeight || 720;
      const fCtx = frameCanvas.getContext('2d');

      // 웹캠 거울 모드 반영
      fCtx.translate(frameCanvas.width, 0);
      fCtx.scale(-1, 1);
      fCtx.drawImage(webcamView, 0, 0, frameCanvas.width, frameCanvas.height);

      singleCapturedFrame = frameCanvas;

      await sleep(400);

      // [핵심] 컬러 모드로 영수증 미리보기 합성 생성
      generateCompositeColorSticker();

      captureSection.style.display = 'none';
      resultSection.style.display = 'flex';
      printActionBtn.disabled = false;
      printBtnLabel.innerText = "블루투스로 인쇄하기";

      // 45초 후 자동 복귀
      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(resetBoothToCamera, CONFIG.AUTO_RESET_SECONDS * 1000);
    }

    function resetBoothToCamera() {
      clearTimeout(autoResetTimer);
      resultSection.style.display = 'none';
      captureSection.style.display = 'flex';
      startShootBtn.disabled = false;
      shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
      singleCapturedFrame = null;
    }

    // ------------------------------------------------------------
    // [8] 웹캠 초기화 (안전 다단계 폴백)
    // ------------------------------------------------------------
    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: false
        });
        webcamView.srcObject = stream;
        shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          webcamView.srcObject = fallbackStream;
          shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
        } catch (err2) {
          console.error("Camera Init Error:", err2);
          shotStatusHud.innerText = "CAMERA ERROR";
          showToast("카메라 권한을 확인해주세요.", "⚠️");
        }
      }
    }

    // ------------------------------------------------------------
    // [9] 전체화면 토글
    // ------------------------------------------------------------
    function toggleFullscreen() {
      const doc = document.documentElement;
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);

      if (!isFull) {
        if (doc.requestFullscreen) doc.requestFullscreen();
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function syncFullscreenUI() {
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const icon = document.getElementById('fullscreenIconSvg');
      if (isFull) {
        icon.innerHTML = '<path d="M14 14h5v2h-3v3h-2v-5m-4 0v5H8v-3H5v-2h5m4-9v5h5V8h-3V5h-2m-6 3V5H6v3h3v2H4V8h4Z"/>';
      } else {
        icon.innerHTML = '<path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>';
      }
    }

    document.addEventListener('fullscreenchange', syncFullscreenUI);
    document.addEventListener('webkitfullscreenchange', syncFullscreenUI);

    // ------------------------------------------------------------
    // [10] 유틸리티
    // ------------------------------------------------------------
    function showToast(msg, icon = "✨") {
      const toast = document.getElementById('appToast');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.style.opacity = '1';

      setTimeout(() => {
        toast.style.opacity = '0';
      }, 3200);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.onload = initWebcam;
  </script>
</body>
