<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 AI·SW체험 수피아여고 포토부스</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Pretendard Webfont -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <!-- Epson ePOS-SDK (TM-m30II 감열 프린터 직결 지원) -->
  <script src="https://cdn.jsdelivr.net/npm/epson-epos-sdk@2.14.0/index.min.js"></script>

  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #111a2e 0%, #080d18 60%, #03060c 100%);
      color: #f8fafc;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* 카메라 거울 모드 (좌우 반전) */
    .mirror-mode {
      transform: scaleX(-1);
    }

    /* 뷰파인더 사각 코너 브래킷 (테두리 안쪽으로 살짝 배치) */
    .corner-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #38bdf8;
      pointer-events: none;
      z-index: 10;
    }
    .corner-tl { top: 12px; left: 12px; border-top: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-tr { top: 12px; right: 12px; border-top: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }

    /* 카메라 플래시 번쩍임 애니메이션 */
    @keyframes flashEffect {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: flashEffect 0.35s ease-out forwards;
    }

    /* 영수증 종이 하단 톱니 절취선 데코 */
    .receipt-edge {
      position: relative;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    }
    .receipt-edge::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 10px;
      background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
      background-size: 14px 14px;
      transform: rotate(180deg);
    }

    /* 브라우저 기본 인쇄창 대응 스타일 */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #browserPrintZone, #browserPrintZone * {
        visibility: visible !important;
      }
      #browserPrintZone {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 79mm !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #browserPrintZone img {
        width: 100% !important;
        height: auto !important;
        display: block !important;
      }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-2 sm:p-3 select-none w-screen h-screen">

  <!-- 1. 상단 헤더 (제목, 안내문, 전체화면 버튼) -->
  <header class="w-full flex-shrink-0 flex items-center justify-between px-3 pt-5 sm:pt-6 pb-1 mt-1 sm:mt-2 mb-1 z-20">
    <!-- 좌측 투명 밸런스 박스 -->
    <div class="w-10 sm:w-24 hidden sm:block"></div>

    <!-- 중앙 타이틀 블록 -->
    <div class="flex-1 flex flex-col items-center justify-center text-center">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <i class="fa-solid fa-camera text-sky-400 text-base sm:text-xl drop-shadow-[0_0_8px_rgba(56,189,248,0.7)] animate-pulse"></i>
        <h1 class="text-xl sm:text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-teal-300 to-sky-300 tracking-tight">
          2026 AI·SW체험 수피아여고 포토부스
        </h1>
        <i class="fa-solid fa-wand-magic-sparkles text-teal-300 text-base sm:text-xl drop-shadow-[0_0_8px_rgba(45,212,191,0.7)] animate-pulse"></i>
      </div>
      <p class="text-xs sm:text-sm text-slate-400 font-medium mt-1 tracking-wide">
        화면을 보고 3가지 포즈를 취하면 영수증포토가 바로 인쇄됩니다!!
      </p>
    </div>

    <!-- 우측 전체화면 토글 버튼 -->
    <div class="w-auto sm:w-24 flex justify-end">
      <button id="fullscreenToggleBtn" onclick="toggleFullscreen()"
              title="전체화면 전환"
              class="px-3 py-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-600 rounded-xl text-xs flex items-center gap-1.5 transition-all shadow-md active:scale-95">
        <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
        <span id="fullscreenText" class="hidden md:inline font-mono">전체화면</span>
      </button>
    </div>
  </header>

  <!-- 2. 메인 컨텐츠 영역 (뷰파인더 대기 화면 vs 영수증 결과 화면) -->
  <main class="w-full max-w-6xl flex-1 flex flex-col items-center justify-center min-h-0 relative my-0.5 px-2">
    
    <!-- [A] 촬영 대기 및 진행 화면 (가변형 유연 뷰파인더) -->
    <div id="captureSection" class="w-full h-full flex flex-col items-center justify-between gap-1.5 min-h-0 pt-0.5 sm:pt-1">
      
      <!-- 유연한 가변 뷰파인더 프레임 (남은 세로 공간에 반응, 직각 사각 프레임) -->
      <div class="relative w-full max-w-4xl flex-1 min-h-[36vh] max-h-[64vh] bg-black rounded-none border-[3px] border-slate-700 shadow-2xl flex items-center justify-center ring-1 ring-sky-500/40 overflow-hidden">
        
        <!-- 사각 테크니컬 코너 브래킷 (내부 배치) -->
        <div class="corner-bracket corner-tl"></div>
        <div class="corner-bracket corner-tr"></div>
        <div class="corner-bracket corner-bl"></div>
        <div class="corner-bracket corner-br"></div>

        <!-- 실시간 웹캠 비디오 엘리먼트 (직각 사각 모드) -->
        <video id="webcamView" autoplay playsinline muted class="w-full h-full object-cover mirror-mode rounded-none"></video>

        <!-- 카메라 플래시 레이어 -->
        <div id="cameraFlashOverlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-30"></div>

        <!-- 상단 테크니컬 HUD 텍스트 (순백색, font-normal, 밸런스 여백) -->
        <div class="absolute top-4 left-9 right-9 flex items-center justify-between text-xs sm:text-sm font-mono text-white pointer-events-none z-10 font-normal">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-white rounded-full animate-ping"></span>
            <span>LIVE // READY</span>
          </div>
          <div id="shotStatusHud" class="tracking-widest">
            SHOT [ 0 / 3 ]
          </div>
        </div>

        <!-- 중앙 조준선 (Crosshair 데코레이션) -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-25">
          <div class="w-8 h-[1px] bg-white"></div>
          <div class="h-8 w-[1px] bg-white absolute"></div>
        </div>

        <!-- 하단 테크니컬 HUD 텍스트 (순백색, font-normal, 밸런스 여백) -->
        <div class="absolute bottom-4 left-9 right-9 flex items-center justify-between text-xs sm:text-sm font-mono text-white pointer-events-none z-10 font-normal">
          <div class="tracking-wide">
            SPEER 인공지능공학연구반
          </div>
          <div class="tracking-wide">
            CAM-01
          </div>
        </div>

        <!-- 카운트다운 오버레이 (블러 없이 선명하게 비디오 투시) -->
        <div id="countdownBox" class="absolute inset-0 bg-transparent hidden items-center justify-center z-25 pointer-events-none">
          <span id="countdownNumber" class="text-7xl sm:text-9xl font-black text-white drop-shadow-[0_0_25px_rgba(56,189,248,0.95)] animate-bounce font-mono">
            3
          </span>
        </div>
      </div>

      <!-- 뷰파인더 하단 3컷 실시간 썸네일 트레이 (둥근 모서리 슬롯) -->
      <div id="thumbTray" class="w-full max-w-sm sm:max-w-md flex items-center justify-center gap-2 sm:gap-2.5 flex-shrink-0 mt-1 sm:mt-1.5">
        <div id="thumbSlot1" class="flex-1 max-w-[110px] sm:max-w-[125px] aspect-[16/9] bg-slate-900/90 border border-slate-700 rounded-lg flex flex-col items-center justify-center text-[10px] sm:text-xs font-mono text-slate-400 font-normal overflow-hidden transition-all shadow-inner">
          <span class="tracking-widest text-[11px] font-mono text-slate-400">CUT 1</span>
          <span class="text-[9px] text-slate-500 font-mono tracking-tighter">WAITING</span>
        </div>
        <div id="thumbSlot2" class="flex-1 max-w-[110px] sm:max-w-[125px] aspect-[16/9] bg-slate-900/90 border border-slate-700 rounded-lg flex flex-col items-center justify-center text-[10px] sm:text-xs font-mono text-slate-400 font-normal overflow-hidden transition-all shadow-inner">
          <span class="tracking-widest text-[11px] font-mono text-slate-400">CUT 2</span>
          <span class="text-[9px] text-slate-500 font-mono tracking-tighter">WAITING</span>
        </div>
        <div id="thumbSlot3" class="flex-1 max-w-[110px] sm:max-w-[125px] aspect-[16/9] bg-slate-900/90 border border-slate-700 rounded-lg flex flex-col items-center justify-center text-[10px] sm:text-xs font-mono text-slate-400 font-normal overflow-hidden transition-all shadow-inner">
          <span class="tracking-widest text-[11px] font-mono text-slate-400">CUT 3</span>
          <span class="text-[9px] text-slate-500 font-mono tracking-tighter">WAITING</span>
        </div>
      </div>

      <!-- 3컷 촬영 시작하기 버튼 (둥근 모서리 rounded-xl 복원) -->
      <button id="startShootBtn" onclick="runShootingSequence()"
              class="w-full max-w-md py-3 sm:py-3.5 px-6 bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-black text-base sm:text-lg tracking-wider rounded-xl border border-sky-300/40 shadow-xl shadow-sky-950/60 active:scale-[0.98] transition-all flex items-center justify-center gap-2.5 mt-0.5 flex-shrink-0 cursor-pointer">
        <i class="fa-solid fa-camera text-base animate-pulse"></i>
        <span>3컷 촬영 시작하기</span>
      </button>

    </div>

    <!-- [B] 결과 화면 (영수증 스티커 미리보기 + 인쇄/재촬영 버튼) -->
    <div id="resultSection" class="hidden w-full h-full flex flex-col md:flex-row items-center justify-center gap-6 md:gap-10 min-h-0 px-2 mt-2 sm:mt-3">
      
      <!-- 좌측: 영수증 스티커 실물 캔버스 미리보기 (화면 밖으로 나가지 않도록 세로 높이 기준 비례 핏 설정) -->
      <div class="h-[58vh] sm:h-[64vh] max-h-[580px] w-auto flex items-center justify-center p-2 sm:p-2.5 bg-slate-900/90 border border-slate-700/80 rounded-2xl shadow-2xl relative flex-shrink-0">
        <div class="receipt-edge h-full w-auto flex flex-col items-center justify-center overflow-hidden p-1.5 sm:p-2">
          <canvas id="stickerDisplayCanvas" width="576" height="1320" 
                  class="h-full w-auto max-w-[260px] sm:max-w-[300px] object-contain block select-none pointer-events-none shadow-sm"></canvas>
        </div>
      </div>

      <!-- 우측: 안내 텍스트 및 메인 버튼 그룹 (수직 중앙 정렬) -->
      <div class="flex flex-col justify-center items-start text-left gap-3.5 sm:gap-4 max-w-sm md:max-w-md w-full self-center">
        
        <div class="space-y-1.5 sm:space-y-2">
          <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight flex items-center gap-2">
            <span>🎉 스티커 사진이 완성되었습니다!</span>
          </h2>
          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal">
            사진을 확인한 후 아래 <strong class="text-sky-400">[인쇄하기]</strong> 버튼을 누르면 감열 영수증 프린터에서 스티커로 즉시 출력됩니다.
          </p>
        </div>

        <!-- 조작 버튼 2개: 인쇄하기 & 다시 촬영하기 (둥근 모서리 rounded-xl) -->
        <div class="w-full flex flex-col gap-2.5 mt-1">
          <!-- 1) 인쇄하기 버튼 -->
          <button id="printActionBtn" onclick="printReceiptSticker()"
                  class="w-full py-3.5 px-6 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-base sm:text-lg tracking-wide rounded-xl border border-emerald-300/40 shadow-xl shadow-emerald-950/60 active:scale-[0.98] transition-all flex items-center justify-center gap-2.5 cursor-pointer">
            <i class="fa-solid fa-print text-lg"></i>
            <span id="printBtnLabel">인쇄하기</span>
          </button>
          
          <!-- 2) 다시 촬영하기 버튼 -->
          <button id="retakeActionBtn" onclick="resetBoothToCamera()"
                  class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-base sm:text-lg tracking-wide rounded-xl border border-slate-600 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-rotate-right text-base"></i>
            <span>다시 촬영하기</span>
          </button>
        </div>

        <div class="text-[11px] text-slate-500 font-mono">
          * 45초 동안 입력이 없으면 처음 대기 화면으로 자동 복귀합니다.
        </div>

      </div>

    </div>

  </main>

  <!-- 3. 백그라운드 캔버스 및 인쇄 폴백 영역 -->
  <!-- 감열 프린터 하드웨어 전송용 흑백 디더링 캔버스 -->
  <canvas id="thermalStripCanvas" width="576" height="1320" class="hidden"></canvas>

  <!-- 브라우저 표준 인쇄 폴백 영역 -->
  <div id="browserPrintZone" class="hidden">
    <img id="browserPrintImg" src="" alt="print-strip" />
  </div>

  <!-- 인앱 토스트 알림창 -->
  <div id="appToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-sky-400/60 text-white px-5 py-2.5 shadow-2xl transition-all duration-300 opacity-0 pointer-events-none text-xs sm:text-sm font-bold flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">안내 메시지</span>
  </div>

  <script>
    // ==========================================
    // 1. 시스템 설정 (CONFIG)
    // ==========================================
    const CONFIG = {
      PRINTER_IP: '172.16.10.1', // Epson TM-m30II 프린터 IP
      PRINTER_PORT: '8008',       // ePOS HTTP 포트 (기본 8008)
      AUTO_RESET_SECONDS: 45,     // 미조작 시 자동 초기화 시간
      FESTIVAL_TITLE: '2026 AI·SW 체험 한마당',
      CLUB_NAME: 'SPEER 인공지능공학연구반'
    };

    // DOM 요소 바인딩
    const webcamView = document.getElementById('webcamView');
    const captureSection = document.getElementById('captureSection');
    const resultSection = document.getElementById('resultSection');
    const shotStatusHud = document.getElementById('shotStatusHud');
    const countdownBox = document.getElementById('countdownBox');
    const countdownNumber = document.getElementById('countdownNumber');
    const cameraFlashOverlay = document.getElementById('cameraFlashOverlay');
    const startShootBtn = document.getElementById('startShootBtn');
    const printActionBtn = document.getElementById('printActionBtn');
    const printBtnLabel = document.getElementById('printBtnLabel');
    const displayCanvas = document.getElementById('stickerDisplayCanvas');
    const displayCtx = displayCanvas.getContext('2d');
    const thermalCanvas = document.getElementById('thermalStripCanvas');
    const thermalCtx = thermalCanvas.getContext('2d');
    const browserPrintImg = document.getElementById('browserPrintImg');

    let capturedFrames = [];
    let autoResetTimer = null;

    // ==========================================
    // 2. 웹캠 연결 초기화 (16:9 와이드 모드)
    // ==========================================
    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'user'
          },
          audio: false
        });
        webcamView.srcObject = stream;
        shotStatusHud.innerText = "SHOT [ 0 / 3 ]";
      } catch (err) {
        console.error("Camera Init Error:", err);
        shotStatusHud.innerText = "CAMERA ERROR";
        showToast("카메라 권한을 확인해주세요.", "⚠️");
      }
    }

    // ==========================================
    // 3. 3컷 순차 촬영 시퀀스
    // ==========================================
    async function runShootingSequence() {
      capturedFrames = [];
      startShootBtn.disabled = true;
      startShootBtn.classList.add('opacity-50', 'pointer-events-none');
      clearTimeout(autoResetTimer);

      // 썸네일 슬롯 초기화
      for (let i = 1; i <= 3; i++) {
        const slot = document.getElementById(`thumbSlot${i}`);
        slot.innerHTML = `<span class="tracking-widest text-[11px] font-mono text-slate-400">CUT ${i}</span><span class="text-[9px] text-slate-500 font-mono tracking-tighter">WAITING</span>`;
        slot.classList.remove('border-sky-400', 'ring-2', 'ring-sky-400/50');
      }

      for (let cut = 1; cut <= 3; cut++) {
        shotStatusHud.innerText = `SHOT [ ${cut} / 3 ]`;
        await runCountdown(3);

        // 플래시 & 캡처
        flashScreen();
        captureWebcamFrame(cut);
        await sleep(650);
      }

      shotStatusHud.innerText = "RENDERING...";
      await sleep(300);

      // 영수증 스티커 합성 렌더링 후 화면 전환
      renderFullSticker();
      switchToResultView();
    }

    function runCountdown(seconds) {
      return new Promise((resolve) => {
        countdownBox.classList.remove('hidden');
        countdownBox.classList.add('flex');
        let current = seconds;
        countdownNumber.innerText = current;

        const interval = setInterval(() => {
          current--;
          if (current > 0) {
            countdownNumber.innerText = current;
          } else {
            clearInterval(interval);
            countdownBox.classList.add('hidden');
            countdownBox.classList.remove('flex');
            resolve();
          }
        }, 1000);
      });
    }

    function flashScreen() {
      cameraFlashOverlay.classList.add('flash-active');
      setTimeout(() => {
        cameraFlashOverlay.classList.remove('flash-active');
      }, 350);
    }

    function captureWebcamFrame(cutIndex) {
      const snap = document.createElement('canvas');
      snap.width = 544;
      snap.height = 272; // 와이드 2:1 비율
      const sCtx = snap.getContext('2d');

      // 사용자 거울 모드 보정 (좌우 반전)
      sCtx.save();
      sCtx.translate(snap.width, 0);
      sCtx.scale(-1, 1);
      sCtx.drawImage(webcamView, 0, 0, snap.width, snap.height);
      sCtx.restore();

      capturedFrames.push(snap);

      // 하단 썸네일 트레이 실시간 업데이트
      const thumbSlot = document.getElementById(`thumbSlot${cutIndex}`);
      if (thumbSlot) {
        thumbSlot.innerHTML = '';
        const img = document.createElement('img');
        img.src = snap.toDataURL('image/jpeg', 0.85);
        img.className = 'w-full h-full object-cover';
        thumbSlot.appendChild(img);
        thumbSlot.classList.add('border-sky-400', 'ring-2', 'ring-sky-400/50');
      }
    }

    // ==========================================
    // 4. 영수증 스티커 캔버스 합성 (576 x 1320px)
    // ==========================================
    function renderFullSticker() {
      const w = displayCanvas.width;
      const h = displayCanvas.height;

      // 1) 바탕 종이
      displayCtx.fillStyle = "#FFFFFF";
      displayCtx.fillRect(0, 0, w, h);

      // 2) 상단 헤더 데코레이션
      displayCtx.fillStyle = "#334155";
      displayCtx.textAlign = "center";
      displayCtx.font = "bold 13px monospace";
      displayCtx.fillText("◆ ◆ ◆  SPEER 인공지능공학연구반  ◆ ◆ ◆", w / 2, 38);

      displayCtx.fillStyle = "#0f172a";
      displayCtx.font = "900 27px 'Pretendard', sans-serif";
      displayCtx.fillText(CONFIG.FESTIVAL_TITLE, w / 2, 72);

      displayCtx.fillStyle = "#475569";
      displayCtx.font = "bold 15px monospace";
      displayCtx.fillText("― PHOTO STICKER MEMORY ―", w / 2, 98);

      displayCtx.font = "14px monospace";
      displayCtx.fillText("■ ------------------------------------ ■", w / 2, 118);

      // 3) 3컷 와이드 사각 사진 및 테크니컬 장식
      const startY = 136;
      const photoWidth = 544;
      const photoHeight = 272;
      const photoX = (w - photoWidth) / 2;
      const photoGap = 300;

      capturedFrames.forEach((frame, idx) => {
        const curY = startY + (idx * photoGap);

        // 사진 테두리 (블랙 아웃라인)
        displayCtx.fillStyle = "#0f172a";
        displayCtx.fillRect(photoX - 4, curY - 4, photoWidth + 8, photoHeight + 8);

        // 원본 사진 드로잉
        displayCtx.drawImage(frame, photoX, curY, photoWidth, photoHeight);

        // 사진 코너 L자 브래킷 (화이트)
        displayCtx.strokeStyle = "#FFFFFF";
        displayCtx.lineWidth = 3;
        const cSize = 16;

        displayCtx.beginPath();
        displayCtx.moveTo(photoX + 8, curY + 8 + cSize);
        displayCtx.lineTo(photoX + 8, curY + 8);
        displayCtx.lineTo(photoX + 8 + cSize, curY + 8);
        displayCtx.stroke();

        displayCtx.beginPath();
        displayCtx.moveTo(photoX + photoWidth - 8 - cSize, curY + photoHeight - 8);
        displayCtx.lineTo(photoX + photoWidth - 8, curY + photoHeight - 8);
        displayCtx.lineTo(photoX + photoWidth - 8, curY + photoHeight - 8 - cSize);
        displayCtx.stroke();

        // 좌상단 CUT 배지
        displayCtx.fillStyle = "#0f172a";
        displayCtx.fillRect(photoX + 8, curY + 8, 86, 24);
        displayCtx.fillStyle = "#38bdf8";
        displayCtx.font = "900 13px monospace";
        displayCtx.textAlign = "left";
        displayCtx.fillText(`[CUT #${idx + 1}]`, photoX + 16, curY + 25);

        // 우상단 AI MEMORY 배지
        displayCtx.fillStyle = "#0f172a";
        displayCtx.fillRect(photoX + photoWidth - 110, curY + 8, 102, 24);
        displayCtx.fillStyle = "#f43f5e";
        displayCtx.textAlign = "right";
        displayCtx.font = "bold 12px sans-serif";
        displayCtx.fillText("★ AI MEMORY", photoX + photoWidth - 16, curY + 25);
      });

      // 4) 하단 푸터 영역
      const footerY = startY + (3 * photoGap) + 8;
      displayCtx.fillStyle = "#0f172a";
      displayCtx.textAlign = "center";
      displayCtx.font = "15px monospace";
      displayCtx.fillText("=======================================", w / 2, footerY);

      const now = new Date();
      const dateString = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      displayCtx.font = "900 20px 'Pretendard', sans-serif";
      displayCtx.fillText("SPEER 인공지능공학연구반", w / 2, footerY + 28);

      displayCtx.font = "14px monospace";
      displayCtx.fillStyle = "#334155";
      displayCtx.fillText(`LOG_TIME: ${dateString}`, w / 2, footerY + 50);
      displayCtx.fillText("REMEMBER THIS SPECIAL MOMENT! ✨", w / 2, footerY + 70);

      // 바코드 생성
      drawBarcodePattern(displayCtx, (w - 360) / 2, footerY + 86, 360, 40);

      displayCtx.font = "12px monospace";
      displayCtx.fillText(`RECEIPT NO. SP-${Math.floor(100000 + Math.random() * 900000)}`, w / 2, footerY + 142);

      // 하단 마감 라인
      displayCtx.fillStyle = "#0f172a";
      displayCtx.fillRect(16, h - 16, w - 32, 3);

      // 브라우저 인쇄용 이미지 동기화
      browserPrintImg.src = displayCanvas.toDataURL('image/png');
    }

    function drawBarcodePattern(ctx, x, y, width, height) {
      ctx.fillStyle = "#000000";
      let curX = x;
      while (curX < x + width) {
        const barW = Math.floor(Math.random() * 4) + 1;
        ctx.fillRect(curX, y, barW, height);
        curX += barW + Math.floor(Math.random() * 3) + 1;
      }
    }

    // ==========================================
    // 5. 감열지 전용 흑백 디더링 (Floyd-Steinberg)
    // ==========================================
    function createDitheredImageData() {
      const w = thermalCanvas.width;
      const h = thermalCanvas.height;

      thermalCtx.drawImage(displayCanvas, 0, 0);
      const imgData = thermalCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const oldVal = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
          const newVal = oldVal < 128 ? 0 : 255;

          data[idx] = newVal;
          data[idx + 1] = newVal;
          data[idx + 2] = newVal;

          const error = oldVal - newVal;
          if (x + 1 < w) data[idx + 4] += error * (7 / 16);
          if (x - 1 >= 0 && y + 1 < h) data[(y + 1) * w * 4 + (x - 1) * 4] += error * (3 / 16);
          if (y + 1 < h) data[(y + 1) * w * 4 + x * 4] += error * (5 / 16);
          if (x + 1 < w && y + 1 < h) data[(y + 1) * w * 4 + (x + 1) * 4] += error * (1 / 16);
        }
      }
      thermalCtx.putImageData(imgData, 0, 0);
    }

    // ==========================================
    // 6. 인쇄 실행 로직 (Epson TM-m30II & 폴백)
    // ==========================================
    function printReceiptSticker() {
      printActionBtn.disabled = true;
      printBtnLabel.innerText = "인쇄 진행 중...";
      clearTimeout(autoResetTimer);

      createDitheredImageData();

      if (typeof epson === 'undefined') {
        runSystemPrintFallback();
        return;
      }

      showToast("프린터로 데이터를 전송하고 있습니다...", "⏳");
      const ePosDev = new epson.ePOSDevice();

      ePosDev.connect(CONFIG.PRINTER_IP, CONFIG.PRINTER_PORT, (status) => {
        if (status === 'OK' || status === 'SSL_CONNECT_OK') {
          ePosDev.createDevice('local_printer', ePosDev.DEVICE_TYPE_PRINTER, { crypto: false, buffer: false }, (printer, code) => {
            if (printer) {
              printer.addAlign(printer.ALIGN_CENTER);
              printer.addImage(thermalCtx, 0, 0, thermalCanvas.width, thermalCanvas.height, printer.COLOR_1, printer.MODE_MONO);
              printer.addFeedLine(3);
              printer.addCut(printer.CUT_FEED);
              printer.send();

              setTimeout(() => {
                try { ePosDev.disconnect(); } catch (e) {}
                showToast("출력이 완료되었습니다! 스티커를 확인하세요.", "🎉");
                setTimeout(resetBoothToCamera, 3500);
              }, 1500);
            } else {
              console.warn("Device creation error:", code);
              runSystemPrintFallback();
            }
          });
        } else {
          console.warn("Direct connection failed:", status);
          runSystemPrintFallback();
        }
      });
    }

    function runSystemPrintFallback() {
      showToast("시스템 인쇄 창으로 연결합니다.", "🖨️");
      setTimeout(() => {
        window.print();
        printActionBtn.disabled = false;
        printBtnLabel.innerText = "인쇄하기";
        setTimeout(resetBoothToCamera, 5000);
      }, 400);
    }

    // ==========================================
    // 7. 화면 전환 및 초기화 제어
    // ==========================================
    function switchToResultView() {
      captureSection.classList.add('hidden');
      resultSection.classList.remove('hidden');
      printActionBtn.disabled = false;
      printBtnLabel.innerText = "인쇄하기";

      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(() => {
        showToast("대기 시간이 초과되어 처음 화면으로 돌아갑니다.", "⏱️");
        resetBoothToCamera();
      }, CONFIG.AUTO_RESET_SECONDS * 1000);
    }

    function resetBoothToCamera() {
      clearTimeout(autoResetTimer);
      resultSection.classList.add('hidden');
      captureSection.classList.remove('hidden');

      for (let i = 1; i <= 3; i++) {
        const slot = document.getElementById(`thumbSlot${i}`);
        slot.innerHTML = `<span class="tracking-widest text-[11px] font-mono text-slate-400">CUT ${i}</span><span class="text-[9px] text-slate-500 font-mono tracking-tighter">WAITING</span>`;
        slot.classList.remove('border-sky-400', 'ring-2', 'ring-sky-400/50');
      }

      startShootBtn.disabled = false;
      startShootBtn.classList.remove('opacity-50', 'pointer-events-none');
      shotStatusHud.innerText = "SHOT [ 0 / 3 ]";
    }

    // ==========================================
    // 8. 전체화면 토글 및 이벤트 감지
    // ==========================================
    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(err => console.log(err));
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => console.log(err));
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function syncFullscreenUI() {
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const icon = document.getElementById('fullscreenIcon');
      const text = document.getElementById('fullscreenText');
      if (isFull) {
        icon.className = "fa-solid fa-compress";
        text.innerText = "창모드";
      } else {
        icon.className = "fa-solid fa-expand";
        text.innerText = "전체화면";
      }
    }

    document.addEventListener('fullscreenchange', syncFullscreenUI);
    document.addEventListener('webkitfullscreenchange', syncFullscreenUI);

    // ==========================================
    // 9. 유틸리티 함수
    // ==========================================
    function showToast(msg, icon = "✨") {
      const toast = document.getElementById('appToast');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 3000);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 창 로드 시 카메라 실행
    window.onload = initWebcam;
  </script>
