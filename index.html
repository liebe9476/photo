<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI·SW 축제 포토스티커 부스</title>
  
  <!-- Tailwind CSS & Font Awesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 엡손 ePOS-SDK (TM-m30II 인쇄 제어 라이브러리) -->
  <script src="https://cdn.jsdelivr.net/npm/epson-epos-sdk@2.14.0/index.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg-dark: #090d16;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      overflow: hidden; /* 가로모드 태블릿에서 스크롤 없이 한 화면에 딱 맞춤 */
    }

    /* 전면 카메라 거울 모드 */
    .mirror-mode {
      transform: scaleX(-1);
    }

    /* 사각 프레임 테크니컬 코너 브래킷 */
    .corner-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 15;
    }
    .corner-tl {
      top: 10px;
      left: 10px;
      border-top: 3px solid #38bdf8;
      border-left: 3px solid #38bdf8;
    }
    .corner-tr {
      top: 10px;
      right: 10px;
      border-top: 3px solid #38bdf8;
      border-right: 3px solid #38bdf8;
    }
    .corner-bl {
      bottom: 10px;
      left: 10px;
      border-bottom: 3px solid #38bdf8;
      border-left: 3px solid #38bdf8;
    }
    .corner-br {
      bottom: 10px;
      right: 10px;
      border-bottom: 3px solid #38bdf8;
      border-right: 3px solid #38bdf8;
    }

    /* 미세 뷰파인더 십자선 */
    .crosshair-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 12;
      opacity: 0.35;
    }
    .crosshair-center::before {
      content: "";
      position: absolute;
      top: 19px;
      left: 0;
      width: 40px;
      height: 2px;
      background: #38bdf8;
    }
    .crosshair-center::after {
      content: "";
      position: absolute;
      top: 0;
      left: 19px;
      width: 2px;
      height: 40px;
      background: #38bdf8;
    }

    /* 플래시 애니메이션 */
    @keyframes shutter-flash {
      0% { opacity: 0; }
      50% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: shutter-flash 0.35s ease-out;
    }

    /* 컬러 스티커 영수증 톱니바퀴 엣지 (사각 베이스) */
    .receipt-edge {
      background: #ffffff;
      position: relative;
    }
    .receipt-edge::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 0;
      right: 0;
      height: 12px;
      background: linear-gradient(135deg, transparent 75%, #ffffff 75%) 0 0,
                  linear-gradient(225deg, transparent 75%, #ffffff 75%) 0 0;
      background-size: 14px 12px;
      background-repeat: repeat-x;
    }
  </style>
<body class="h-screen w-screen flex flex-col justify-between p-3 sm:p-4 md:px-8 antialiased selection:bg-sky-500 selection:text-white overflow-hidden">

  <!-- 헤더: 타이틀과 설명 모두 완벽한 중앙(Center) 정렬 -->
  <header class="w-full max-w-5xl mx-auto flex flex-col items-center justify-center text-center py-1 sm:py-2 border-b border-slate-800/80 flex-shrink-0">
    <div class="flex items-center justify-center gap-2 sm:gap-3">
      <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-base sm:text-xl shadow-md shadow-sky-500/25 flex-shrink-0">
        <i class="fa-solid fa-camera-retro"></i>
      </div>
      <h1 class="text-lg sm:text-2xl md:text-3xl font-black tracking-tight text-white">
        2026 AI·SW체험 수피아여고 포토부스
      </h1>
    </div>
    <p class="text-xs sm:text-sm text-slate-400 mt-1 font-medium">
      화면을 보고 3가지 포즈를 취하면 영수증포토가 바로 인쇄됩니다!!
    </p>
  </header>

  <!-- 메인 영역: 가로모드에서 높이를 초과하지 않도록 flex-1 및 flex 레이아웃으로 유연하게 축소/확장 -->
  <main class="w-full max-w-5xl mx-auto flex-1 flex flex-col items-center justify-center my-1 sm:my-2 relative min-h-0 overflow-hidden">
    
    <!-- 1. 카메라 촬영 화면 (사각 모서리 + 테크니컬 프레임 데코레이션) -->
    <div id="cameraSection" class="w-full h-full flex flex-col items-center justify-center gap-2 transition-all duration-300 min-h-0">
      <div class="relative h-full max-h-[62vh] aspect-[4/3] bg-black rounded-none border-[3px] sm:border-4 border-slate-700 shadow-2xl shadow-sky-950/40 flex items-center justify-center ring-1 ring-sky-500/40">
        
        <!-- 사각 프레임 4코너 브래킷 장식 -->
        <div class="corner-bracket corner-tl"></div>
        <div class="corner-bracket corner-tr"></div>
        <div class="corner-bracket corner-bl"></div>
        <div class="corner-bracket corner-br"></div>

        <!-- 뷰파인더 중앙 십자선 타겟 -->
        <div class="crosshair-center"></div>

        <!-- 하단 미래지향 테크 레터링 라인 -->
        <div class="absolute bottom-2.5 left-4 right-4 z-10 flex items-center justify-between text-[11px] sm:text-xs font-mono tracking-widest text-sky-400/80 pointer-events-none">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 bg-sky-400 animate-pulse"></span>
            <span>SPEER 인공지능공학연구반 // CAM-01</span>
          </div>
          <span class="hidden sm:inline">RES: 1080P // SENSOR ACTIVE</span>
        </div>

        <!-- 웹캠 스트림 -->
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover mirror-mode"></video>

        <!-- 플래시 효과 오버레이 -->
        <div id="flashOverlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-20"></div>

        <!-- 카메라 격자 가이드 -->
        <div class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 opacity-15 border border-white/40">
          <div class="border-r border-b border-white"></div>
          <div class="border-r border-b border-white"></div>
          <div class="border-b border-white"></div>
          <div class="border-r border-b border-white"></div>
          <div class="border-r border-b border-white"></div>
          <div class="border-b border-white"></div>
          <div class="border-r border-b border-white"></div>
          <div class="border-r border-b border-white"></div>
          <div></div>
        </div>

        <!-- 안내 상태 배지 (사각 형태) -->
        <div id="statusBadge" class="absolute top-3 left-4 z-10 flex items-center gap-2 bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-none border border-sky-500/40 text-xs sm:text-sm font-semibold text-white shadow">
          <span class="w-2.5 h-2.5 bg-emerald-400 animate-ping"></span>
          <span id="statusText">카메라 준비 완료</span>
        </div>

        <!-- 촬영 컷수 인디케이터 (사각 블록 형태) -->
        <div id="shotStepIndicator" class="absolute top-3 right-4 z-10 hidden flex gap-1.5 sm:gap-2">
          <div id="stepDot1" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-none bg-white/30 border border-white/40"></div>
          <div id="stepDot2" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-none bg-white/30 border border-white/40"></div>
          <div id="stepDot3" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-none bg-white/30 border border-white/40"></div>
        </div>

        <!-- 카운트다운 오버레이 -->
        <div id="countdownOverlay" class="absolute inset-0 z-30 bg-black/55 backdrop-blur-sm hidden flex-col items-center justify-center select-none">
          <span id="countdownNumber" class="text-8xl sm:text-9xl font-black text-white drop-shadow-[0_0_40px_rgba(56,189,248,0.9)] animate-bounce">
            3
          </span>
          <p id="countdownMessage" class="text-base sm:text-xl font-bold text-sky-300 mt-1">포즈를 취해주세요!</p>
        </div>
      </div>

      <!-- 하단 실시간 썸네일 스트립 (사각 프레임) -->
      <div id="thumbnailStrip" class="hidden w-full max-w-md flex items-center justify-center gap-2 sm:gap-3 flex-shrink-0">
        <div id="thumbSlot1" class="w-16 h-11 sm:w-20 sm:h-14 rounded-none border-2 border-dashed border-slate-700 bg-slate-900/60 overflow-hidden flex items-center justify-center text-[11px] text-slate-500 font-bold font-mono">1컷</div>
        <div id="thumbSlot2" class="w-16 h-11 sm:w-20 sm:h-14 rounded-none border-2 border-dashed border-slate-700 bg-slate-900/60 overflow-hidden flex items-center justify-center text-[11px] text-slate-500 font-bold font-mono">2컷</div>
        <div id="thumbSlot3" class="w-16 h-11 sm:w-20 sm:h-14 rounded-none border-2 border-dashed border-slate-700 bg-slate-900/60 overflow-hidden flex items-center justify-center text-[11px] text-slate-500 font-bold font-mono">3컷</div>
      </div>
    </div>

    <!-- 2. 결과 화면: 가로 화면에서 세로로 긴 영수증이 잘리지 않도록 높이 100% 맞춤형 설계 -->
    <div id="previewSection" class="hidden w-full h-full flex flex-row items-center justify-center gap-4 md:gap-8 min-h-0 overflow-hidden">
      <!-- 좌측: 세로 크기를 뷰포트에 맞춘 스티커 카드 미리보기 (사각 프레임) -->
      <div class="h-full max-h-[64vh] p-2.5 sm:p-3 receipt-edge rounded-none shadow-2xl shadow-black flex items-center justify-center flex-shrink-0 border-t-4 border-slate-900">
        <img id="receiptPreviewImage" class="h-full w-auto max-w-[260px] sm:max-w-[300px] object-contain drop-shadow-md block rounded-none" alt="컬러 스티커 사진">
      </div>

      <!-- 우측: 축하 메시지 및 안내 문구 -->
      <div class="hidden sm:flex flex-col items-center sm:items-start text-left max-w-xs">
        <span class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-bold text-xs uppercase tracking-wider mb-2">Success</span>
        <h2 class="text-xl sm:text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-300 to-pink-400 leading-tight">
          🎉 스티커 사진이<br class="hidden sm:inline"> 완성되었습니다!
        </h2>
        <p class="text-xs sm:text-sm text-slate-400 mt-2">
          아래 <span class="text-emerald-400 font-bold">[인쇄하기]</span>를 누르면 영수증 스티커로 즉시 출력됩니다!
        </p>
      </div>
    </div>

  </main>

  <!-- 하단 조작 버튼 바 (가로모드에서도 위로 밀리지 않도록 고정 높이 유지) -->
  <footer class="w-full max-w-5xl mx-auto py-1 sm:py-2 flex-shrink-0">
    <!-- 1) 촬영 전: [3컷 촬영 시작] 단일 버튼 -->
    <div id="controlsCamera" class="w-full flex">
      <button id="startBtn" onclick="startPhotoBooth()" class="w-full min-h-[56px] sm:min-h-[64px] rounded-xl sm:rounded-2xl bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-black text-lg sm:text-2xl shadow-xl shadow-sky-600/30 flex items-center justify-center gap-3 transition-transform active:scale-[0.98]">
        <i class="fa-solid fa-camera"></i>
        <span>📸 3컷 촬영 시작하기</span>
      </button>
    </div>

    <!-- 2) 촬영 완료 후: [다시 촬영] + [인쇄하기] 구성 -->
    <div id="controlsPreview" class="hidden w-full flex flex-row gap-3">
      <button id="retryBtn" onclick="resetBooth()" class="flex-1 min-h-[56px] sm:min-h-[64px] rounded-xl sm:rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-base sm:text-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-[0.98]">
        <i class="fa-solid fa-rotate-right"></i>
        <span>🔄 다시 촬영하기</span>
      </button>

      <button id="printBtn" onclick="printReceiptDirectly()" class="flex-[2] min-h-[56px] sm:min-h-[64px] rounded-xl sm:rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black text-lg sm:text-2xl shadow-xl shadow-emerald-700/30 flex items-center justify-center gap-3 transition active:scale-[0.98]">
        <i class="fa-solid fa-print"></i>
        <span id="printBtnText">🖨️ 인쇄하기</span>
      </button>
    </div>
  </footer>

  <!-- 인앱 토스트 알림창 -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-sky-500/50 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none translate-y-3">
    <i id="toastIcon" class="fa-solid fa-circle-check text-sky-400"></i>
    <span id="toastMessage" class="text-sm font-medium">안내 메시지</span>
  </div>

  <!-- 79mm 감열 규격 히든 캔버스 2종 (576 x 1420 px) -->
  <canvas id="colorStripCanvas" width="576" height="1420" class="hidden"></canvas>
  <canvas id="monoPrintCanvas" width="576" height="1420" class="hidden"></canvas>

  <!-- 브라우저 인쇄 대비용 히든 iframe -->
  <iframe id="printFrame" class="hidden" style="position: absolute; width:0; height:0; border:0;"></iframe>

  <script>
    /****************************************************************
     * [사전 설정 영역]
     * 현장 부스 환경에 맞춰 아래 값만 한 번 지정해두면 됩니다.
     ****************************************************************/
    const CONFIG = {
      PRINTER_IP: '192.168.0.50',            // 연결된 Epson TM-m30II Wi-Fi IP 주소
      PRINTER_PORT: '8008',                  // ePOS 포트 (기본 8008, SSL 사용시 8043)
      PRINTER_DEV_ID: 'local_printer',       // 디바이스 ID
      FESTIVAL_TITLE: '🏫 2026 AI·SW 체험 한마당 📸'  // 스티커 상단 출력 타이틀 문구
    };

    // DOM 엘리먼트 참조
    const video = document.getElementById('webcam');
    const colorCanvas = document.getElementById('colorStripCanvas');
    const colorCtx = colorCanvas.getContext('2d');
    const monoCanvas = document.getElementById('monoPrintCanvas');
    const monoCtx = monoCanvas.getContext('2d', { willReadFrequently: true });

    const cameraSection = document.getElementById('cameraSection');
    const previewSection = document.getElementById('previewSection');
    const controlsCamera = document.getElementById('controlsCamera');
    const controlsPreview = document.getElementById('controlsPreview');
    const startBtn = document.getElementById('startBtn');
    const printBtn = document.getElementById('printBtn');
    const printBtnText = document.getElementById('printBtnText');
    const retryBtn = document.getElementById('retryBtn');
    const statusText = document.getElementById('statusText');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownNumber = document.getElementById('countdownNumber');
    const countdownMessage = document.getElementById('countdownMessage');
    const flashOverlay = document.getElementById('flashOverlay');
    const receiptPreviewImage = document.getElementById('receiptPreviewImage');
    const thumbnailStrip = document.getElementById('thumbnailStrip');

    let currentStream = null;
    let capturedFrames = [];
    let isProcessing = false;
    let autoResetTimer = null; // 방치 시 새 방문객 맞이용 자동 리셋 타이머

    // 1. 카메라 시작 (태블릿 전면 카메라 자동 활성화)
    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      statusText.innerText = "카메라 불러오는 중...";

      const constraints = {
        video: {
          facingMode: "user", // 부스용 전면 셀카 모드
          width: { ideal: 1920, min: 1280 },
          height: { ideal: 1080, min: 720 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        statusText.innerText = "카메라 준비 완료! [3컷 촬영 시작]을 누르세요.";
      } catch (err) {
        console.error("Camera Error:", err);
        statusText.innerText = "카메라 권한 필요";
        showToast("카메라 접근 권한이 필요합니다.", "error");
      }
    }

    // 2. 3컷 연속 촬영
    async function startPhotoBooth() {
      if (isProcessing) return;
      isProcessing = true;
      capturedFrames = [];

      startBtn.disabled = true;
      startBtn.classList.add('opacity-50');

      document.getElementById('shotStepIndicator').classList.remove('hidden');
      thumbnailStrip.classList.remove('hidden');
      for (let i = 1; i <= 3; i++) {
        document.getElementById(`stepDot${i}`).className = "w-4 h-4 rounded-none bg-white/30 border border-white/40";
        document.getElementById(`thumbSlot${i}`).innerHTML = `${i}컷`;
      }

      const poseMessages = [
        "첫 번째 포즈! 환하게 웃어보세요 😁",
        "두 번째 포즈! 멋지게 브이 ✌️",
        "마지막 세 번째! 개성 넘치는 포즈 🥳"
      ];

      for (let i = 0; i < 3; i++) {
        document.getElementById(`stepDot${i + 1}`).className = "w-4 h-4 rounded-none bg-sky-400 border border-sky-300 shadow-md shadow-sky-400";
        countdownMessage.innerText = poseMessages[i];
        statusText.innerText = `📸 [${i + 1}/3] ${poseMessages[i]}`;

        await runCountdown(3);

        triggerShutterFlash();
        captureSingleFrame(i);
        await sleep(650);
      }

      statusText.innerText = "✨ 컬러 스티커 완성 중...";
      await sleep(200);

      // 화면 표시용 선명한 컬러 스티커 렌더링
      renderColorSticker();

      // 화면을 결과 화면(컬러 스티커 + 다시촬영/바로인쇄 버튼)으로 전환
      cameraSection.classList.add('hidden');
      controlsCamera.classList.add('hidden');
      previewSection.classList.remove('hidden');
      controlsPreview.classList.remove('hidden');

      isProcessing = false;
      startBtn.disabled = false;
      startBtn.classList.remove('opacity-50');

      // 방문객이 출력하거나 이동하지 않고 방치했을 때 45초 후 새 방문객용 첫 화면으로 자동 복귀
      startAutoResetTimer(45);
    }

    function runCountdown(seconds) {
      return new Promise((resolve) => {
        countdownOverlay.classList.remove('hidden');
        countdownOverlay.classList.add('flex');
        let count = seconds;
        countdownNumber.innerText = count;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownNumber.innerText = count;
          } else {
            clearInterval(timer);
            countdownOverlay.classList.remove('flex');
            countdownOverlay.classList.add('hidden');
            resolve();
          }
        }, 1000);
      });
    }

    function triggerShutterFlash() {
      flashOverlay.classList.add('flash-active');
      setTimeout(() => {
        flashOverlay.classList.remove('flash-active');
      }, 350);
    }

    // 79mm 비율에 맞춘 단일 프레임 캡처 (선명한 풀컬러 보존)
    function captureSingleFrame(index) {
      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = 516;
      frameCanvas.height = 320;
      const fCtx = frameCanvas.getContext('2d');

      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;
      
      const targetAspect = frameCanvas.width / frameCanvas.height;
      let srcW = vW;
      let srcH = vW / targetAspect;
      let srcX = 0;
      let srcY = (vH - srcH) / 2;

      if (srcH > vH) {
        srcH = vH;
        srcW = vH * targetAspect;
        srcX = (vW - srcW) / 2;
        srcY = 0;
      }

      fCtx.save();
      fCtx.translate(frameCanvas.width, 0);
      fCtx.scale(-1, 1); // 좌우 거울 반전
      fCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, frameCanvas.width, frameCanvas.height);
      fCtx.restore();

      capturedFrames.push(frameCanvas);

      const thumbSlot = document.getElementById(`thumbSlot${index + 1}`);
      thumbSlot.innerHTML = '';
      const thumbImg = document.createElement('img');
      thumbImg.src = frameCanvas.toDataURL('image/jpeg');
      thumbImg.className = "w-full h-full object-cover rounded-none";
      thumbSlot.appendChild(thumbImg);
    }

    // 3. 화면 표시용 풀컬러 스티커 렌더링 (사각 프레임 + 테크니컬 디자인 데코레이션)
    function renderColorSticker() {
      const w = colorCanvas.width;  // 576px (79mm 표준 너비)
      const h = colorCanvas.height; // 1420px

      // 배경 흰색
      colorCtx.fillStyle = "#FFFFFF";
      colorCtx.fillRect(0, 0, w, h);

      // 상단 테크니컬 헤더 패턴 바
      colorCtx.fillStyle = "#0f172a";
      colorCtx.fillRect(20, 20, w - 40, 4);

      // 상단 장식 심볼
      colorCtx.fillStyle = "#334155";
      colorCtx.textAlign = "center";
      colorCtx.font = "bold 13px monospace";
      colorCtx.fillText("◆ ◆ ◆  SPEER 인공지능공학연구반  ◆ ◆ ◆", w / 2, 44);

      // 메인 타이틀
      colorCtx.fillStyle = "#0f172a";
      colorCtx.font = "900 28px sans-serif";
      colorCtx.fillText(CONFIG.FESTIVAL_TITLE, w / 2, 80);

      colorCtx.fillStyle = "#475569";
      colorCtx.font = "bold 16px monospace";
      colorCtx.fillText("― PHOTO STICKER MEMORY ―", w / 2, 108);

      // 점선 구분선
      colorCtx.font = "14px monospace";
      colorCtx.fillText("■ ------------------------------------ ■", w / 2, 128);

      // 3컷 사각 사진 배치 및 테크니컬 프레임 데코
      const startY = 148;
      const photoWidth = 516;
      const photoHeight = 320;
      const photoX = (w - photoWidth) / 2;
      const photoGap = 350;

      capturedFrames.forEach((frame, idx) => {
        const curY = startY + (idx * photoGap);

        // 1) 사진 외곽 샤프한 사각 블랙 테두리
        colorCtx.fillStyle = "#0f172a";
        colorCtx.fillRect(photoX - 4, curY - 4, photoWidth + 8, photoHeight + 8);
        
        // 2) 원본 사진 드로잉 (사각)
        colorCtx.drawImage(frame, photoX, curY, photoWidth, photoHeight);

        // 3) 사각 사진 프레임 코너 브래킷 라인 장식 (흰색 L자 모서리)
        colorCtx.strokeStyle = "#FFFFFF";
        colorCtx.lineWidth = 3;
        const cornerSize = 16;
        
        // 좌상단
        colorCtx.beginPath();
        colorCtx.moveTo(photoX + 8, photoX > 0 ? curY + 8 + cornerSize : curY + 8);
        colorCtx.lineTo(photoX + 8, curY + 8);
        colorCtx.lineTo(photoX + 8 + cornerSize, curY + 8);
        colorCtx.stroke();

        // 우하단
        colorCtx.beginPath();
        colorCtx.moveTo(photoX + photoWidth - 8 - cornerSize, curY + photoHeight - 8);
        colorCtx.lineTo(photoX + photoWidth - 8, curY + photoHeight - 8);
        colorCtx.lineTo(photoX + photoWidth - 8, curY + photoHeight - 8 - cornerSize);
        colorCtx.stroke();

        // 4) 좌상단 사각 배지 (CUT 번호)
        colorCtx.fillStyle = "#0f172a";
        colorCtx.fillRect(photoX + 8, curY + 8, 86, 24);
        colorCtx.fillStyle = "#38bdf8";
        colorCtx.font = "900 13px monospace";
        colorCtx.textAlign = "left";
        colorCtx.fillText(`[CUT #${idx + 1}]`, photoX + 16, curY + 25);

        // 5) 우상단 사각 배지 (AI·SW STAMP)
        colorCtx.fillStyle = "#0f172a";
        colorCtx.fillRect(photoX + photoWidth - 110, curY + 8, 102, 24);
        colorCtx.fillStyle = "#f43f5e";
        colorCtx.textAlign = "right";
        colorCtx.font = "bold 12px sans-serif";
        colorCtx.fillText("★ AI MEMORY", photoX + photoWidth - 16, curY + 25);
      });

      // 하단 푸터 영역
      const footerY = startY + (3 * photoGap) + 12;
      colorCtx.fillStyle = "#0f172a";
      colorCtx.textAlign = "center";
      colorCtx.font = "15px monospace";
      colorCtx.fillText("=======================================", w / 2, footerY);

      const now = new Date();
      const dateString = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      colorCtx.font = "900 20px sans-serif";
      colorCtx.fillText("SPEER 인공지능공학연구반", w / 2, footerY + 30);

      colorCtx.font = "14px monospace";
      colorCtx.fillStyle = "#334155";
      colorCtx.fillText(`LOG_TIME: ${dateString}`, w / 2, footerY + 54);
      colorCtx.fillText("REMEMBER THIS SPECIAL MOMENT! ✨", w / 2, footerY + 74);

      // 바코드 생성
      drawThermalBarcode(colorCtx, (w - 340) / 2, footerY + 92, 340, 42);

      colorCtx.font = "12px monospace";
      colorCtx.fillText(`RECEIPT NO. SP-${Math.floor(100000 + Math.random() * 900000)}`, w / 2, footerY + 152);

      // 하단 마감 바
      colorCtx.fillStyle = "#0f172a";
      colorCtx.fillRect(20, h - 20, w - 40, 3);

      // 화면에 선명한 풀컬러로 표시
      receiptPreviewImage.src = colorCanvas.toDataURL('image/png');
    }

    function drawThermalBarcode(c, x, y, width, height) {
      c.fillStyle = "#000000";
      let currentX = x;
      while (currentX < x + width - 10) {
        const barWidth = Math.floor(Math.random() * 3) + 2;
        c.fillRect(currentX, y, barWidth, height);
        currentX += barWidth + Math.floor(Math.random() * 4) + 1;
      }
    }

    // 4. 바로 인쇄하기 (79mm 감열 프린터로 직접 전송)
    async function printReceiptDirectly() {
      clearAutoResetTimer(); // 인쇄 시작 시 방치 타이머 해제
      printBtnText.innerText = "프린터로 즉시 전송 중...";
      printBtn.disabled = true;
      printBtn.classList.add('opacity-75');
      if (retryBtn) retryBtn.disabled = true;

      // 백그라운드에서 감열 흑백 디더링 캔버스 생성
      monoCtx.drawImage(colorCanvas, 0, 0);
      applyFloydSteinbergDither(monoCtx, monoCanvas.width, monoCanvas.height);

      if (typeof epson === 'undefined') {
        showToast("ePOS-SDK 로드 불가로 브라우저 인쇄 모드로 전환합니다.", "error");
        systemPrintFallback();
        restorePrintButton();
        return;
      }

      try {
        const ePosDev = new epson.ePOSDevice();

        ePosDev.connect(CONFIG.PRINTER_IP, CONFIG.PRINTER_PORT, (connectResult) => {
          if (connectResult === 'OK' || connectResult === 'SSL_CONNECT_OK') {
            ePosDev.createDevice(
              CONFIG.PRINTER_DEV_ID,
              ePosDev.DEVICE_TYPE_PRINTER,
              { crypto: false, buffer: false },
              (printer, errorCode) => {
                if (printer) {
                  printer.addAlign(printer.ALIGN_CENTER);
                  printer.addImage(monoCtx, 0, 0, monoCanvas.width, monoCanvas.height, printer.COLOR_1, printer.MODE_MONO);
                  printer.addFeedLine(3);
                  printer.addCut(printer.CUT_FEED);

                  printer.send();

                  setTimeout(() => {
                    ePosDev.disconnect();
                    showToast("🎉 스티커 출력이 완료되었습니다! 다음 방문객을 위해 준비합니다.", "success");
                    // 출력 완료 후 3.5초 뒤 다음 사람을 위해 자동 초기화
                    setTimeout(() => {
                      resetBooth();
                    }, 3500);
                  }, 1200);
                } else {
                  console.warn("createDevice Failed:", errorCode);
                  fallbackToSystemPrint(`프린터 기기 연결 실패 (${errorCode})`);
                }
              }
            );
          } else {
            console.warn("Connect Failed:", connectResult);
            fallbackToSystemPrint(`프린터 IP 연결 실패 (${connectResult})`);
          }
        });
      } catch (err) {
        console.error("Print Error:", err);
        fallbackToSystemPrint("네트워크 전송 오류");
      }
    }

    function fallbackToSystemPrint(reason) {
      restorePrintButton();
      showToast(`${reason}\n브라우저 인쇄창을 엽니다.`);
      systemPrintFallback();
      // 브라우저 인쇄 후에도 초기 화면 복귀
      setTimeout(() => {
        resetBooth();
      }, 5000);
    }

    function restorePrintButton() {
      printBtnText.innerText = "🖨️ 인쇄하기";
      printBtn.disabled = false;
      printBtn.classList.remove('opacity-75');
      if (retryBtn) retryBtn.disabled = false;
    }

    // 시스템 인쇄 Fallback
    function systemPrintFallback() {
      const dataUrl = monoCanvas.toDataURL('image/png');
      const pFrame = document.getElementById('printFrame');
      const doc = pFrame.contentWindow.document;

      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>79mm 인쇄</title>
          <style>
            @page { margin: 0; size: 79mm auto; }
            body { margin: 0; padding: 0; display: flex; justify-content: center; }
            img { width: 100%; max-width: 576px; height: auto; }
          </style>
        </head>
        <body>
          <img src="${dataUrl}" onload="window.print();" />
        </body>
        </html>
      `);
      doc.close();
    }

    // 79mm 감열 전용 Floyd-Steinberg 디더링
    function applyFloydSteinbergDither(context, width, height) {
      const imgData = context.getImageData(0, 0, width, height);
      const d = imgData.data;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const oldVal = 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          const newVal = oldVal < 128 ? 0 : 255;

          d[idx] = newVal;
          d[idx + 1] = newVal;
          d[idx + 2] = newVal;

          const err = oldVal - newVal;

          distributeDitherError(d, width, height, x + 1, y, err * 0.4375);
          distributeDitherError(d, width, height, x - 1, y + 1, err * 0.1875);
          distributeDitherError(d, width, height, x, y + 1, err * 0.3125);
          distributeDitherError(d, width, height, x + 1, y + 1, err * 0.0625);
        }
      }
      context.putImageData(imgData, 0, 0);
    }

    function distributeDitherError(d, w, h, x, y, val) {
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      const idx = (y * w + x) * 4;
      d[idx] = Math.min(255, Math.max(0, d[idx] + val));
      d[idx + 1] = Math.min(255, Math.max(0, d[idx + 1] + val));
      d[idx + 2] = Math.min(255, Math.max(0, d[idx + 2] + val));
    }

    // 5. 다시 촬영 및 초기 화면으로 돌아가기 (새 방문객 환영)
    function resetBooth() {
      clearAutoResetTimer();

      previewSection.classList.add('hidden');
      controlsPreview.classList.add('hidden');
      
      cameraSection.classList.remove('hidden');
      controlsCamera.classList.remove('hidden');

      document.getElementById('shotStepIndicator').classList.add('hidden');
      thumbnailStrip.classList.add('hidden');

      statusText.innerText = "카메라 준비 완료! [3컷 촬영 시작]을 누르세요.";
      restorePrintButton();
    }

    // 결과 화면에 장시간 머물 경우 새 방문객을 위해 자동 리셋
    function startAutoResetTimer(seconds) {
      clearAutoResetTimer();
      autoResetTimer = setTimeout(() => {
        resetBooth();
      }, seconds * 1000);
    }

    function clearAutoResetTimer() {
      if (autoResetTimer) {
        clearTimeout(autoResetTimer);
        autoResetTimer = null;
      }
    }

    function showToast(msg, type = "info") {
      const toast = document.getElementById('toastNotification');
      const icon = document.getElementById('toastIcon');
      const text = document.getElementById('toastMessage');

      text.innerText = msg;

      if (type === "error") {
        icon.className = "fa-solid fa-triangle-exclamation text-rose-400";
        toast.style.borderColor = "rgba(244, 63, 94, 0.6)";
      } else if (type === "success") {
        icon.className = "fa-solid fa-circle-check text-emerald-400";
        toast.style.borderColor = "rgba(52, 211, 153, 0.6)";
      } else {
        icon.className = "fa-solid fa-circle-info text-sky-400";
        toast.style.borderColor = "rgba(56, 189, 248, 0.6)";
      }

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 3000);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.addEventListener('load', () => {
      initCamera();
    });
  </script>
</body>
