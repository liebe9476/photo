<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 AI·SW체험 한마당 수피아여고 포토부스</title>

  <style>
    /* ============================================================
       0. 오프라인 자립형 기본 스타일 (외부 CDN 의존성 0%)
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #111a2e 0%, #080d18 60%, #03060c 100%);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 0 10px 10px;
    }

    /* 뷰파인더 웹캠: 거울처럼 자연스럽게 볼 수 있도록 좌우반전(scaleX -1) 적용 */
    #webcamView {
      transform: scaleX(-1) !important;
      -webkit-transform: scaleX(-1) !important;
      will-change: transform;
    }

    /* 뷰파인더 코너 L자 브래킷 */
    .corner-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 10;
    }
    .corner-tl { top: 12px; left: 12px; border-top: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-tr { top: 12px; right: 12px; border-top: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }

    /* 카메라 플래시 애니메이션 */
    @keyframes flashEffect {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: flashEffect 0.35s ease-out forwards;
    }

    /* 영수증 톱니 절취선 데코 */
    .receipt-edge {
      position: relative;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
    }
    .receipt-edge::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 10px;
      background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
      background-size: 14px 14px;
      transform: rotate(180deg);
    }

    /* 버튼 기본 스타일 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 800;
      border-radius: 14px;
      transition: all 0.15s ease;
      outline: none;
      border: 1px solid transparent;
      touch-action: manipulation;
      pointer-events: auto !important;
    }
    .btn:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    /* 헤더 컨트롤 버튼 전용 터치 최적화 */
    .header-icon-btn {
      min-width: 42px;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      pointer-events: auto !important;
      z-index: 100;
    }

    /* ============================================================
       감열 영수증 인쇄 전용 CSS (Epson TM-m30III 80mm 최적화)
       ============================================================ */
    @page {
      size: 80mm auto;
      margin: 0 !important;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      html, body {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
      }

      body > *:not(#browserPrintZone) {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      #browserPrintZone {
        display: block !important;
        visibility: visible !important;
        width: 100% !important;
        max-width: 80mm !important;
        margin: 0 auto !important;
        padding: 0 !important;
        background: #ffffff !important;
        page-break-before: avoid !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }

      #browserPrintZone img {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

       1. 상단 헤더 (제목, 아이콘, 전체화면 버튼)

          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0 5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3 3a3 3 0 0 1 3-3Z"/>
        </svg>

        <h1 style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); font-weight: 900; background: linear-gradient(to right, #38bdf8, #2dd4bf, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">

        <svg id="fullscreenIconSvg" style="width: 15px; height: 15px; fill: currentColor;" viewBox="0 0 24 24">

  <!-- ============================================================

  <main style="width: 100%; max-width: 1350px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 0; position: relative; margin: 0; padding: 0 8px;">

    <!-- [A] 촬영 대기 및 진행 화면 (4:3 비율 최적화 와이드 대형 뷰파인더) -->

      <!-- 직각 4:3 뷰파인더 -->
      <div id="viewfinderFrame" style="position: relative; width: min(92vw, 73vh, 1020px); aspect-ratio: 4 / 3; background: #000; border: 3.5px solid #38bdf8; box-shadow: 0 25px 60px -10px rgba(0,0,0,0.9), 0 0 30px rgba(56,189,248,0.25); display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 0;">

        <!-- 웹캠 비디오 엘리먼트 (거울 모드 scaleX -1) -->
        <video id="webcamView" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); -webkit-transform: scaleX(-1);"></video>

          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444;"></div>

      <button id="startShootBtn" onclick="runShootingSequence()" class="btn"

        <svg style="width: 22px; height: 22px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0 5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3 3a3 3 0 0 1 3-3Z"/>

    <!-- [B] 결과 화면 (영수증 컬러 미리보기 + 부드러운 그레이스케일 인쇄) -->
    <div id="resultSection" style="display: none; width: 100%; flex: 1; flex-direction: row; align-items: center; justify-content: center; gap: 36px; min-height: 0; padding: 10px; margin-top: 10px;">

      <!-- 좌측: 영수증 스티커 미리보기 (선명한 풀컬러 캔버스 직접 표시) -->
      <div style="height: min(72vh, 580px); width: auto; display: flex; align-items: center; justify-content: center; padding: 14px 16px 20px; background: rgba(15, 23, 42, 0.95); border: 1.5px solid rgba(71, 85, 105, 0.85); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.85); flex-shrink: 0;">

      <!-- 우측: 결과 안내 및 조작 버튼 -->

          </p>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
          <!-- 1) 인쇄하기 버튼 -->
          <button id="printActionBtn" onclick="printReceiptSticker()" class="btn"
                  style="width: 100%; padding: 15px 20px; background: linear-gradient(135deg, #10b981, #0d9488, #059669); color: #ffffff; font-size: 17px; border-radius: 14px; border: 1px solid rgba(110,231,183,0.4); box-shadow: 0 10px 25px -5px rgba(16,185,129,0.5);">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3m-3 11H8v-5h8v5m3-7c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m-1-9H6V4h12v4Z"/>

          <!-- 2) 다시 촬영하기 버튼 -->
          <button id="retakeActionBtn" onclick="resetBoothToCamera()" class="btn"

            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/>

        <div style="font-size: 11px; color: #64748b; font-family: monospace;">

  <!-- 감열 인쇄 전용 영역 -->
  <div id="browserPrintZone" style="display: none;">
    <img id="browserPrintImg" src="" alt="print-strip" />
  </div>

  <!-- 토스트 알림 메시지 바 -->
  <div id="appToast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #0f172a; border: 1.5px solid #38bdf8; color: #fff; padding: 12px 20px; border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.9); transition: opacity 0.3s ease; opacity: 0; pointer-events: none; font-size: 13.5px; font-weight: bold; display: flex; align-items: center; gap: 10px; max-width: 90vw; text-align: center;">
    <span id="toastIcon" style="font-size: 18px;">✨</span>
    <span id="toastMessage">안내 메시지</span>
  </div>

  <script>
    const CONFIG = {
      AUTO_RESET_SECONDS: 45,
      FESTIVAL_TITLE: '2026 AI·SW 체험 한마당',
      CLUB_NAME: "Speer Girl's High School"
    };

    // DOM 요소 캐싱
    const webcamView = document.getElementById('webcamView');
    const captureSection = document.getElementById('captureSection');
    const resultSection = document.getElementById('resultSection');
    const shotStatusHud = document.getElementById('shotStatusHud');
    const countdownBox = document.getElementById('countdownBox');
    const countdownNumber = document.getElementById('countdownNumber');
    const cameraFlashOverlay = document.getElementById('cameraFlashOverlay');
    const startShootBtn = document.getElementById('startShootBtn');
    const printActionBtn = document.getElementById('printActionBtn');
    const printBtnLabel = document.getElementById('printBtnLabel');
    const previewCanvas = document.getElementById('previewCanvas');
    const browserPrintImg = document.getElementById('browserPrintImg');

    let singleCapturedFrame = null;
    let autoResetTimer = null;
    let currentMediaStream = null;

    /**
     * 감열 프린터 특화: 초고화질 소프트 그레이스케일 하프톤 디더링 알고리즘
     * - 어둡게 뭉개지는 현상을 방지하는 지능형 감마 커브(Gamma 1.15)
     * - 인물 피부톤의 미세한 명암을 보존하는 75% 양방향 오차확산
     */
    function applySmoothThermalGrayscale(sourceCanvas, targetWidth, targetHeight) {
      const ditherCanvas = document.createElement('canvas');
      ditherCanvas.width = targetWidth;
      ditherCanvas.height = targetHeight;
      const dCtx = ditherCanvas.getContext('2d');

      dCtx.imageSmoothingEnabled = true;
      dCtx.imageSmoothingQuality = 'high';
      dCtx.drawImage(sourceCanvas, 0, 0, targetWidth, targetHeight);

      const imgData = dCtx.getImageData(0, 0, targetWidth, targetHeight);
      const data = imgData.data;
      const totalPixels = targetWidth * targetHeight;

      const rawLuma = new Float32Array(totalPixels);
      const processed = new Float32Array(totalPixels);

      // ITU-R BT.709 표준 밝기 변환
      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        rawLuma[i] = 0.2126 * data[idx] + 0.7152 * data[idx + 1] + 0.0722 * data[idx + 2];
      }

      // 얼굴 및 배경의 대비를 부드럽게 살리는 언샤프 마스크 필터
      for (let y = 1; y < targetHeight - 1; y++) {
        const row = y * targetWidth;
        for (let x = 1; x < targetWidth - 1; x++) {
          const idx = row + x;
          const blur = (
            rawLuma[idx - targetWidth - 1] + rawLuma[idx - targetWidth] + rawLuma[idx - targetWidth + 1] +
            rawLuma[idx - 1]               + rawLuma[idx]               + rawLuma[idx + 1] +
            rawLuma[idx + targetWidth - 1] + rawLuma[idx + targetWidth] + rawLuma[idx + targetWidth + 1]
          ) / 9.0;

          const detail = rawLuma[idx] - blur;
          let val = rawLuma[idx] + detail * 0.65; // 섬세한 윤곽선 보존

          // 피부톤 화사하게 톤업 (감열지 특유의 검게 타는 현상 방지)
          val = Math.min(255, Math.max(0, val + 15));
          let norm = val / 255.0;
          norm = Math.pow(norm, 0.82); // 부드러운 중간톤 확장
          val = norm * 255.0;

          processed[idx] = Math.min(255, Math.max(0, val));
        }
      }

      // 가장자리 복사
      for (let x = 0; x < targetWidth; x++) {
        processed[x] = rawLuma[x];
        processed[(targetHeight - 1) * targetWidth + x] = rawLuma[(targetHeight - 1) * targetWidth + x];
      }
      for (let y = 0; y < targetHeight; y++) {
        processed[y * targetWidth] = rawLuma[y * targetWidth];
        processed[y * targetWidth + (targetWidth - 1)] = rawLuma[y * targetWidth + (targetWidth - 1)];
      }

      // 4-웨이 소프트 오차 확산 (계단 현상 없이 부드러운 그레이스케일 도트 배치)
      for (let y = 0; y < targetHeight; y++) {
        const row = y * targetWidth;
        const next1 = (y + 1) * targetWidth;

        for (let x = 0; x < targetWidth; x++) {
          const idx = row + x;
          const oldVal = processed[idx];
          const newVal = oldVal < 132 ? 0 : 255;
          processed[idx] = newVal;

          const err = (oldVal - newVal) * 0.75; // 75% 소프트 감쇠로 도트 뭉침 차단

          if (x + 1 < targetWidth) {
            processed[idx + 1] += err * (7 / 16);
          }
          if (y + 1 < targetHeight) {
            if (x - 1 >= 0) processed[next1 + (x - 1)] += err * (3 / 16);
            processed[next1 + x] += err * (5 / 16);
            if (x + 1 < targetWidth) processed[next1 + (x + 1)] += err * (1 / 16);
          }
        }
      }

      // 최종 단색 도트 생성
      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        const c = processed[i] < 128 ? 0 : 255;
        data[idx] = c;
        data[idx + 1] = c;
        data[idx + 2] = c;
        data[idx + 3] = 255;
      }

      dCtx.putImageData(imgData, 0, 0);
      return ditherCanvas;
    }

    /**
     * 영수증 스티커 합성 렌더링 함수
     * @param {HTMLCanvasElement} targetCanvas 렌더링할 캔버스
     * @param {boolean} isPrintMode true: 프린터용 부드러운 그레이스케일 / false: 화면용 선명한 풀컬러
     */
    function renderReceiptToCanvas(targetCanvas, isPrintMode = false) {
      if (!singleCapturedFrame) return;

      const tw = 800;
      const th = 1080;
      targetCanvas.width = tw;
      targetCanvas.height = th;
      const ctx = targetCanvas.getContext('2d');

      // 흰색 영수증 배경
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, tw, th);

      // 상단 타이틀
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000000';
      ctx.font = '900 52px sans-serif';
      ctx.fillText(CONFIG.FESTIVAL_TITLE, tw / 2, 98);

      ctx.font = 'bold 28px sans-serif';
      ctx.fillStyle = '#222222';
      ctx.fillText(CONFIG.CLUB_NAME, tw / 2, 144);

      const drawDecoLine = (y) => {
        ctx.save();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(30, y - 4);
        ctx.lineTo(tw - 30, y - 4);
        ctx.stroke();

        ctx.lineWidth = 2.5;
        ctx.setLineDash([12, 6, 4, 6]);
        ctx.beginPath();
        ctx.moveTo(30, y + 2);
        ctx.lineTo(tw - 30, y + 2);
        ctx.stroke();
        ctx.restore();
      };

      drawDecoLine(190);

      // 사진 영역 (4:3 비율)
      const photoW = 740;
      const photoH = 555;
      const photoX = (tw - photoW) / 2;
      const photoY = 224;

      if (isPrintMode) {
        // [인쇄 시]: 감열 프린터 헤드에 맞춘 부드러운 그레이스케일 도트 렌더링
        const smoothGrayscalePhoto = applySmoothThermalGrayscale(singleCapturedFrame, photoW, photoH);
        ctx.drawImage(smoothGrayscalePhoto, photoX, photoY, photoW, photoH);
      } else {
        // [화면 미리보기 시]: 웹캠에서 캡처한 선명한 풀컬러 사진 그대로 출력
        ctx.drawImage(singleCapturedFrame, photoX, photoY, photoW, photoH);
      }

      // 사진 테두리 외곽선
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.strokeRect(photoX, photoY, photoW, photoH);

      const bottomLineY = photoY + photoH + 34;
      drawDecoLine(bottomLineY);

      // 날짜 및 감사 문구
      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      const dateTextY = bottomLineY + 60;
      ctx.font = 'bold 26px monospace';
      ctx.fillStyle = '#000000';
      ctx.fillText(`DATE: ${dateStr}`, tw / 2, dateTextY);

      ctx.font = 'bold 32px sans-serif';
      ctx.fillStyle = '#000000';
      ctx.fillText('방문해주셔서 감사합니다!!', tw / 2, dateTextY + 44);

      // 바코드 그래픽
      const barcodeY = dateTextY + 68;
      const barcodeH = 40;
      const barPattern = [
        3,2,1,3,2,1,4,1,2,3,1,2,4,2,1,3,2,1,3,4,1,2,3,1,2,4,1,3,2,1,
        2,3,1,4,2,1,3,2,1,3,2,4,1,2,3,1,3,2,4,1,2,1,3,2,4,1,3,2,1,2,
        3,1,2,4,1,3,2,1,3,2,4,1,2,3,1,4,2,1,3,2,1,3,4,1,2,3,1,2,4,1
      ];

      let totalBarW = 0;
      for (let i = 0; i < barPattern.length; i++) {
        totalBarW += barPattern[i] * 2.8;
      }
      let curBx = (tw - totalBarW) / 2;

      ctx.fillStyle = '#000000';
      for (let i = 0; i < barPattern.length; i++) {
        const w = barPattern[i] * 2.8;
        if (i % 2 === 0) {
          ctx.fillRect(curBx, barcodeY, w - 0.5, barcodeH);
        }
        curBx += w;
      }

      ctx.font = 'bold 25px sans-serif';
      ctx.fillStyle = '#111111';
      ctx.fillText('수피아여고 인공지능공학 연구반', tw / 2, barcodeY + barcodeH + 32);
    }

    /**
     * 1컷 촬영 시퀀스 (화면에는 100% 선명한 풀컬러로 즉시 렌더링)
     */
    async function runShootingSequence() {
      try {
        startShootBtn.disabled = true;
        singleCapturedFrame = null;
        shotStatusHud.innerText = `SHOT [ 1 / 1 ]`;

        // 4초 카운트다운
        countdownBox.style.display = 'flex';
        for (let c = 4; c >= 1; c--) {
          countdownNumber.innerText = c;
          await sleep(1000);
        }
        countdownBox.style.display = 'none';

        // 플래시 애니메이션
        cameraFlashOverlay.classList.remove('flash-active');
        void cameraFlashOverlay.offsetWidth;
        cameraFlashOverlay.classList.add('flash-active');

        // 웹캠 프레임 치수 확인
        const vw = webcamView.videoWidth || 1280;
        const vh = webcamView.videoHeight || 720;

        // 4:3 비율 크롭 영역 계산
        const targetAspect = 4 / 3;
        let cropW, cropH;
        if (vw / vh > targetAspect) {
          cropH = vh;
          cropW = vh * targetAspect;
        } else {
          cropW = vw;
          cropH = vw / targetAspect;
        }
        const cropX = (vw - cropW) / 2;
        const cropY = (vh - cropH) / 2;

        // 캡처용 임시 캔버스 생성 (고해상도 풀컬러 저장)
        const frameCanvas = document.createElement('canvas');
        frameCanvas.width = 800;
        frameCanvas.height = 600;
        const fCtx = frameCanvas.getContext('2d');
        fCtx.imageSmoothingEnabled = true;
        fCtx.imageSmoothingQuality = 'high';

        // 거울 모드(좌우 반전) 그대로 깨끗하게 캡처
        fCtx.save();
        fCtx.translate(800, 0);
        fCtx.scale(-1, 1);
        fCtx.drawImage(webcamView, cropX, cropY, cropW, cropH, 0, 0, 800, 600);
        fCtx.restore();

        singleCapturedFrame = frameCanvas;

        // [중요] 화면 미리보기 캔버스에는 isPrintMode = false로 '선명한 풀컬러' 직접 렌더링!
        renderReceiptToCanvas(previewCanvas, false);

        // 촬영 대기 화면 숨기고 결과 화면 표시
        captureSection.style.display = 'none';
        resultSection.style.display = 'flex';
        printActionBtn.disabled = false;
        printBtnLabel.innerText = "영수증 인쇄하기";

        clearTimeout(autoResetTimer);
        autoResetTimer = setTimeout(resetBoothToCamera, CONFIG.AUTO_RESET_SECONDS * 1000);
      } catch (err) {
        console.error("Capture Sequence Error:", err);
        showToast("촬영 처리 오류: " + err.message, "⚠️");
        startShootBtn.disabled = false;
        countdownBox.style.display = 'none';
      }
    }

    /**
     * 감열 프린터 출력 (부드러운 그레이스케일로 렌더링하여 출력)
     */
    async function printReceiptSticker() {
      printActionBtn.disabled = true;
      printBtnLabel.innerText = "인쇄 준비 중...";
      clearTimeout(autoResetTimer);

      try {
        showToast("감열 프린터 전용 부드러운 그레이스케일 변환 중...", "⚙️");

        // [중요] 인쇄용 오프스크린 캔버스에만 isPrintMode = true 로 부드러운 그레이스케일 적용
        const printCanvas = document.createElement('canvas');
        renderReceiptToCanvas(printCanvas, true);
        const smoothGrayscaleDataUrl = printCanvas.toDataURL('image/png');

        if (browserPrintImg) {
          browserPrintImg.src = smoothGrayscaleDataUrl;
          if (browserPrintImg.decode) {
            try {
              await browserPrintImg.decode();
            } catch (e) {}
          }
        }

        printBtnLabel.innerText = "프린터 전송 중...";

        setTimeout(() => {
          window.print();

          printBtnLabel.innerText = "출력 완료!";
          showToast("영수증 인쇄가 시작되었습니다! ✨", "🎉");

          setTimeout(() => {
            printActionBtn.disabled = false;
            printBtnLabel.innerText = "영수증 인쇄하기";
            resetBoothToCamera();
          }, 3000);
        }, 300);

      } catch (err) {
        console.error("Print Error:", err);
        showToast("인쇄 처리 중 오류: " + err.message, "⚠️");
        printActionBtn.disabled = false;
        printBtnLabel.innerText = "다시 인쇄 시도";
      }
    }

    function resetBoothToCamera() {
      clearTimeout(autoResetTimer);
      resultSection.style.display = 'none';
      captureSection.style.display = 'flex';
      startShootBtn.disabled = false;
      shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
      singleCapturedFrame = null;
    }

    /**
     * 웹캠 초기화
     */
    async function initWebcam() {
      if (currentMediaStream) {
        try {
          currentMediaStream.getTracks().forEach(t => t.stop());
        } catch (e) {}
      }

      const constraintsAttempts = [
        {
          video: {
            facingMode: 'user',
            width: { ideal: 1280, min: 640 },
            height: { ideal: 720, min: 480 }
          },
          audio: false
        },
        {
          video: { facingMode: 'user' },
          audio: false
        },
        {
          video: true,
          audio: false
        }
      ];

      let stream = null;
      for (const attempt of constraintsAttempts) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(attempt);
          if (stream) break;
        } catch (err) {
          console.warn("Retrying constraints attempt:", err);
        }
      }

      if (stream) {
        currentMediaStream = stream;
        webcamView.srcObject = stream;
        webcamView.setAttribute('playsinline', '');
        webcamView.setAttribute('webkit-playsinline', '');
        webcamView.muted = true;
        webcamView.style.transform = 'scaleX(-1)';
        webcamView.style.webkitTransform = 'scaleX(-1)';

        try {
          await webcamView.play();
          shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
        } catch (playErr) {
          console.warn("Autoplay deferred by gesture policy", playErr);
          shotStatusHud.innerText = "TOUCH TO START";
        }
      } else {
        shotStatusHud.innerText = "CAMERA ERROR";
        showToast("카메라 권한을 확인해주세요.", "⚠️");
      }
    }

    /**
     * 전체화면 토글
     */
    async function toggleFullscreen() {
      try {
        const isFull = !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );

        if (!isFull) {
          const target = document.documentElement;
          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target.webkitRequestFullscreen) {
            await target.webkitRequestFullscreen();
          } else if (target.mozRequestFullScreen) {
            await target.mozRequestFullScreen();
          } else if (target.msRequestFullscreen) {
            await target.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            await document.mozCancelFullScreen();
          } else if (document.msExitFullscreen) {
            await document.msExitFullscreen();
          }
        }
      } catch (err) {
        console.warn("Fullscreen toggle error:", err);
      }
    }

    function syncFullscreenUI() {
      const isFull = !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
      const icon = document.getElementById('fullscreenIconSvg');
      if (icon) {
        if (isFull) {
          icon.innerHTML = '<path d="M14 14h5v2h-3v3h-2v-5m-4 0v5H8v-3H5v-2h5m4-9v5h5V8h-3V5h-2m-6 3V5H6v3h3v2H4V8h4Z"/>';
        } else {
          icon.innerHTML = '<path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>';
        }
      }
    }

    document.addEventListener('fullscreenchange', syncFullscreenUI);
    document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
    document.addEventListener('mozfullscreenchange', syncFullscreenUI);
    document.addEventListener('MSFullscreenChange', syncFullscreenUI);

    document.addEventListener('touchstart', function unlockAutoplay() {
      if (webcamView && webcamView.paused && webcamView.srcObject) {
        webcamView.play().then(() => {
          shotStatusHud.innerText = "SHOT [ 0 / 1 ]";
        }).catch(() => {});
      }
    }, { once: true, passive: true });

    function showToast(msg, icon = "✨") {
      const toast = document.getElementById('appToast');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.style.opacity = '1';

      setTimeout(() => {
        toast.style.opacity = '0';
      }, 3500);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.onload = initWebcam;
  </script>
</body>
