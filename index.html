<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 AI·SW체험 수피아여고 포토부스</title>
  <!-- QR 코드 생성 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      color: #1e293b;
    }

    #appContainer {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .fullscreen-fab {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: all 0.2s;
      z-index: 60;
    }
    .fullscreen-fab:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    #mainBoothArea {
      flex: 1;
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 0;
      background: #e7e9df;
    }

    /* 좌측 카메라 뷰파인더 */
    #viewfinderContainer {
      flex: 1;
      height: 100%;
      position: relative;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcamView {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
      display: block;
    }

    /* 뷰파인더 3x3 가이드 */
    .grid-line {
      position: absolute;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.35);
      z-index: 15;
    }
    .grid-v1 { left: 33.333%; top: 0; bottom: 0; width: 1px; }
    .grid-v2 { left: 66.666%; top: 0; bottom: 0; width: 1px; }
    .grid-h1 { top: 33.333%; left: 0; right: 0; height: 1px; }
    .grid-h2 { top: 66.666%; left: 0; right: 0; height: 1px; }

    .live-badge {
      position: absolute;
      top: 22px;
      left: 24px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 6px #ef4444;
    }

    #flashOverlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
    }
    .flash-anim {
      animation: flashAnim 0.35s ease-out forwards;
    }
    @keyframes flashAnim {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    #countdownBox {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 35;
      pointer-events: none;
    }
    #countdownNum {
      font-size: clamp(5rem, 15vw, 8.5rem);
      font-weight: 900;
      color: #ffffff;
      font-family: monospace;
      text-shadow: 0 4px 25px rgba(0,0,0,0.7);
    }

    /* 우측 버튼 패널 */
    #sideActionPanel {
      width: clamp(280px, 34vw, 420px);
      height: 100%;
      background: #e7e9df;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 24px;
      position: relative;
      flex-shrink: 0;
    }

    .side-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 34px;
      max-width: 320px;
    }

    .booth-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.2);
      color: #0284c7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 10px;
    }

    .booth-main-title {
      font-size: clamp(1.2rem, 2.2vw, 1.55rem);
      font-weight: 900;
      color: #1e293b;
      letter-spacing: -0.6px;
      line-height: 1.35;
    }

    .booth-sub-caption {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      font-weight: 500;
    }

    .pill-shoot-btn {
      width: min(90%, 280px);
      padding: 22px 30px;
      background: #f1f3ee;
      border: 1px solid #d5d8cd;
      border-radius: 9999px;
      font-size: 1.45rem;
      font-weight: 800;
      color: #1a1a1a;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0,0,0,0.04);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: all 0.15s ease-in-out;
    }
    .pill-shoot-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
    }
    .pill-shoot-btn:active {
      transform: scale(0.96);
      background: #e2e5da;
    }

    /* 결과 모달 */
    #resultModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .result-content {
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid #334155;
      max-width: 860px;
      width: 100%;
      max-height: 94vh;
      display: flex;
      flex-direction: row;
      gap: 28px;
      padding: 28px;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.9);
      overflow-y: auto;
    }

    .preview-card {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 310px;
    }

    /* 촬영된 컬러 사진을 보여주는 1:1 정방형 프리뷰 */
    #previewImg {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .preview-tag {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .result-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #f8fafc;
    }

    .result-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .result-header p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .print-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
    }
    .print-btn:active {
      transform: scale(0.97);
    }

    .retake-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #334155;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    #toastNotice {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 120;
    }

    /* 백그라운드 인쇄용 숨김 아이프레임 */
    #hiddenPrintFrame {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 10px;
      height: 10px;
      border: none;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="appContainer">
    <button type="button" class="fullscreen-fab" onclick="toggleFullscreen()" title="전체화면 전환">
      <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24">
        <path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>
      </svg>
      <span>전체화면</span>
    </button>

    <main id="mainBoothArea">
      <!-- 좌측 뷰파인더 -->
      <section id="viewfinderContainer">
        <video id="webcamView" autoplay playsinline muted></video>

        <div class="live-badge">
          <div class="live-dot"></div>
          <span>LIVE</span>
        </div>

        <div class="grid-line grid-v1"></div>
        <div class="grid-line grid-v2"></div>
        <div class="grid-line grid-h1"></div>
        <div class="grid-line grid-h2"></div>

        <div id="flashOverlay"></div>
        <div id="countdownBox">
          <span id="countdownNum">3</span>
        </div>
      </section>

      <!-- 우측 패널 -->
      <aside id="sideActionPanel">
        <div class="side-title-container">
          <div class="booth-chip">
            <svg style="width: 12px; height: 12px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 18a8 8 0 0 1-8-8a8 8 0 0 1 8-8a8 8 0 0 1 8 8a8 8 0 0 1-8 8m1-13h-2v6h6v-2h-4V7Z"/>
            </svg>
            SPEER HIGH SCHOOL
          </div>
          <h2 class="booth-main-title">
            2026 AI·SW체험<br/>수피아여고 포토부스
          </h2>
          <p class="booth-sub-caption">카메라를 바라보고 버튼을 눌러주세요</p>
        </div>

        <button id="shootButton" class="pill-shoot-btn" onclick="triggerPhotoShoot()">
          촬영하기
        </button>
      </aside>
    </main>
  </div>

  <!-- 결과 모달 -->
  <div id="resultModal">
    <div class="result-content">
      <div class="preview-card">
        <!-- 촬영한 컬러 원본 사진 -->
        <img id="previewImg" alt="촬영 원본 컬러 사진" />
        <span class="preview-tag">ORIGINAL COLOR PHOTO</span>
      </div>

      <div class="result-details">
        <div class="result-header">
          <h2>사진이 성공적으로 촬영되었습니다! 🎉</h2>
          <p>미리보기는 선명한 원본 컬러로 제공되며, [영수증 인쇄하기] 클릭 시 72×72mm 규격의 부드러운 아날로그 감열 앳킨슨 포토로 즉시 출력됩니다.</p>
        </div>

        <div class="action-group">
          <button id="printBtn" class="print-btn" onclick="printReceipt()">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3m-3 11H8v-5h8v5m3-7c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m-1-9H6V4h12v4Z"/>
            </svg>
            <span id="printBtnText">영수증 인쇄하기</span>
          </button>

          <button class="retake-btn" onclick="closeModalAndResume()">
            다시 촬영하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 인쇄 전용 숨김 DOM -->
  <canvas id="offscreenReceiptCanvas" style="display: none;"></canvas>
  <div id="qrHiddenHolder" style="display: none;"></div>
  <iframe id="hiddenPrintFrame"></iframe>

  <div id="toastNotice"></div>

  <script>
    // DOM 캐싱
    const webcamView = document.getElementById('webcamView');
    const shootButton = document.getElementById('shootButton');
    const flashOverlay = document.getElementById('flashOverlay');
    const countdownBox = document.getElementById('countdownBox');
    const countdownNum = document.getElementById('countdownNum');
    const resultModal = document.getElementById('resultModal');
    const previewImg = document.getElementById('previewImg');
    const printBtn = document.getElementById('printBtn');
    const printBtnText = document.getElementById('printBtnText');
    const offscreenCanvas = document.getElementById('offscreenReceiptCanvas');
    const offscreenCtx = offscreenCanvas.getContext('2d');
    const hiddenPrintFrame = document.getElementById('hiddenPrintFrame');

    let currentMediaStream = null;
    let capturedColorCanvas = null;
    let finalPrintReceiptDataUrl = '';

    // 1. 카메라 시작
    async function initializeCamera() {
      try {
        currentMediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        webcamView.srcObject = currentMediaStream;
      } catch (e) {
        console.warn('카메라 초기화 실패:', e);
        showToast('카메라 권한을 확인해주세요.');
      }
    }

    /**
     * 2. 무아레(원형 겹침/다이아몬드 왜곡) 원천 제거 & 왼쪽 맑은 톤 100% 일치 렌더링 엔진
     * - 2픽셀 오차 건너뛰기로 발생하던 동심원 파동 및 다이아몬드 패턴 완전 차단
     * - 안경테/눈동자/머릿결은 선명한 1픽셀 블랙 앵커링 유지
     * - 얼굴 피부톤과 배경은 왼쪽 사진처럼 깨끗하고 맑게 떨어지는 단일 톤 매핑
     */
    function renderTabletMicroStipple(sourceCanvas, targetWidth, targetHeight) {
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(sourceCanvas, 0, 0, targetWidth, targetHeight);

      const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
      const data = imgData.data;
      const totalPixels = targetWidth * targetHeight;

      // 1단계: BT.709 인지 휘도 변환 + 왼쪽 사진 기준 맑은 피부톤 곡선 매핑
      const buf = new Float32Array(totalPixels);
      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];

        // 정확한 인체 피부 인지 휘도
        let lum = 0.299 * r + 0.587 * g + 0.114 * b;

        // 왼쪽 사진 톤 일치:
        // 1) 안경테, 눈동자, 짙은 머리카락(lum < 75)은 깊은 1px 블랙으로 보존
        // 2) 얼굴 피부 및 배경(lum >= 75)은 감마 1.22 + 오프셋으로 화사하게 리프팅 (오른쪽처럼 거뭇해지지 않음)
        if (lum < 75) {
          lum = lum * 0.85; // 안경테/동공 딥블랙 고정
        } else {
          // 맑고 화사한 톤 커브 (원형 얼룩이나 계단 없이 부드럽게 상승)
          const norm = (lum - 75) / (255 - 75);
          const lifted = Math.pow(norm, 1.0 / 1.22);
          lum = 75 + lifted * 180 + 10;
        }

        buf[i] = Math.min(255, Math.max(0, lum));
      }

      // 2단계: 안경테 및 이목구비 윤곽만 자연스럽게 살리는 소프트 샤프닝 (과도한 엣지 부스팅 제거)
      const sharpBuf = new Float32Array(totalPixels);
      for (let y = 1; y < targetHeight - 1; y++) {
        const row = y * targetWidth;
        const prevRow = (y - 1) * targetWidth;
        const nextRow = (y + 1) * targetWidth;

        for (let x = 1; x < targetWidth - 1; x++) {
          const idx = row + x;
          const center = buf[idx];
          const lap = (center * 5.0) - (buf[idx - 1] + buf[idx + 1] + buf[prevRow + x] + buf[nextRow + x]);
          
          // 안경테와 윤곽선만 또렷하게 잡고, 피부 영역은 부드럽게 블렌딩하여 얼룩 방지
          if (center < 110) {
            sharpBuf[idx] = Math.min(255, Math.max(0, lap));
          } else {
            sharpBuf[idx] = Math.min(255, Math.max(0, center * 0.85 + lap * 0.15));
          }
        }
      }

      // 외곽 테두리 복사
      for (let x = 0; x < targetWidth; x++) {
        sharpBuf[x] = buf[x];
        sharpBuf[(targetHeight - 1) * targetWidth + x] = buf[(targetHeight - 1) * targetWidth + x];
      }
      for (let y = 0; y < targetHeight; y++) {
        sharpBuf[y * targetWidth] = buf[y * targetWidth];
        sharpBuf[y * targetWidth + targetWidth - 1] = buf[y * targetWidth + targetWidth - 1];
      }

      // 3단계: 원형 무아레/다이아몬드 왜곡을 원천 차단하는 직근접 정밀 오차 분산
      // 2픽셀 건너뛰기(x+2, y+2)를 없애고 직근접 픽셀에만 분산하여 동심원 간섭 발생을 100% 방지
      for (let y = 0; y < targetHeight; y++) {
        const isLeftToRight = (y % 2 === 0);
        const startX = isLeftToRight ? 0 : targetWidth - 1;
        const endX = isLeftToRight ? targetWidth : -1;
        const stepX = isLeftToRight ? 1 : -1;

        for (let x = startX; x !== endX; x += stepX) {
          const idx = y * targetWidth + x;
          const oldVal = sharpBuf[idx];
          const newVal = (oldVal < 128) ? 0 : 255;
          sharpBuf[idx] = newVal;

          const err = oldVal - newVal;

          if (err !== 0) {
            const dir = stepX;

            // 표준 16분할 직근접 세르펜틴 확산 (무아레 간섭 없는 완벽한 아날로그 점묘화 결)
            if (x + dir >= 0 && x + dir < targetWidth) {
              sharpBuf[idx + dir] += (err * 7.0) / 16.0;
            }

            if (y + 1 < targetHeight) {
              const nRow = (y + 1) * targetWidth;
              if (x - dir >= 0 && x - dir < targetWidth) {
                sharpBuf[nRow + (x - dir)] += (err * 3.0) / 16.0;
              }
              sharpBuf[nRow + x] += (err * 5.0) / 16.0;
              if (x + dir >= 0 && x + dir < targetWidth) {
                sharpBuf[nRow + (x + dir)] += (err * 1.0) / 16.0;
              }
            }
          }
        }
      }

      // 4단계: 1비트 흑백 확정
      for (let i = 0; i < totalPixels; i++) {
        const c = sharpBuf[i] < 128 ? 0 : 255;
        const idx = i * 4;
        data[idx] = c;
        data[idx + 1] = c;
        data[idx + 2] = c;
        data[idx + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    /**
     * QR 코드 캔버스 생성 함수
     */
    function generateQRCodeCanvas(text, size) {
      return new Promise((resolve) => {
        const holder = document.getElementById('qrHiddenHolder');
        holder.innerHTML = '';
        new QRCode(holder, {
          text: text,
          width: size,
          height: size,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        setTimeout(() => {
          const qrCanvas = holder.querySelector('canvas');
          if (qrCanvas) {
            resolve(qrCanvas);
          } else {
            const qrImg = holder.querySelector('img');
            if (qrImg) {
              const cvs = document.createElement('canvas');
              cvs.width = size;
              cvs.height = size;
              const c = cvs.getContext('2d');
              c.drawImage(qrImg, 0, 0, size, size);
              resolve(cvs);
            } else {
              const cvs = document.createElement('canvas');
              cvs.width = size;
              cvs.height = size;
              resolve(cvs);
            }
          }
        }, 120);
      });
    }

    /**
     * 3. 72 × 72 mm (정확히 576 × 576 px 1:1 정방형) 물리 규격 완성
     * TM-m30III 80mm 용지의 유효 인쇄 폭 72mm = 576 도트에 1:1로 정확하게 일치
     */
    async function composeTargetReceipt() {
      if (!capturedColorCanvas) return '';

      const tw = 576; // 정확히 72mm (203.2 DPI)
      const photoSize = 576; // 72x72mm 1:1 정사각형
      const th = 760; // 72mm 사진 + 여백 및 하단 QR코드

      offscreenCanvas.width = tw;
      offscreenCanvas.height = th;

      // 순백색 바탕
      offscreenCtx.fillStyle = '#ffffff';
      offscreenCtx.fillRect(0, 0, tw, th);

      // 사진 영역: Micro Stipple Density 적용 렌더링
      const ditheredPhoto = renderTabletMicroStipple(capturedColorCanvas, photoSize, photoSize);
      offscreenCtx.drawImage(ditheredPhoto, 0, 0, photoSize, photoSize);

      // 하단 QR 코드 렌더링
      try {
        const qrSize = 150;
        const qrCanvas = await generateQRCodeCanvas('https://speer.hs.kr/', qrSize);
        const qrX = Math.round((tw - qrSize) / 2);
        const qrY = photoSize + 18;
        offscreenCtx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
      } catch (err) {
        console.warn('QR 코드 생성 오류:', err);
      }

      return offscreenCanvas.toDataURL('image/png');
    }

    /**
     * 4. 사진 촬영 시퀀스
     */
    async function triggerPhotoShoot() {
      shootButton.disabled = true;

      countdownBox.style.display = 'flex';
      for (let c = 3; c >= 1; c--) {
        countdownNum.innerText = c;
        await sleep(1000);
      }
      countdownBox.style.display = 'none';

      // 플래시 효과
      flashOverlay.classList.remove('flash-anim');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-anim');

      const vw = webcamView.videoWidth || 1280;
      const vh = webcamView.videoHeight || 720;
      const cropSize = Math.min(vw, vh);
      const cropX = (vw - cropSize) / 2;
      const cropY = (vh - cropSize) / 2;

      // 72x72mm 1:1 정방형 원본 컬러 캔버스 생성
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 576;
      tempCanvas.height = 576;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.imageSmoothingEnabled = true;
      tCtx.imageSmoothingQuality = 'high';

      // 좌우 반전 일치
      tCtx.translate(576, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(webcamView, cropX, cropY, cropSize, cropSize, 0, 0, 576, 576);

      capturedColorCanvas = tempCanvas;

      // 미리보기: 촬영된 선명한 원본 컬러 그대로 표시
      previewImg.src = capturedColorCanvas.toDataURL('image/png');

      // 인쇄용: 태블릿 부드러운 앳킨슨 흑백 + QR코드 합성
      finalPrintReceiptDataUrl = await composeTargetReceipt();

      resultModal.style.display = 'flex';
      shootButton.disabled = false;
    }

    /**
     * 5. 무왜곡 72×72mm 규격 인쇄 파이프라인
     * - 화면 깜빡임/창 커짐이 전혀 없는 백그라운드 Iframe 인쇄
     * - 태블릿/모바일 인쇄 스풀러에서 축소되지 않고 용지 가로 폭 전체에 100% 꽉 차게 렌더링
     */
    function printReceipt() {
      printBtn.disabled = true;
      printBtnText.innerText = '인쇄 전송 중...';

      try {
        const frameDoc = hiddenPrintFrame.contentWindow.document;
        frameDoc.open();
        frameDoc.write(`
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8">
            <title>Receipt Print</title>
            <style>
              @page {
                size: 80mm auto;
                margin: 0 !important;
              }
              *, *::before, *::after {
                box-sizing: border-box !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
              }
              html, body {
                width: 100% !important;
                min-width: 100% !important;
                margin: 0 auto !important;
                padding: 0 !important;
                background: #ffffff !important;
                overflow: hidden !important;
              }
              .receipt-wrapper {
                width: 100% !important;
                min-width: 100% !important;
                margin: 0 auto !important;
                padding: 0 !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
              }
              .receipt-img {
                width: 100% !important;
                min-width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                display: block !important;
                margin: 0 auto !important;
                image-rendering: pixelated !important;
                image-rendering: crisp-edges !important;
              }
            </style>
          </head>
          <body>
            <div class="receipt-wrapper">
              <img class="receipt-img" src="${finalPrintReceiptDataUrl}" alt="receipt" />
            </div>
          </body>
          </html>
        `);
        frameDoc.close();

        // 렌더링 완료 후 백그라운드에서 직접 인쇄 호출 (화면 깜빡임 없음)
        setTimeout(() => {
          hiddenPrintFrame.contentWindow.focus();
          hiddenPrintFrame.contentWindow.print();
          printBtnText.innerText = '인쇄 완료!';
          showToast('영수증 인쇄가 시작되었습니다.');
        }, 300);

      } catch (err) {
        console.warn('Iframe 인쇄 실패, 백업 인쇄로 전환:', err);
        window.print();
      }

      setTimeout(() => {
        printBtn.disabled = false;
        printBtnText.innerText = '영수증 인쇄하기';
        closeModalAndResume();
      }, 2500);
    }

    function closeModalAndResume() {
      resultModal.style.display = 'none';
      shootButton.disabled = false;
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        console.warn('전체화면 에러', e);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotice');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 2500);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.onload = initializeCamera;
  </script>
</body>
</html>
