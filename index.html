<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 AI·SW체험 수피아여고 포토부스</title>

  <style>
    /* ============================================================
       0. 기본 스타일 & 오프라인 독립형 레이아웃
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #0f172a 0%, #080d1a 60%, #020617 100%);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    /* 카메라 거울 모드 (좌우 반전) */
    .mirror-mode {
      transform: scaleX(-1);
    }

    /* 뷰파인더 코너 L자 가이드 브래킷 */
    .corner-bracket {
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 10;
    }
    .corner-tl { top: 12px; left: 12px; border-top: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-tr { top: 12px; right: 12px; border-top: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 3.5px solid #38bdf8; border-left: 3.5px solid #38bdf8; }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 3.5px solid #38bdf8; border-right: 3.5px solid #38bdf8; }

    /* 카메라 플래시 애니메이션 */
    @keyframes flashEffect {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: flashEffect 0.35s ease-out forwards;
    }

    /* 영수증 톱니 절취선 데코 */
    .receipt-edge {
      position: relative;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
    }
    .receipt-edge::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 10px;
      background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
      background-size: 14px 14px;
      transform: rotate(180deg);
    }

    /* 버튼 스타일 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 800;
      border-radius: 14px;
      transition: all 0.15s ease;
      outline: none;
      border: 1px solid transparent;
    }
    .btn:active {
      transform: scale(0.97);
    }

    /* 블루투스 연결 상태 뱃지 */
    .bt-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 9999px;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .bt-badge-disconnected {
      background: rgba(71, 85, 105, 0.4);
      color: #94a3b8;
      border: 1px solid #475569;
    }
    .bt-badge-connected {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #10b981;
    }

    /* ============================================================
       감열 영수증 브라우저 인쇄 전용 CSS (미연결 시 대비 백업 모드)
       ============================================================ */
    @page {
      margin: 0 !important;
      size: 80mm auto !important;
    }

    @media print {
      html, body {
        width: 72mm !important;
        max-width: 72mm !important;
        height: auto !important;
        margin: 0 auto !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body > *:not(#browserPrintZone) {
        display: none !important;
      }

      #browserPrintZone {
        display: block !important;
        visibility: visible !important;
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        width: 72mm !important;
        max-width: 72mm !important;
        margin: 0 auto !important;
        padding: 0 !important;
        background: #ffffff !important;
      }

      #browserPrintZone img {
        width: 72mm !important;
        max-width: 72mm !important;
        height: auto !important;
        display: block !important;
        margin: 0 auto !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: pixelated !important;
      }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between">

  <!-- ============================================================
       1. 상단 헤더
       ============================================================ -->
  <header style="width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; z-index: 20;">
    
    <!-- 좌측: 블루투스 직결 버튼 (태블릿 팝업 없는 다이렉트 출력) -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="btConnectBtn" onclick="toggleBluetoothConnection()" class="btn"
              style="padding: 7px 12px; background: rgba(30, 41, 59, 0.9); color: #38bdf8; border: 1px solid #0284c7; font-size: 12px;">
        <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29M13 5.83l1.88 1.88L13 9.59V5.83m1.88 10.46L13 18.17v-3.76l1.88 1.88Z"/>
        </svg>
        <span id="btBtnText">프린터 BT 연결 (무음 인쇄)</span>
      </button>

      <span id="btStatusBadge" class="bt-badge bt-badge-disconnected">
        <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #94a3b8;" id="btDot"></span>
        <span id="btStatusText">BT 미연결 (기본 인쇄)</span>
      </span>
    </div>

    <!-- 중앙 타이틀 -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 10px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg style="width: 20px; height: 20px; fill: #38bdf8;" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
        </svg>
        <h1 style="font-size: clamp(1.05rem, 2.8vw, 1.6rem); font-weight: 900; background: linear-gradient(to right, #38bdf8, #2dd4bf, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          2026 AI·SW체험 수피아여고 포토부스
        </h1>
      </div>
    </div>

    <!-- 우측 제어 버튼: 전체화면 -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="fullscreenToggleBtn" onclick="toggleFullscreen()" title="전체화면"
              class="btn" style="padding: 7px 11px; background: rgba(30, 41, 59, 0.9); color: #cbd5e1; border: 1px solid #475569; font-size: 12px;">
        <svg id="fullscreenIconSvg" style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M5 5h5v2H7v3H5V5m9 0h5v5h-2V7h-3V5m3 9h2v5h-5v-2h3v-3m-9 3v2H5v-5h2v3h3Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ============================================================
       2. 메인 뷰: 촬영 대기 뷰파인더 vs 결과 미리보기
       ============================================================ -->
  <main style="width: 100%; max-width: 1150px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; position: relative; margin: 2px 0; padding: 0 8px;">

    <!-- [A] 촬영 대기 섹션 -->
    <div id="captureSection" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 0; padding: 4px 0;">

      <!-- 널찍한 가로 4:3 뷰파인더 프레임 -->
      <div id="viewfinderFrame" style="position: relative; width: min(94vw, 760px); aspect-ratio: 4 / 3; max-height: 64vh; background: #000; border: 3px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; outline: 1px solid rgba(56,189,248,0.4); overflow: hidden; border-radius: 16px;">

        <!-- 웹캠 비디오 엘리먼트 -->
        <video id="webcamView" autoplay playsinline muted class="mirror-mode" style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>

        <!-- 안쪽 코너 브래킷 -->
        <div class="corner-bracket corner-tl"></div>
        <div class="corner-bracket corner-tr"></div>
        <div class="corner-bracket corner-bl"></div>
        <div class="corner-bracket corner-br"></div>

        <!-- 카메라 플래시 오버레이 -->
        <div id="cameraFlashOverlay" style="position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; z-index: 30;"></div>

        <!-- 상단 HUD -->
        <div style="position: absolute; top: 12px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 11px; color: #ffffff; pointer-events: none; z-index: 10;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444;"></div>
            <span style="letter-spacing: 1px; font-weight: bold;">LIVE REC</span>
          </div>
          <div id="shotStatusHud" style="letter-spacing: 1.5px; font-weight: bold; color: #38bdf8;">
            READY [ 1 SHOT ]
          </div>
        </div>

        <!-- 중앙 조준선 Crosshair -->
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.25;">
          <div style="width: 32px; height: 1px; background: #fff;"></div>
          <div style="width: 1px; height: 32px; background: #fff; position: absolute;"></div>
        </div>

        <!-- 하단 HUD -->
        <div style="position: absolute; bottom: 12px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 11px; color: #ffffff; pointer-events: none; z-index: 10;">
          <div style="color: #94a3b8;">AUTO EXPOSURE ON</div>
          <div id="hudPrintType" style="color: #2dd4bf;">EPSON 576 DOT</div>
        </div>

        <!-- 카운트다운 오버레이 -->
        <div id="countdownBox" style="position: absolute; inset: 0; background: rgba(0,0,0,0.2); display: none; align-items: center; justify-content: center; z-index: 25; pointer-events: none;">
          <span id="countdownNumber" style="font-size: clamp(4.5rem, 14vw, 7.5rem); font-weight: 900; color: #ffffff; font-family: monospace; filter: drop-shadow(0 0 25px rgba(56,189,248,0.95));">
            3
          </span>
        </div>
      </div>

      <!-- 1컷 촬영 시작 버튼 -->
      <button id="startShootBtn" onclick="runShootingSequence()" class="btn"
              style="width: min(94vw, 600px); padding: 14px 22px; background: linear-gradient(135deg, #0284c7, #2563eb, #4f46e5); color: #ffffff; font-size: 17px; letter-spacing: 0.5px; border-radius: 14px; border: 1px solid rgba(125,211,252,0.4); box-shadow: 0 10px 25px -5px rgba(2,132,199,0.5); flex-shrink: 0;">
        <svg style="width: 22px; height: 22px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
        </svg>
        <span>1컷 촬영 시작하기</span>
      </button>
    </div>

    <!-- [B] 결과 섹션 (컬러 미리보기 + 자동 즉시 인쇄 상태) -->
    <div id="resultSection" style="display: none; width: 100%; height: 100%; flex-direction: row; align-items: center; justify-content: center; gap: 32px; min-height: 0; padding: 0 10px; margin-top: 4px;">

      <!-- 영수증 컬러 미리보기 (뷰파인더 4:3 비율에 맞춘 576x610 영수증 프레임) -->
      <div style="height: 70vh; max-height: 570px; min-height: 380px; width: auto; display: flex; align-items: center; justify-content: center; padding: 12px 14px 18px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(71, 85, 105, 0.8); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); flex-shrink: 0;">
        <div class="receipt-edge" style="height: 100%; aspect-ratio: 576/610; background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;">
          <img id="stickerPreviewImg" alt="컬러 영수증 미리보기"
               style="width: 100%; height: 100%; object-fit: contain; display: block; background: #ffffff; border-radius: 2px;" />
        </div>
      </div>

      <!-- 우측 컨트롤 영역 -->
      <div style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; gap: 16px; max-width: 380px; width: 100%; align-self: center;">

        <div>
          <h2 id="resultTitle" style="font-size: clamp(1.2rem, 2.5vw, 1.55rem); font-weight: 900; color: #ffffff; letter-spacing: -0.5px;">
            🎉 촬영 완료!
          </h2>
          <p id="resultDesc" style="font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 6px;">
            화면에는 생생한 <strong style="color: #38bdf8;">컬러 사진</strong>으로 표시되며, 프린터에서는 <strong style="color: #2dd4bf;">감열 최적화 디더링</strong>으로 바로 인쇄됩니다.
          </p>
        </div>

        <!-- 인쇄 진행 상태 게이지 바 (BT 전송 시 시각적 피드백) -->
        <div id="printProgressContainer" style="width: 100%; display: none; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #38bdf8; font-weight: bold;">
            <span id="printProgressStatus">프린터로 직접 전송 중...</span>
            <span id="printProgressPercent">0%</span>
          </div>
          <div style="width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; border: 1px solid #334155;">
            <div id="printProgressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #10b981); transition: width 0.1s ease;"></div>
          </div>
        </div>

        <!-- 인쇄 버튼 세트 -->
        <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
          <!-- 1) 인쇄 실행 버튼 -->
          <button id="printActionBtn" onclick="executeSmartPrint()" class="btn"
                  style="width: 100%; padding: 14px 20px; background: linear-gradient(135deg, #10b981, #0d9488, #059669); color: #ffffff; font-size: 16px; border-radius: 14px; border: 1px solid rgba(110,231,183,0.4); box-shadow: 0 10px 25px -5px rgba(16,185,129,0.5);">
            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3m-3 11H8v-5h8v5m3-7c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m-1-9H6V4h12v4Z"/>
            </svg>
            <span id="printBtnLabel">영수증 바로 인쇄하기</span>
          </button>

          <!-- 2) 다시 촬영하기 버튼 -->
          <button id="retakeActionBtn" onclick="resetBoothToCamera()" class="btn"
                  style="width: 100%; padding: 12px 18px; background: #1e293b; color: #cbd5e1; font-size: 14px; border-radius: 14px; border: 1px solid #475569;">
            <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/>
            </svg>
            <span>다시 촬영하기</span>
          </button>
        </div>

        <div style="font-size: 11px; color: #64748b; font-family: monospace;">
          * 45초 동안 입력이 없으면 처음 화면으로 자동 복귀합니다.
        </div>
      </div>
    </div>
  </main>

  <!-- ============================================================
       3. 백그라운드 캔버스 & 브라우저 인쇄 DOM
       ============================================================ -->
  <canvas id="colorStripCanvas" width="576" height="610" style="display: none;"></canvas>
  <canvas id="thermalStripCanvas" width="576" height="610" style="display: none;"></canvas>
  <div id="browserPrintZone" style="display: none;">
    <img id="browserPrintImg" src="" alt="thermal-print-strip" />
  </div>

  <!-- 토스트 알림 메시지 바 -->
  <div id="appToast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; background: #0f172a; border: 1px solid #38bdf8; color: #fff; padding: 10px 18px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); transition: opacity 0.3s ease; opacity: 0; pointer-events: none; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px;">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">안내 메시지</span>
  </div>

  <!-- ============================================================
       4. 스크립트 로직 (Web Bluetooth 다이렉트 ESC/POS + 디더링)
       ============================================================ -->
  <script>
    const CONFIG = {
      AUTO_RESET_SECONDS: 45,
      FESTIVAL_TITLE: '2026 수피아 AI·SW',
      CLUB_NAME: 'SPEER HIGH SCHOOL // AI LAB',
      CANVAS_WIDTH: 576,  // Epson TM-m30III 80mm 표준 유효 폭
      CANVAS_HEIGHT: 610, // 4:3 비율 사진(536x402) + 상/하단 문구
      PHOTO_WIDTH: 536,
      PHOTO_HEIGHT: 402
    };

    // DOM 참조
    const webcamView = document.getElementById('webcamView');
    const captureSection = document.getElementById('captureSection');
    const resultSection = document.getElementById('resultSection');
    const shotStatusHud = document.getElementById('shotStatusHud');
    const countdownBox = document.getElementById('countdownBox');
    const countdownNumber = document.getElementById('countdownNumber');
    const cameraFlashOverlay = document.getElementById('cameraFlashOverlay');
    const startShootBtn = document.getElementById('startShootBtn');
    const printActionBtn = document.getElementById('printActionBtn');
    const printBtnLabel = document.getElementById('printBtnLabel');
    const stickerPreviewImg = document.getElementById('stickerPreviewImg');
    const colorCanvas = document.getElementById('colorStripCanvas');
    const colorCtx = colorCanvas.getContext('2d');
    const thermalCanvas = document.getElementById('thermalStripCanvas');
    const thermalCtx = thermalCanvas.getContext('2d');
    const browserPrintZone = document.getElementById('browserPrintZone');
    const browserPrintImg = document.getElementById('browserPrintImg');
    const printProgressContainer = document.getElementById('printProgressContainer');
    const printProgressBar = document.getElementById('printProgressBar');
    const printProgressPercent = document.getElementById('printProgressPercent');
    const printProgressStatus = document.getElementById('printProgressStatus');
    const btBtnText = document.getElementById('btBtnText');
    const btStatusBadge = document.getElementById('btStatusBadge');
    const btDot = document.getElementById('btDot');
    const btStatusText = document.getElementById('btStatusText');
    const hudPrintType = document.getElementById('hudPrintType');

    // 상태 변수
    let singleCapturedFrame = null;
    let autoResetTimer = null;
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;
    let isBluetoothPrinting = false;
    const DEFAULT_BRIGHTNESS_BOOST = 12;

    // ------------------------------------------------------------
    // [1] Web Bluetooth 직접 연결 (태블릿 다이렉트 무음 인쇄)
    // ------------------------------------------------------------
    async function toggleBluetoothConnection() {
      if (bluetoothCharacteristic) {
        // 이미 연결되어 있으면 해제
        disconnectBluetooth();
        return;
      }

      if (!navigator.bluetooth || typeof navigator.bluetooth.requestDevice !== 'function') {
        showToast("현재 환경에서는 Web Bluetooth가 지원되지 않습니다. (Chrome 직접 접속 필요)", "⚠️");
        return;
      }

      try {
        showToast("Epson 블루투스 프린터를 검색 중...", "🔍");

        // 표준 감열 프린터 SPP 및 공용 시리얼 UUID 필터
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'TM-' },
            { namePrefix: 'EPSON' },
            { namePrefix: 'Epson' },
            { namePrefix: 'Printer' }
          ],
          optionalServices: [
            '000018f0-0000-1000-8000-00805f9b34fb', // 표준 프린터 서비스
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2', // 엡슨 특정 GATT 서비스
            '49535343-fe7d-4ae5-8fa9-9fafd205e455'  // 투명 직렬 포트(ISSC)
          ],
          acceptAllDevices: false
        }).catch(async (e) => {
          // 보안 정책에 의해 거부된 경우 상위로 던져서 처리
          if (e.name === 'SecurityError') {
            throw e;
          }
          // 이름 필터로 못 찾을 경우 모든 기기 검색 지원
          return await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              '000018f0-0000-1000-8000-00805f9b34fb',
              'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
              '49535343-fe7d-4ae5-8fa9-9fafd205e455'
            ]
          });
        });

        if (!bluetoothDevice) {
          return;
        }

        bluetoothDevice.addEventListener('gattserverdisconnected', onBluetoothDisconnected);

        showToast("프린터 GATT 서버에 연결 중...", "⏳");
        const server = await bluetoothDevice.gatt.connect();

        // 사용 가능한 서비스 및 쓰기 가능 특성(Characteristic) 탐색
        const services = await server.getPrimaryServices();
        let targetChar = null;

        for (const service of services) {
          try {
            const characteristics = await service.getCharacteristics();
            for (const char of characteristics) {
              if (char.properties.write || char.properties.writeWithoutResponse) {
                targetChar = char;
                break;
              }
            }
          } catch (err) {}
          if (targetChar) break;
        }

        if (!targetChar) {
          throw new Error("쓰기 가능한 프린터 특성(Characteristic)을 찾지 못했습니다.");
        }

        bluetoothCharacteristic = targetChar;

        // UI 갱신: 연결됨
        btBtnText.innerText = "프린터 BT 연결 해제";
        btStatusBadge.className = "bt-badge bt-badge-connected";
        btDot.style.background = "#10b981";
        btStatusText.innerText = `BT 직결: ${bluetoothDevice.name || 'Epson'}`;
        hudPrintType.innerText = "BT DIRECT";
        hudPrintType.style.color = "#10b981";

        showToast(`🎉 ${bluetoothDevice.name || '프린터'} 연결 성공! (팝업 없이 즉시 인쇄)`, "🖨️");

      } catch (err) {
        if (err.name === 'SecurityError') {
          console.warn("Permissions-Policy prevented Web Bluetooth in this embedded frame:", err.message);
          showToast("현재 미리보기(iframe) 환경에서는 블루투스 권한이 제한됩니다. 일반 브라우저 탭에서 실행하거나 기본 인쇄 모드를 사용하세요.", "ℹ️");
        } else if (err.name !== 'NotFoundError') { // 사용자가 취소한 경우가 아닐 때
          console.error("Bluetooth Connect Error:", err);
          showToast("블루투스 연결 실패: " + err.message, "⚠️");
        }
        disconnectBluetooth();
      }
    }

    function disconnectBluetooth() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
      onBluetoothDisconnected();
    }

    function onBluetoothDisconnected() {
      bluetoothCharacteristic = null;
      bluetoothDevice = null;
      btBtnText.innerText = "프린터 BT 연결 (무음 인쇄)";
      btStatusBadge.className = "bt-badge bt-badge-disconnected";
      btDot.style.background = "#94a3b8";
      btStatusText.innerText = "BT 미연결 (기본 인쇄)";
      hudPrintType.innerText = "EPSON 576 DOT";
      hudPrintType.style.color = "#2dd4bf";
      showToast("블루투스 연결이 해제되었습니다.", "ℹ️");
    }

    // ------------------------------------------------------------
    // [2] ESC/POS 래스터 비트맵 바이너리 생성기 (Epson 표준 GS v 0)
    // ------------------------------------------------------------
    function generateEscPosRasterBytes(canvas) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;  // 576
      const h = canvas.height; // 610
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const bytesPerLine = Math.ceil(w / 8); // 72 bytes per line
      const rasterData = [];

      // 1) 프린터 초기화 (ESC @)
      rasterData.push(0x1B, 0x40);

      // 2) 줄간격 0으로 설정 (ESC 3 0) - 사진 세로줄 빈틈 방지
      rasterData.push(0x1B, 0x33, 0x00);

      // 3) 래스터 비트 이미지 인쇄 명령 (GS v 0 0 xL xH yL yH)
      // m=0 (Normal), xL, xH: 가로 바이트 수(72), yL, yH: 세로 도트 수(h)
      const xL = bytesPerLine & 0xFF;
      const xH = (bytesPerLine >> 8) & 0xFF;
      const yL = h & 0xFF;
      const yH = (h >> 8) & 0xFF;

      rasterData.push(0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH);

      // 4) 픽셀 데이터를 비트 단위(1=흑, 0=백)로 묶어 채우기
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < bytesPerLine; x++) {
          let byte = 0;
          for (let b = 0; b < 8; b++) {
            const px = x * 8 + b;
            if (px < w) {
              const idx = (y * w + px) * 4;
              // Floyd-Steinberg 후 검은 픽셀(R=0)이면 1비트 활성화
              const isBlack = data[idx] < 128;
              if (isBlack) {
                byte |= (1 << (7 - b));
              }
            }
          }
          rasterData.push(byte);
        }
      }

      // 5) 종이 배출 및 자동 컷팅 (용지 피드 4줄 후 부분 컷)
      rasterData.push(0x1B, 0x64, 0x04);       // ESC d 4 (4 lines feed)
      rasterData.push(0x1D, 0x56, 0x42, 0x00); // GS V B 0 (Partial Cut)

      return new Uint8Array(rasterData);
    }

    // ------------------------------------------------------------
    // [3] 블루투스 청크 분할 전송기 (512 Byte 청크 & 25ms 딜레이)
    // ------------------------------------------------------------
    async function sendBytesViaBluetooth(bytes) {
      if (!bluetoothCharacteristic) throw new Error("블루투스가 연결되어 있지 않습니다.");

      const CHUNK_SIZE = 512; // MD 가이드 권장 최적 버퍼 크기
      const total = bytes.length;
      let offset = 0;

      printProgressContainer.style.display = 'flex';
      printProgressBar.style.width = '0%';
      printProgressPercent.innerText = '0%';

      while (offset < total) {
        const slice = bytes.slice(offset, offset + CHUNK_SIZE);

        if (bluetoothCharacteristic.writeValueWithoutResponse) {
          await bluetoothCharacteristic.writeValueWithoutResponse(slice);
        } else {
          await bluetoothCharacteristic.writeValue(slice);
        }

        offset += slice.length;
        const progress = Math.min(100, Math.round((offset / total) * 100));
        printProgressBar.style.width = `${progress}%`;
        printProgressPercent.innerText = `${progress}%`;

        // 25ms 미세 딜레이로 프린터 버퍼 오버플로우 방지
        await sleep(25);
      }

      await sleep(300);
      printProgressContainer.style.display = 'none';
    }

    // ------------------------------------------------------------
    // [4] 화면 표시용: 선명한 컬러 영수증 합성 생성기
    // ------------------------------------------------------------

    // ------------------------------------------------------------
    // [5] 실제 감열 인쇄용: Floyd-Steinberg 4방향 오차 확산 엔진
    // ------------------------------------------------------------
    function generateThermalPrintImage() {
      if (!singleCapturedFrame) return '';

      const cw = CONFIG.CANVAS_WIDTH;
      const ch = CONFIG.CANVAS_HEIGHT;
      thermalCanvas.width = cw;
      thermalCanvas.height = ch;

      thermalCtx.fillStyle = '#ffffff';
      thermalCtx.fillRect(0, 0, cw, ch);

      thermalCtx.textAlign = 'center';
      thermalCtx.fillStyle = '#000000';
      thermalCtx.font = 'bold 28px sans-serif';
      thermalCtx.fillText(CONFIG.FESTIVAL_TITLE, cw / 2, 48);

      thermalCtx.font = 'bold 14px monospace';
      thermalCtx.fillText(CONFIG.CLUB_NAME, cw / 2, 72);

      thermalCtx.strokeStyle = '#000000';
      thermalCtx.lineWidth = 2;
      thermalCtx.setLineDash([8, 6]);
      thermalCtx.beginPath();
      thermalCtx.moveTo(20, 88);
      thermalCtx.lineTo(cw - 20, 88);
      thermalCtx.stroke();
      thermalCtx.setLineDash([]);

      const pw = CONFIG.PHOTO_WIDTH;
      const ph = CONFIG.PHOTO_HEIGHT;
      const pX = Math.round((cw - pw) / 2);
      const pY = 100;

      const tempC = document.createElement('canvas');
      tempC.width = pw;
      tempC.height = ph;
      const tCtx = tempC.getContext('2d');
      tCtx.imageSmoothingEnabled = false;
      tCtx.drawImage(singleCapturedFrame, 0, 0, pw, ph);

      const imgData = tCtx.getImageData(0, 0, pw, ph);
      const data = imgData.data;
      const w = pw;
      const h = ph;

      const gray = new Float32Array(w * h);

      // 밝기 +12%, 대비 -6% 자동 보정 (감열 헤드 과열 및 타는 현상 차단)
      const brightMul = 1.0 + (DEFAULT_BRIGHTNESS_BOOST / 100);
      const contrastMul = 0.94;

      for (let i = 0; i < data.length; i += 4) {
        let luma = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        luma = (luma - 128) * contrastMul + 128;
        luma = luma * brightMul + (DEFAULT_BRIGHTNESS_BOOST * 0.6);
        gray[i / 4] = Math.min(255, Math.max(0, luma));
      }

      // 언샤프 마스크 (이목구비 윤곽선 선명화)
      const sharp = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          if (x > 0 && x < w - 1 && y > 0 && y < h - 1) {
            const blur = (gray[idx - 1] + gray[idx + 1] + gray[idx - w] + gray[idx + w]) * 0.25;
            const edge = gray[idx] - blur;
            sharp[idx] = Math.min(255, Math.max(0, gray[idx] + edge * 0.75));
          } else {
            sharp[idx] = gray[idx];
          }
        }
      }

      // Floyd-Steinberg 4방향 오차 확산 (부드러운 그라데이션)
      const threshold = 135;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const oldP = sharp[idx];
          const newP = oldP < threshold ? 0 : 255;
          sharp[idx] = newP;
          const err = oldP - newP;

          if (x + 1 < w) sharp[idx + 1] += err * (7 / 16);
          if (x - 1 >= 0 && y + 1 < h) sharp[(y + 1) * w + (x - 1)] += err * (3 / 16);
          if (y + 1 < h) sharp[(y + 1) * w + x] += err * (5 / 16);
          if (x + 1 < w && y + 1 < h) sharp[(y + 1) * w + (x + 1)] += err * (1 / 16);
        }
      }

      for (let i = 0; i < sharp.length; i++) {
        const v = sharp[i] < 128 ? 0 : 255;
        const pIdx = i * 4;
        data[pIdx] = v;
        data[pIdx + 1] = v;
        data[pIdx + 2] = v;
        data[pIdx + 3] = 255;
      }
      tCtx.putImageData(imgData, 0, 0);

      thermalCtx.imageSmoothingEnabled = false;
      thermalCtx.drawImage(tempC, pX, pY, pw, ph);

      thermalCtx.strokeStyle = '#000000';
      thermalCtx.lineWidth = 2;
      thermalCtx.strokeRect(pX, pY, pw, ph);

      thermalCtx.setLineDash([8, 6]);
      thermalCtx.beginPath();
      thermalCtx.moveTo(20, pY + ph + 16);
      thermalCtx.lineTo(cw - 20, pY + ph + 16);
      thermalCtx.stroke();
      thermalCtx.setLineDash([]);

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      thermalCtx.font = 'bold 14px monospace';
      thermalCtx.fillText(`DATE: ${dateStr}`, cw / 2, pY + ph + 38);

      thermalCtx.font = 'bold 18px sans-serif';
      thermalCtx.fillText('광주수피아여자고등학교 AI·SW 체험', cw / 2, pY + ph + 64);

      return thermalCanvas.toDataURL('image/png');
    }

    // ------------------------------------------------------------
    // [6] 스마트 인쇄 디스패처 (BT 직결 시 팝업 없이 1초 만에 바로 인쇄)
    // ------------------------------------------------------------
    async function executeSmartPrint() {
      if (isBluetoothPrinting) return;
      printActionBtn.disabled = true;
      clearTimeout(autoResetTimer);

      try {
        // 감열 캔버스 렌더링
        generateThermalPrintImage();

        // 1) 블루투스가 연결되어 있으면 -> 팝업 없는 다이렉트 ESC/POS 전송
        if (bluetoothCharacteristic) {
          isBluetoothPrinting = true;
          printBtnLabel.innerText = "프린터로 직접 전송 중...";
          showToast("블루투스로 즉시 인쇄 중입니다! 🖨️", "🚀");

          const escPosBytes = generateEscPosRasterBytes(thermalCanvas);
          await sendBytesViaBluetooth(escPosBytes);

          printBtnLabel.innerText = "출력 완료!";
          showToast("영수증이 즉시 출력되었습니다! ✨", "🎉");

          setTimeout(() => {
            printActionBtn.disabled = false;
            printBtnLabel.innerText = "영수증 바로 인쇄하기";
            isBluetoothPrinting = false;
            resetBoothToCamera();
          }, 2000);

        } else {
          // 2) 블루투스 미연결 시 -> 브라우저 표준 인쇄 (Fully Kiosk 앱에서는 이 역시 자동 무음 인쇄)
          printBtnLabel.innerText = "인쇄 화면 준비 중...";
          const printDataUrl = thermalCanvas.toDataURL('image/png');

          if (browserPrintImg) {
            browserPrintImg.src = printDataUrl;
            if (browserPrintImg.decode) {
              try { await browserPrintImg.decode(); } catch (e) {}
            }
          }

          setTimeout(() => {
            printBtnLabel.innerText = "인쇄 중...";
            window.print();

            printBtnLabel.innerText = "출력 완료!";
            showToast("영수증 출력이 요청되었습니다! ✨", "🎉");

            setTimeout(() => {
              printActionBtn.disabled = false;
              printBtnLabel.innerText = "영수증 바로 인쇄하기";
              resetBoothToCamera();
            }, 2500);
          }, 150);
        }

      } catch (err) {
        console.error("Print Error:", err);
        showToast("인쇄 오류: " + err.message, "⚠️");
        printActionBtn.disabled = false;
        printBtnLabel.innerText = "다시 인쇄 시도";
        isBluetoothPrinting = false;
      }
    }

    // ------------------------------------------------------------
    // [7] 1컷 촬영 시퀀스 (뷰파인더 4:3 전체 화면 그대로 캡처 후 자동 인쇄)
    // ------------------------------------------------------------
    async function runShootingSequence() {
      startShootBtn.disabled = true;
      singleCapturedFrame = null;
      shotStatusHud.innerText = `COUNTDOWN...`;

      // 3초 카운트다운
      countdownBox.style.display = 'flex';
      for (let c = 3; c >= 1; c--) {
        countdownNumber.innerText = c;
        await sleep(1000);
      }
      countdownBox.style.display = 'none';

      // 플래시
      cameraFlashOverlay.classList.remove('flash-active');
      void cameraFlashOverlay.offsetWidth;
      cameraFlashOverlay.classList.add('flash-active');

      const vw = webcamView.videoWidth || 1280;
      const vh = webcamView.videoHeight || 720;
      const targetAspect = 4 / 3;

      let cropW, cropH;
      if (vw / vh > targetAspect) {
        cropH = vh;
        cropW = vh * targetAspect;
      } else {
        cropW = vw;
        cropH = vw / targetAspect;
      }
      const cropX = (vw - cropW) / 2;
      const cropY = (vh - cropH) / 2;

      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = CONFIG.PHOTO_WIDTH;
      frameCanvas.height = CONFIG.PHOTO_HEIGHT;
      const fCtx = frameCanvas.getContext('2d');
      fCtx.imageSmoothingEnabled = true;
      fCtx.imageSmoothingQuality = 'high';

      // 거울 반전 보정
      fCtx.translate(frameCanvas.width, 0);
      fCtx.scale(-1, 1);
      fCtx.drawImage(webcamView, cropX, cropY, cropW, cropH, 0, 0, frameCanvas.width, frameCanvas.height);

      singleCapturedFrame = frameCanvas;

      await sleep(250);

      // 화면 미리보기용 컬러 영수증 생성 및 표시
      generateColorPreview();

      captureSection.style.display = 'none';
      resultSection.style.display = 'flex';
      printActionBtn.disabled = false;
      printBtnLabel.innerText = "영수증 바로 인쇄하기";

      // 45초 후 자동 복귀 타이머 설정
      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(resetBoothToCamera, CONFIG.AUTO_RESET_SECONDS * 1000);

      // 🌟 촬영이 끝나면 즉시 자동으로 인쇄 실행 (POS처럼 다이렉트 출력)
      setTimeout(() => {
        executeSmartPrint();
      }, 400);
    }

    function resetBoothToCamera() {
      clearTimeout(autoResetTimer);
      resultSection.style.display = 'none';
      captureSection.style.display = 'flex';
      startShootBtn.disabled = false;
      shotStatusHud.innerText = "READY [ 1 SHOT ]";
      singleCapturedFrame = null;
      printProgressContainer.style.display = 'none';
    }

    // ------------------------------------------------------------
    // [8] 웹캠 및 전체화면 유틸리티
    // ------------------------------------------------------------
    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: false
        });
        webcamView.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          webcamView.srcObject = fallbackStream;
        } catch (err2) {
          console.error("Camera Init Error:", err2);
          shotStatusHud.innerText = "CAMERA ERROR";
          showToast("카메라 권한을 허용해 주세요.", "⚠️");
        }
      }
    }

    async function toggleFullscreen() {
      const doc = document.documentElement;
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);

      const isFullscreenAvailable = document.fullscreenEnabled || document.webkitFullscreenEnabled;
      if (!isFullscreenAvailable && !isFull) {
        showToast("현재 환경에서는 전체화면이 제한되어 있습니다.", "ℹ️");
        return;
      }

      try {
        if (!isFull) {
          if (doc.requestFullscreen) {
            await doc.requestFullscreen();
          } else if (doc.webkitRequestFullscreen) {
            await doc.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          }
        }
      } catch (err) {
        console.warn("Fullscreen toggle prevented:", err.message);
        showToast("전체화면 권한이 제한된 환경입니다.", "ℹ️");
      }
    }

    function showToast(msg, icon = "✨") {
      const toast = document.getElementById('appToast');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3200);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.onload = initWebcam;
  </script>
</body>
</html>
