<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 AI·SW체험 수피아여고 포토부스</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Epson ePOS-SDK (TM-m30II 인쇄 라이브러리) -->
  <script src="https://cdn.jsdelivr.net/npm/epson-epos-sdk@2.14.0/index.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      overflow: hidden;
    }

    /* 거울 모드 비디오 */
    .mirror-video {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }

    /* 플래시 애니메이션 */
    @keyframes flashAnim {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-effect {
      animation: flashAnim 0.35s ease-out forwards;
    }

    /* 사이버네틱 HUD 직각 코너 브래킷 */
    .corner-bracket {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #38bdf8;
      pointer-events: none;
      z-index: 10;
    }
    .bracket-tl { top: 12px; left: 12px; border-top: 3px solid #38bdf8; border-left: 3px solid #38bdf8; }
    .bracket-tr { top: 12px; right: 12px; border-top: 3px solid #38bdf8; border-right: 3px solid #38bdf8; }
    .bracket-bl { bottom: 12px; left: 12px; border-bottom: 3px solid #38bdf8; border-left: 3px solid #38bdf8; }
    .bracket-br { bottom: 12px; right: 12px; border-bottom: 3px solid #38bdf8; border-right: 3px solid #38bdf8; }

    /* 영수증 종이 느낌의 그림자 */
    .receipt-shadow {
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col justify-between p-2 sm:p-4 select-none relative">

  <!-- 1. 헤더 영역 (상하 여백 최소화하여 뷰파인더와 바로 밀착) -->
  <header class="w-full flex-shrink-0 relative pt-0.5 sm:pt-1 pb-0 mb-0 text-center">
    <div class="flex items-center justify-center gap-2">
      <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-sky-500/20 border border-sky-400/40 flex items-center justify-center text-sky-400">
        <i class="fa-solid fa-camera-retro text-base sm:text-lg"></i>
      </div>
      <h1 class="text-lg sm:text-2xl md:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-teal-300 to-indigo-300">
        2026 AI·SW체험 수피아여고 포토부스
      </h1>
    </div>
    <p class="text-[11px] sm:text-xs md:text-sm text-slate-400 font-medium tracking-wide mt-0.5">
      화면을 보고 3가지 포즈를 취하면 영수증포토가 바로 인쇄됩니다!!
    </p>

    <!-- 전체화면 토글 버튼 (우측 상단 고정) -->
    <button onclick="toggleFullScreen()" 
            class="absolute right-0 top-1/2 -translate-y-1/2 p-2 sm:p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-slate-300 active:scale-95 transition-all"
            title="전체화면 전환">
      <i id="fsIcon" class="fa-solid fa-expand text-sky-400"></i>
    </button>
  </header>

  <!-- 2. 메인 컨텐츠 영역 (상단 제목 바로 아래로 밀착 배치) -->
  <!-- 2. 메인 컨텐츠 영역 -->
  <main class="flex-1 min-h-0 w-full flex flex-col items-center justify-start relative pt-0 mt-0.5">
    
    <!-- (A) 촬영 전 뷰파인더 화면 (상단 텍스트와 마진을 더 넉넉하게 확장) -->
    <div id="captureSection" class="w-full h-full flex flex-col items-center justify-start relative max-w-4xl px-2 pt-6 sm:pt-8">
      <!-- 카메라 사각 프레임 -->
      <div class="relative w-full aspect-video max-h-[50vh] sm:max-h-[52vh] bg-black border-2 border-sky-500/60 shadow-[0_0_30px_rgba(56,189,248,0.25)] overflow-hidden flex items-center justify-center">
        <!-- 웹캠 비디오 -->
        <video id="webcam" class="w-full h-full object-cover mirror-video" autoplay playsinline muted></video>

        <!-- 사이버 코너 브래킷 데코 -->
        <div class="corner-bracket bracket-tl"></div>
        <div class="corner-bracket bracket-tr"></div>
        <div class="corner-bracket bracket-bl"></div>
        <div class="corner-bracket bracket-br"></div>

        <!-- 카메라 상단 HUD 정보 (그림자 없는 얇은 일반 폰트, 순백색 통일) -->
        <div class="absolute top-4 left-8 right-8 flex items-center justify-between text-xs sm:text-sm font-mono font-normal tracking-wider pointer-events-none z-10 text-white">
          <span class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
            LIVE // READY
          </span>
          <span id="cutTracker" class="text-white font-normal tracking-widest">
            SHOT [ 0 / 3 ]
          </span>
        </div>

        <!-- 중앙 크로스헤어(조준선) 가이드 -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-25">
          <div class="w-16 h-16 border border-sky-400"></div>
          <div class="absolute w-28 h-px bg-sky-400"></div>
          <div class="absolute h-28 w-px bg-sky-400"></div>
        </div>

        <!-- 하단 브랜딩 레터링 (그림자 없는 얇은 일반 폰트, 순백색 통일) -->
        <div class="absolute bottom-4 left-8 right-8 flex items-center justify-between pointer-events-none z-10 text-xs sm:text-sm font-mono font-normal tracking-wider text-white">
          <span class="flex items-center">
            <i class="fa-solid fa-microchip mr-2 text-white"></i>SPEER 인공지능공학연구반
          </span>
          <span>
            CAM-01
          </span>
        </div>

        <!-- 카운트다운 오버레이 -->
        <div id="countdownOverlay" class="absolute inset-0 bg-black/50 backdrop-blur-[2px] hidden items-center justify-center z-20">
          <span id="countdownNumber" class="text-8xl sm:text-9xl font-black text-white drop-shadow-[0_0_35px_rgba(56,189,248,1)] animate-bounce">
            3
          </span>
        </div>

        <!-- 촬영 플래시 레이어 -->
        <div id="flashLayer" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-30"></div>
      </div>

      <!-- 뷰파인더 하단: 3컷 촬영 실시간 썸네일 프리뷰 트레이 -->
      <div class="w-full flex items-center justify-center gap-3 sm:gap-4 mt-6 sm:mt-8 px-2">
        <!-- 컷 1 썸네일 -->
        <div id="thumbSlot1" class="relative flex-1 max-w-[200px] aspect-video bg-slate-900/90 border border-sky-500/40 rounded-none overflow-hidden flex items-center justify-center transition-all duration-300 shadow-inner">
          <canvas id="thumbCanvas1" class="w-full h-full object-cover hidden"></canvas>
          <div id="thumbPlaceholder1" class="flex flex-col items-center justify-center text-slate-500 font-mono text-[10px] sm:text-xs tracking-wider">
            <span class="text-sky-400 font-medium">CUT 1</span>
            <span class="text-[9px] text-slate-500">WAITING</span>
          </div>
          <span class="absolute top-1 left-1.5 text-[9px] font-mono text-sky-400/80 pointer-events-none hidden" id="thumbTag1">#01</span>
        </div>

        <!-- 컷 2 썸네일 -->
        <div id="thumbSlot2" class="relative flex-1 max-w-[200px] aspect-video bg-slate-900/90 border border-sky-500/40 rounded-none overflow-hidden flex items-center justify-center transition-all duration-300 shadow-inner">
          <canvas id="thumbCanvas2" class="w-full h-full object-cover hidden"></canvas>
          <div id="thumbPlaceholder2" class="flex flex-col items-center justify-center text-slate-500 font-mono text-[10px] sm:text-xs tracking-wider">
            <span class="text-sky-400 font-medium">CUT 2</span>
            <span class="text-[9px] text-slate-500">WAITING</span>
          </div>
          <span class="absolute top-1 left-1.5 text-[9px] font-mono text-sky-400/80 pointer-events-none hidden" id="thumbTag2">#02</span>
        </div>

        <!-- 컷 3 썸네일 -->
        <div id="thumbSlot3" class="relative flex-1 max-w-[200px] aspect-video bg-slate-900/90 border border-sky-500/40 rounded-none overflow-hidden flex items-center justify-center transition-all duration-300 shadow-inner">
          <canvas id="thumbCanvas3" class="w-full h-full object-cover hidden"></canvas>
          <div id="thumbPlaceholder3" class="flex flex-col items-center justify-center text-slate-500 font-mono text-[10px] sm:text-xs tracking-wider">
            <span class="text-sky-400 font-medium">CUT 3</span>
            <span class="text-[9px] text-slate-500">WAITING</span>
          </div>
          <span class="absolute top-1 left-1.5 text-[9px] font-mono text-sky-400/80 pointer-events-none hidden" id="thumbTag3">#03</span>
        </div>
      </div>
    </div>

    <!-- (B) 촬영 완료 결과 화면 (상단 텍스트와 간격을 줄여 밀착 배치, 우측은 중앙 정렬 유지) -->
    <div id="resultSection" class="w-full h-full hidden flex-row items-center justify-center gap-4 sm:gap-8 max-w-4xl px-2 mt-0.5 sm:mt-1">
      <!-- 좌측: 선명한 영수증 스티커 캔버스 뷰 -->
      <div class="h-full flex items-start justify-center pt-0 pb-1">
        <div class="receipt-shadow border-4 border-slate-700 bg-white p-2 sm:p-2.5 flex flex-col items-center justify-center max-h-[68vh] sm:max-h-[72vh] aspect-[576/1320] relative">
          <canvas id="stickerDisplayCanvas" class="w-full h-full object-contain block"></canvas>
        </div>
      </div>

      <!-- 우측: 결과 안내 및 대형 버튼 패널 (가운데 정렬) -->
      <div class="flex-1 flex flex-col justify-center items-start gap-4 sm:gap-6 max-w-md self-center">
        <div class="space-y-1 sm:space-y-2">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs sm:text-sm font-semibold">
            <i class="fa-solid fa-circle-check"></i> 3컷 촬영 완료
          </div>
          <h2 class="text-xl sm:text-2xl md:text-3xl font-black text-white whitespace-nowrap tracking-tight">
            🎉 스티커 사진이 완성되었습니다!
          </h2>
          <p class="text-xs sm:text-sm text-slate-300 font-medium">
            아래 [인쇄하기]를 누르면 영수증 스티커로 즉시 출력됩니다.
          </p>
        </div>

        <!-- 조작 버튼 그룹 (인쇄하기 & 다시 촬영하기) -->
        <div class="w-full flex flex-col gap-2.5 sm:gap-3.5">
          <button id="printBtn" onclick="handlePrint()" 
                  class="w-full py-3 sm:py-4 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-[0.98] text-white text-sm sm:text-base md:text-lg font-black shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-3 transition-all">
            <i class="fa-solid fa-print"></i>
            <span>인쇄하기</span>
          </button>
          
          <button id="retakeBtn" onclick="retakePhotos()" 
                  class="w-full py-3 sm:py-4 px-6 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-[0.98] border border-slate-600 text-slate-200 text-sm sm:text-base md:text-lg font-black flex items-center justify-center gap-3 transition-all">
            <i class="fa-solid fa-rotate-right"></i>
            <span>다시 촬영하기</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 3. 하단 컨트롤러 바 (첫 화면: 촬영 시작 버튼 - 뷰파인더 아래로 상향 배치) -->
  <footer class="w-full flex-shrink-0 pt-0 pb-2 sm:pb-3 flex items-center justify-center -mt-5 sm:-mt-6 z-10">
    <div id="startBtnContainer" class="w-full max-w-xl px-2">
      <button id="startBtn" onclick="startPhotoShoot()" 
              class="w-full py-3 sm:py-3.5 px-6 rounded-2xl bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:opacity-95 active:scale-[0.98] text-white text-base sm:text-xl font-black shadow-xl shadow-sky-500/30 flex items-center justify-center gap-3 transition-all">
        <i class="fa-solid fa-camera"></i>
        <span>3컷 촬영 시작하기</span>
      </button>
    </div>
  </footer>

  <!-- 인쇄 변환용 백그라운드 캔버스 (화면엔 숨김) -->
  <canvas id="thermalMonoCanvas" width="576" height="1320" class="hidden"></canvas>

  <script>
    // ⚙️ 사전 프린터 네트워크 설정
    const CONFIG = {
      PRINTER_IP: '192.168.0.50', // 현장 Epson TM-m30II Wi-Fi IP
      PRINTER_PORT: '8008',       // ePOS HTTP 기본 포트 (SSL일 경우 8043)
      AUTO_RESET_DELAY: 45000     // 결과 화면 45초 미조작 시 자동 초기화
    };

    let videoStream = null;
    let capturedFrames = [];
    let isProcessing = false;
    let autoResetTimer = null;

    // DOM 요소
    const video = document.getElementById('webcam');
    const captureSection = document.getElementById('captureSection');
    const resultSection = document.getElementById('resultSection');
    const startBtnContainer = document.getElementById('startBtnContainer');
    const startBtn = document.getElementById('startBtn');
    const printBtn = document.getElementById('printBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownNumber = document.getElementById('countdownNumber');
    const cutTracker = document.getElementById('cutTracker');
    const flashLayer = document.getElementById('flashLayer');
    const displayCanvas = document.getElementById('stickerDisplayCanvas');
    const monoCanvas = document.getElementById('thermalMonoCanvas');

    // 썸네일 트레이 초기화 함수
    function resetThumbnails() {
      for (let i = 1; i <= 3; i++) {
        const tCanvas = document.getElementById(`thumbCanvas${i}`);
        const tPlaceholder = document.getElementById(`thumbPlaceholder${i}`);
        const tTag = document.getElementById(`thumbTag${i}`);
        const tSlot = document.getElementById(`thumbSlot${i}`);

        if (tCanvas) {
          tCanvas.classList.add('hidden');
          const ctx = tCanvas.getContext('2d');
          ctx.clearRect(0, 0, tCanvas.width, tCanvas.height);
        }
        if (tPlaceholder) tPlaceholder.classList.remove('hidden');
        if (tTag) tTag.classList.add('hidden');
        if (tSlot) {
          tSlot.classList.remove('border-emerald-400', 'shadow-[0_0_12px_rgba(52,211,153,0.5)]');
          tSlot.classList.add('border-sky-500/40');
        }
      }
    }

    // 썸네일 슬롯에 촬영된 컷 반영
    function updateThumbnailSlot(shotIndex, sourceCanvas) {
      const tCanvas = document.getElementById(`thumbCanvas${shotIndex}`);
      const tPlaceholder = document.getElementById(`thumbPlaceholder${shotIndex}`);
      const tTag = document.getElementById(`thumbTag${shotIndex}`);
      const tSlot = document.getElementById(`thumbSlot${shotIndex}`);

      if (!tCanvas || !sourceCanvas) return;

      tCanvas.width = sourceCanvas.width;
      tCanvas.height = sourceCanvas.height;
      const ctx = tCanvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0);

      tCanvas.classList.remove('hidden');
      if (tPlaceholder) tPlaceholder.classList.add('hidden');
      if (tTag) tTag.classList.remove('hidden');
      if (tSlot) {
        tSlot.classList.remove('border-sky-500/40');
        tSlot.classList.add('border-emerald-400', 'shadow-[0_0_12px_rgba(52,211,153,0.5)]');
      }
    }

    // 1. 전체화면 토글
    function toggleFullScreen() {
      try {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        const elem = document.documentElement;
        if (!isFS) {
          if (elem.requestFullscreen) elem.requestFullscreen();
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
          else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        }
      } catch (e) {
        console.warn("Fullscreen toggle warning:", e);
      }
    }

    function updateFSIcon() {
      const fsIcon = document.getElementById('fsIcon');
      if (!fsIcon) return;
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      fsIcon.className = isFS ? "fa-solid fa-compress text-sky-400" : "fa-solid fa-expand text-sky-400";
    }

    document.addEventListener('fullscreenchange', updateFSIcon);
    document.addEventListener('webkitfullscreenchange', updateFSIcon);

    // 2. 카메라 초기화
    async function initCamera() {
      try {
        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
        }
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            facingMode: "user"
          },
          audio: false
        });
        video.srcObject = videoStream;
      } catch (err) {
        console.error("Camera access error:", err);
      }
    }

    const sleep = (ms) => new Promise(res => setTimeout(res, ms));

    // 3. 3컷 순차 촬영 프로세스
    async function startPhotoShoot() {
      if (isProcessing) return;
      isProcessing = true;
      capturedFrames = [];
      resetThumbnails();
      startBtn.disabled = true;

      for (let shot = 1; shot <= 3; shot++) {
        cutTracker.innerText = `SHOT [ ${shot} / 3 ]`;
        cutTracker.className = "text-white font-normal tracking-widest";

        // 3초 카운트다운
        for (let c = 3; c >= 1; c--) {
          countdownNumber.innerText = c;
          countdownOverlay.classList.remove('hidden');
          countdownOverlay.classList.add('flex');
          await sleep(1000);
        }

        countdownOverlay.classList.remove('flex');
        countdownOverlay.classList.add('hidden');

        // 플래시 효과 & 프레임 캡처
        triggerFlash();
        const frameCanvas = captureCurrentFrame();
        updateThumbnailSlot(shot, frameCanvas);
        await sleep(900);
      }

      cutTracker.innerText = "PROCESSING...";
      await sleep(400);

      // 스티커 캔버스 그리기 & 결과 화면 표시
      renderColorSticker();
      showResultView();
      isProcessing = false;
      startBtn.disabled = false;
    }

    function triggerFlash() {
      flashLayer.classList.remove('flash-effect');
      void flashLayer.offsetWidth;
      flashLayer.classList.add('flash-effect');
    }

    // 비디오에서 544x272 (와이드 가로 비율) 프레임 캡처
    function captureCurrentFrame() {
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = 544;
      snapCanvas.height = 272;
      const sCtx = snapCanvas.getContext('2d');

      sCtx.save();
      sCtx.translate(snapCanvas.width, 0);
      sCtx.scale(-1, 1); // 좌우 반전 복원

      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;
      const targetRatio = snapCanvas.width / snapCanvas.height;
      let sW = vW, sH = vW / targetRatio, sx = 0, sy = (vH - sH) / 2;

      if (sH > vH) {
        sH = vH;
        sW = vH * targetRatio;
        sx = (vW - sW) / 2;
        sy = 0;
      }

      sCtx.drawImage(video, sx, sy, sW, sH, 0, 0, snapCanvas.width, snapCanvas.height);
      sCtx.restore();

      capturedFrames.push(snapCanvas);
      return snapCanvas;
    }

    // 4. 스티커 풀컬러 캔버스 그래픽 렌더링
    function renderColorSticker() {
      displayCanvas.width = 576;
      displayCanvas.height = 1320;
      const ctx = displayCanvas.getContext('2d');
      const w = displayCanvas.width;
      const h = displayCanvas.height;

      // 흰색 영수증 배경
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, w, h);

      // 상단 테크니컬 라인
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(16, 24, w - 32, 3);

      // 메인 타이틀
      ctx.textAlign = 'center';
      ctx.fillStyle = '#020617';
      ctx.font = '900 32px Pretendard, sans-serif';
      ctx.fillText('2026 AI·SW 체험 한마당', w / 2, 70);

      ctx.fillStyle = '#334155';
      ctx.font = '700 18px Pretendard, monospace';
      ctx.fillText('◆ ◆ ◆ SPEER 인공지능공학연구반 ◆ ◆ ◆', w / 2, 105);

      // 3컷 사진 배치
      const startY = 130;
      const photoW = 544;
      const photoH = 272;
      const photoX = 16;
      const gap = 38;

      capturedFrames.forEach((photoCanvas, idx) => {
        const y = startY + idx * (photoH + gap);

        // 사진 외곽 직각 프레임
        ctx.fillStyle = '#020617';
        ctx.fillRect(photoX - 3, y - 3, photoW + 6, photoH + 6);
        ctx.drawImage(photoCanvas, photoX, y, photoW, photoH);

        // 컷 메타데이터 태그
        ctx.fillStyle = '#020617';
        ctx.fillRect(photoX + 10, y + 10, 85, 24);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px monospace';
        ctx.fillText(`CUT #0${idx + 1}`, photoX + 52, y + 27);
      });

      // 하단 푸터 영역
      const footerY = startY + 3 * (photoH + gap) + 10;

      ctx.fillStyle = '#64748b';
      ctx.font = '16px monospace';
      ctx.fillText('------------------------------------------------', w / 2, footerY);

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      ctx.fillStyle = '#020617';
      ctx.font = '800 20px Pretendard, sans-serif';
      ctx.fillText('SPECIAL MEMORY OF SPEER', w / 2, footerY + 32);

      ctx.fillStyle = '#475569';
      ctx.font = '600 15px monospace';
      ctx.fillText(dateStr, w / 2, footerY + 58);

      // 바코드 그래픽
      drawBarcode(ctx, w / 2 - 140, footerY + 76, 280, 42);

      ctx.fillStyle = '#0f172a';
      ctx.font = '700 15px Pretendard, sans-serif';
      ctx.fillText('SPEER 인공지능공학연구반', w / 2, footerY + 148);
    }

    function drawBarcode(ctx, x, y, width, height) {
      ctx.fillStyle = '#000000';
      let currX = x;
      while (currX < x + width) {
        const barW = Math.floor(Math.random() * 4) + 1;
        ctx.fillRect(currX, y, barW, height);
        currX += barW + Math.floor(Math.random() * 3) + 1;
      }
    }

    // 5. 화면 전환 및 자동 초기화
    function showResultView() {
      captureSection.classList.remove('flex');
      captureSection.classList.add('hidden');
      startBtnContainer.classList.add('hidden');

      resultSection.classList.remove('hidden');
      resultSection.classList.add('flex');

      // 45초 미입력 시 자동 복귀 타이머 가동
      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(() => {
        retakePhotos();
      }, CONFIG.AUTO_RESET_DELAY);
    }

    function retakePhotos() {
      clearTimeout(autoResetTimer);
      resultSection.classList.remove('flex');
      resultSection.classList.add('hidden');

      captureSection.classList.remove('hidden');
      captureSection.classList.add('flex');
      startBtnContainer.classList.remove('hidden');

      cutTracker.innerText = "SHOT [ 0 / 3 ]";
      cutTracker.className = "text-white font-normal tracking-widest";
      resetThumbnails();
      restorePrintBtn();
    }

    function restorePrintBtn() {
      printBtn.disabled = false;
      printBtn.innerHTML = `<i class="fa-solid fa-print"></i><span>인쇄하기</span>`;
    }

    // 6. 감열지(Mono) 디더링 변환 및 인쇄 실행
    function handlePrint() {
      printBtn.disabled = true;
      printBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>인쇄 중...</span>`;

      // 감열지용 흑백 디더링 생성
      monoCanvas.width = 576;
      monoCanvas.height = 1320;
      const mCtx = monoCanvas.getContext('2d');
      mCtx.drawImage(displayCanvas, 0, 0);
      applyFloydSteinbergDither(mCtx, monoCanvas.width, monoCanvas.height);

      // Epson ePOS SDK 통신 시도
      if (typeof epson !== 'undefined' && epson.ePOSDevice) {
        try {
          const ePosDev = new epson.ePOSDevice();
          ePosDev.connect(CONFIG.PRINTER_IP, CONFIG.PRINTER_PORT, (res) => {
            if (res === 'OK' || res === 'SSL_CONNECT_OK') {
              ePosDev.createDevice('local_printer', ePosDev.DEVICE_TYPE_PRINTER, { crypto: false, buffer: false }, (deviceObj, errCode) => {
                if (deviceObj) {
                  const printer = deviceObj;
                  printer.addAlign(printer.ALIGN_CENTER);
                  printer.addImage(mCtx, 0, 0, monoCanvas.width, monoCanvas.height, printer.COLOR_1, printer.MODE_MONO);
                  printer.addFeedLine(3);
                  printer.addCut(printer.CUT_FEED);
                  printer.send();

                  setTimeout(() => {
                    ePosDev.disconnect();
                    onPrintFinished();
                  }, 2000);
                } else {
                  console.warn("ePOS device creation failed, triggering browser print fallback.");
                  fallbackBrowserPrint();
                }
              });
            } else {
              console.warn("ePOS connection failed, triggering browser print fallback.");
              fallbackBrowserPrint();
            }
          });
        } catch (e) {
          console.warn("ePOS SDK error:", e);
          fallbackBrowserPrint();
        }
      } else {
        fallbackBrowserPrint();
      }
    }

    // 브라우저 기본 인쇄 폴백 (AirPrint / Mopria 지원)
    function fallbackBrowserPrint() {
      const printWin = window.open('', '_blank');
      if (printWin) {
        const dataUrl = monoCanvas.toDataURL('image/png');
        printWin.document.write(`
          <html>
            <head>
              <title>Print Photo</title>
              <style>
                @page { size: 80mm auto; margin: 0; }
                body { margin: 0; padding: 0; display: flex; justify-content: center; }
                img { width: 79mm; height: auto; display: block; }
              </style>
            </head>
            <body>
              <img src="${dataUrl}" onload="window.print(); window.close();" />
            </body>
          </html>
        `);
        printWin.document.close();
      }
      setTimeout(onPrintFinished, 2500);
    }

    function onPrintFinished() {
      printBtn.innerHTML = `<i class="fa-solid fa-check"></i><span>출력 완료!</span>`;
      setTimeout(() => {
        retakePhotos();
      }, 3500);
    }

    // Floyd-Steinberg 디더링 알고리즘
    function applyFloydSteinbergDither(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const d = imgData.data;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const gray = 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          const newColor = gray < 128 ? 0 : 255;
          const error = gray - newColor;

          d[idx] = d[idx + 1] = d[idx + 2] = newColor;

          distributeError(d, width, height, x + 1, y, error * 7 / 16);
          distributeError(d, width, height, x - 1, y + 1, error * 3 / 16);
          distributeError(d, width, height, x, y + 1, error * 5 / 16);
          distributeError(d, width, height, x + 1, y + 1, error * 1 / 16);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function distributeError(d, width, height, x, y, err) {
      if (x < 0 || x >= width || y < 0 || y >= height) return;
      const idx = (y * width + x) * 4;
      const val = Math.min(255, Math.max(0, d[idx] + err));
      d[idx] = d[idx + 1] = d[idx + 2] = val;
    }

    // 페이지 로드 시 카메라 실행
    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
