<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 AI·SW체험 수피아여고 포토부스</title>
  
  <!-- Tailwind CSS & Font Awesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 엡손 ePOS-SDK (TM-m30II 인쇄 라이브러리) -->
  <script src="https://cdn.jsdelivr.net/npm/epson-epos-sdk@2.14.0/index.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg-dark: #070b12;
      --card-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      color: #f8fafc;
    }

    /* 웹캠 거울 모드 */
    .mirror-camera {
      transform: scaleX(-1);
    }

    /* 사각 프레임 코너 브래킷 (HUD 데코레이션) */
    .hud-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 15;
    }
    .hud-tl {
      top: 8px;
      left: 8px;
      border-top: 3px solid #38bdf8;
      border-left: 3px solid #38bdf8;
    }
    .hud-tr {
      top: 8px;
      right: 8px;
      border-top: 3px solid #38bdf8;
      border-right: 3px solid #38bdf8;
    }
    .hud-bl {
      bottom: 8px;
      left: 8px;
      border-bottom: 3px solid #38bdf8;
      border-left: 3px solid #38bdf8;
    }
    .hud-br {
      bottom: 8px;
      right: 8px;
      border-bottom: 3px solid #38bdf8;
      border-right: 3px solid #38bdf8;
    }

    /* 뷰파인더 중앙 십자선 */
    .hud-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 12;
      opacity: 0.35;
    }
    .hud-crosshair::before {
      content: "";
      position: absolute;
      top: 19px;
      left: 0;
      width: 40px;
      height: 2px;
      background: #38bdf8;
    }
    .hud-crosshair::after {
      content: "";
      position: absolute;
      top: 0;
      left: 19px;
      width: 2px;
      height: 40px;
      background: #38bdf8;
    }

    /* 셔터 플래시 애니메이션 */
    @keyframes flash-anim {
      0% { opacity: 0; }
      40% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-fired {
      animation: flash-anim 0.35s ease-out;
    }

    /* 영수증 종이 지그재그 하단 마감 엣지 */
    .receipt-paper {
      background: #ffffff;
      position: relative;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7));
    }
    .receipt-paper::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(135deg, transparent 75%, #ffffff 75%) 0 0,
                  linear-gradient(225deg, transparent 75%, #ffffff 75%) 0 0;
      background-size: 10px 8px;
      background-repeat: repeat-x;
    }

    /* 미리보기 캔버스: 왜곡 없이 부모 높이에 맞춰 자동 크기 유지 */
    #stickerDisplayCanvas {
      width: auto;
      height: 100%;
      max-height: 100%;
      display: block;
      border-radius: 0;
    }
  </style>
</head>

<body class="h-[100dvh] w-full flex flex-col justify-between px-3 py-1.5 sm:px-5 sm:py-2.5 bg-slate-950">

  <!-- 헤더 영역 (컴팩트 높이로 축소하여 세로 공간 대폭 확보) -->
  <header class="w-full flex-shrink-0 flex items-center justify-between pb-1.5 border-b border-slate-800/80 relative">
    <!-- 좌측 빈 공간 (중앙 정렬 균형용) -->
    <div class="w-16 hidden sm:block"></div>

    <!-- 중앙 타이틀 & 부제목 -->
    <div class="flex-1 flex flex-col items-center justify-center text-center">
      <div class="flex items-center gap-1.5 sm:gap-2">
        <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-xs sm:text-sm shadow">
          <i class="fa-solid fa-camera"></i>
        </span>
        <h1 class="text-sm sm:text-lg md:text-xl font-black text-white tracking-tight">
          2026 AI·SW체험 수피아여고 포토부스
        </h1>
      </div>
      <p class="text-[10px] sm:text-xs text-sky-400 mt-0.5 font-medium leading-none">
        화면을 보고 3가지 포즈를 취하면 영수증포토가 바로 인쇄됩니다!!
      </p>
    </div>

    <!-- 우측 전체화면 토글 버튼 -->
    <div class="w-auto sm:w-16 flex justify-end">
      <button onclick="toggleFullScreen()" class="px-2 py-1 rounded-md bg-slate-900 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-800 text-[11px] sm:text-xs font-semibold flex items-center gap-1 transition active:scale-95 shadow">
        <i id="fsIcon" class="fa-solid fa-expand text-sky-400"></i>
        <span class="hidden sm:inline">전체화면</span>
      </button>
    </div>
  </header>

  <!-- 메인 영역: min-h-0과 flex-1로 스크롤 발생 방지 -->
  <main class="w-full flex-1 min-h-0 my-1 relative flex items-center justify-center overflow-hidden">

    <!-- ==============================================
         1. 촬영 모드 (뷰파인더를 위로 끌어올리고 촬영버튼 공간 확보)
         ============================================== -->
    <div id="cameraView" class="w-full h-full flex flex-col items-center justify-start pt-1 gap-1.5 min-h-0">
      
      <!-- 카메라 뷰파인더 박스: 태블릿 가로에서 위쪽으로 밀어올리고 높이를 48~52vh로 컴팩트하게 제한 -->
      <div class="relative w-full max-w-3xl h-full max-h-[48vh] sm:max-h-[52vh] aspect-[16/9] bg-black border-2 sm:border-4 border-slate-700 shadow-2xl flex items-center justify-center ring-1 ring-sky-500/30 overflow-hidden flex-shrink">
        
        <!-- 사각 테크니컬 코너 브래킷 -->
        <div class="hud-corner hud-tl"></div>
        <div class="hud-corner hud-tr"></div>
        <div class="hud-corner hud-bl"></div>
        <div class="hud-corner hud-br"></div>

        <!-- 중앙 조준선 타겟 -->
        <div class="hud-crosshair"></div>

        <!-- 하단 SPEER 인공지능공학연구반 레터링 HUD -->
        <div class="absolute bottom-1.5 left-3 right-3 z-10 flex items-center justify-between text-[10px] sm:text-xs font-mono tracking-wider text-sky-400 pointer-events-none">
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="font-bold">SPEER 인공지능공학연구반 // CAM-01</span>
          </div>
          <span class="hidden sm:inline text-slate-400 text-[10px]">WIDE: 16:9 // ACTIVE</span>
        </div>

        <!-- 웹캠 스트림 비디오 -->
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover mirror-camera"></video>

        <!-- 셔터 플래시 효과 오버레이 -->
        <div id="flashOverlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-20"></div>

        <!-- 안내 상태 배지 -->
        <div id="statusBadge" class="absolute top-2 left-3 z-10 flex items-center gap-1.5 bg-black/80 backdrop-blur-md px-2.5 py-0.5 border border-sky-500/40 text-[11px] sm:text-xs font-semibold text-white">
          <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-ping"></span>
          <span id="statusText">카메라 준비 완료</span>
        </div>

        <!-- 컷수 카운팅 인디케이터 -->
        <div id="shotStepIndicator" class="absolute top-2 right-3 z-10 hidden flex gap-1">
          <div id="dot1" class="w-3 h-3 bg-slate-700 border border-slate-500"></div>
          <div id="dot2" class="w-3 h-3 bg-slate-700 border border-slate-500"></div>
          <div id="dot3" class="w-3 h-3 bg-slate-700 border border-slate-500"></div>
        </div>

        <!-- 카운트다운 오버레이 -->
        <div id="countdownOverlay" class="absolute inset-0 z-30 bg-black/50 backdrop-blur-xs hidden flex-col items-center justify-center">
          <span id="countdownNumber" class="text-6xl sm:text-8xl font-black text-white drop-shadow-[0_0_30px_rgba(56,189,248,1)] animate-bounce font-mono">
            3
          </span>
          <p id="countdownMessage" class="text-xs sm:text-sm font-bold text-sky-300 mt-1">포즈를 취해주세요!</p>
        </div>
      </div>

      <!-- 하단 실시간 썸네일 스트립 (촬영 중일 때만 표시) -->
      <div id="thumbnailStrip" class="hidden w-full max-w-3xl flex items-center justify-center gap-2 flex-shrink-0 pt-0.5">
        <div id="slot1" class="w-16 h-10 sm:w-20 sm:h-12 border border-dashed border-slate-700 bg-slate-900/60 overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-mono font-bold">1컷</div>
        <div id="slot2" class="w-16 h-10 sm:w-20 sm:h-12 border border-dashed border-slate-700 bg-slate-900/60 overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-mono font-bold">2컷</div>
        <div id="slot3" class="w-16 h-10 sm:w-20 sm:h-12 border border-dashed border-slate-700 bg-slate-900/60 overflow-hidden flex items-center justify-center text-[10px] text-slate-500 font-mono font-bold">3컷</div>
      </div>
    </div>

    <!-- ==============================================
         2. 결과 모드 (태블릿 최적화 좌우 분할 레이아웃)
         ============================================== -->
    <div id="resultView" class="hidden w-full h-full flex flex-row items-center justify-center gap-4 sm:gap-8 px-2 min-h-0 overflow-hidden">
      
      <!-- 좌측: 영수증 스티커 미리보기 카드 (절대 깨지지 않고 부모 높이에 맞춤) -->
      <div class="h-full max-h-[66vh] sm:max-h-[70vh] p-2 bg-white receipt-paper flex items-center justify-center flex-shrink-0 border-t-4 border-slate-900 shadow-2xl">
        <!-- 캔버스를 직접 표시하여 찌그러짐이나 인코딩 왜곡 방지 -->
        <canvas id="stickerDisplayCanvas" width="576" height="1350"></canvas>
      </div>

      <!-- 우측: 축하 메시지 및 액션 패널 -->
      <div class="flex-1 max-w-sm flex flex-col justify-center items-start gap-2 sm:gap-3">
        <div>
          <span class="inline-block px-2 py-0.5 rounded bg-sky-500/10 border border-sky-400/30 text-sky-400 text-[10px] sm:text-xs font-bold font-mono uppercase tracking-wider">
            Photo Ready
          </span>
          <h2 class="text-lg sm:text-2xl md:text-3xl font-black text-white mt-1 leading-tight">
            🎉 스티커 사진이<br>완성되었습니다!
          </h2>
          <p class="text-[11px] sm:text-xs text-slate-400 mt-1">
            아래 <strong class="text-emerald-400">[인쇄하기]</strong>를 누르면 79mm 영수증 스티커로 즉시 출력됩니다.
          </p>
        </div>

        <!-- 결과 화면 전용 대형 버튼 그룹 -->
        <div class="w-full flex flex-col gap-2 pt-1">
          <!-- 1) 인쇄하기 메인 버튼 -->
          <button id="printBtn" onclick="printReceiptDirectly()" class="w-full min-h-[50px] sm:min-h-[58px] rounded-xl bg-gradient-to-r from-emerald-500 via-teal-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black text-base sm:text-xl shadow-xl shadow-emerald-700/30 flex items-center justify-center gap-2 transition active:scale-[0.98]">
            <i class="fa-solid fa-print"></i>
            <span id="printBtnText">🖨️ 인쇄하기</span>
          </button>

          <!-- 2) 다시 촬영하기 보조 버튼 -->
          <button id="retryBtn" onclick="resetBooth()" class="w-full min-h-[42px] sm:min-h-[46px] rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition active:scale-[0.98]">
            <i class="fa-solid fa-rotate-right"></i>
            <span>🔄 다시 촬영하기</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- 하단 컨트롤 바 (가로 모드 태블릿에서도 항상 한 화면에 고정 표시) -->
  <footer id="cameraFooter" class="w-full max-w-3xl mx-auto flex-shrink-0 pt-1 pb-1">
    <button id="startBtn" onclick="startPhotoBooth()" class="w-full min-h-[48px] sm:min-h-[56px] rounded-xl bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-black text-base sm:text-xl shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
      <i class="fa-solid fa-camera"></i>
      <span>📸 3컷 촬영 시작하기</span>
    </button>
  </footer>

  <!-- 인앱 토스트 알림창 -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 border border-sky-500 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
    <i id="toastIcon" class="fa-solid fa-circle-check text-sky-400"></i>
    <span id="toastMessage" class="text-sm font-medium">안내 메시지</span>
  </div>

  <!-- 감열 흑백 디더링 인쇄용 히든 캔버스 및 iframe -->
  <canvas id="monoCanvas" width="576" height="1350" class="hidden"></canvas>
  <iframe id="printFrame" class="hidden" style="position: absolute; width: 0; height: 0; border: 0;"></iframe>

  <script>
    /****************************************************************
     * [사전 설정]
     * Wi-Fi 프린터 IP 주소 및 스티커 상단 타이틀
     ****************************************************************/
    const CONFIG = {
      PRINTER_IP: '192.168.0.50',            // 연결된 Epson TM-m30II Wi-Fi IP
      PRINTER_PORT: '8008',                  // 기본 포트
      PRINTER_DEV_ID: 'local_printer',       // 디바이스 ID
      FESTIVAL_TITLE: '🏫 2026 AI·SW 체험 한마당 📸'
    };

    // DOM 참조
    const video = document.getElementById('webcam');
    const displayCanvas = document.getElementById('stickerDisplayCanvas');
    const displayCtx = displayCanvas.getContext('2d');
    const monoCanvas = document.getElementById('monoCanvas');
    const monoCtx = monoCanvas.getContext('2d', { willReadFrequently: true });

    const cameraView = document.getElementById('cameraView');
    const resultView = document.getElementById('resultView');
    const cameraFooter = document.getElementById('cameraFooter');

    const startBtn = document.getElementById('startBtn');
    const printBtn = document.getElementById('printBtn');
    const printBtnText = document.getElementById('printBtnText');
    const retryBtn = document.getElementById('retryBtn');

    const statusText = document.getElementById('statusText');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownNumber = document.getElementById('countdownNumber');
    const countdownMessage = document.getElementById('countdownMessage');
    const flashOverlay = document.getElementById('flashOverlay');
    const thumbnailStrip = document.getElementById('thumbnailStrip');

    let currentStream = null;
    let capturedFrames = [];
    let isProcessing = false;
    let autoResetTimer = null;

    // 1. 카메라 시작
    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      statusText.innerText = "카메라 불러오는 중...";

      const constraints = {
        video: {
          facingMode: "user",
          width: { ideal: 1920, min: 1280 },
          height: { ideal: 1080, min: 720 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        statusText.innerText = "카메라 준비 완료";
      } catch (err) {
        console.error("Camera Error:", err);
        statusText.innerText = "카메라 권한 필요";
        showToast("카메라 권한을 허용해주세요.", "error");
      }
    }

    // 2. 3컷 촬영 프로세스
    async function startPhotoBooth() {
      if (isProcessing) return;
      isProcessing = true;
      capturedFrames = [];

      startBtn.disabled = true;
      startBtn.classList.add('opacity-50');

      document.getElementById('shotStepIndicator').classList.remove('hidden');
      thumbnailStrip.classList.remove('hidden');
      for (let i = 1; i <= 3; i++) {
        document.getElementById(`dot${i}`).className = "w-3.5 h-3.5 bg-slate-700 border border-slate-500";
        document.getElementById(`slot${i}`).innerHTML = `${i}컷`;
      }

      const poseMessages = [
        "첫 번째 포즈! 환하게 웃어보세요 😁",
        "두 번째 포즈! 멋지게 브이 ✌️",
        "마지막 세 번째! 개성 넘치는 포즈 🥳"
      ];

      for (let i = 0; i < 3; i++) {
        document.getElementById(`dot${i + 1}`).className = "w-3.5 h-3.5 bg-sky-400 border border-sky-300 shadow-md shadow-sky-400";
        countdownMessage.innerText = poseMessages[i];
        statusText.innerText = `📸 [${i + 1}/3] ${poseMessages[i]}`;

        await runCountdown(3);

        triggerShutterFlash();
        captureSingleFrame(i);
        await sleep(650);
      }

      statusText.innerText = "✨ 스티커 완성 중...";
      await sleep(200);

      // 화면에 표시할 79mm 실물 비율 컬러 스티커 렌더링
      renderColorSticker();

      // 화면을 결과 뷰로 전환
      cameraView.classList.add('hidden');
      cameraFooter.classList.add('hidden');
      resultView.classList.remove('hidden');

      isProcessing = false;
      startBtn.disabled = false;
      startBtn.classList.remove('opacity-50');

      // 45초 동안 방치 시 새 방문객을 위해 자동 리셋
      startAutoResetTimer(45);
    }

    function runCountdown(seconds) {
      return new Promise((resolve) => {
        countdownOverlay.classList.remove('hidden');
        countdownOverlay.classList.add('flex');
        let count = seconds;
        countdownNumber.innerText = count;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownNumber.innerText = count;
          } else {
            clearInterval(timer);
            countdownOverlay.classList.remove('flex');
            countdownOverlay.classList.add('hidden');
            resolve();
          }
        }, 1000);
      });
    }

    function triggerShutterFlash() {
      flashOverlay.classList.add('flash-fired');
      setTimeout(() => {
        flashOverlay.classList.remove('flash-fired');
      }, 350);
    }

    // 16:9 와이드 단일 프레임 캡처 (544px x 272px)
    function captureSingleFrame(index) {
      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = 544;
      frameCanvas.height = 272;
      const fCtx = frameCanvas.getContext('2d');

      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;
      
      const targetAspect = frameCanvas.width / frameCanvas.height;
      let srcW = vW;
      let srcH = vW / targetAspect;
      let srcX = 0;
      let srcY = (vH - srcH) / 2;

      if (srcH > vH) {
        srcH = vH;
        srcW = vH * targetAspect;
        srcX = (vW - srcW) / 2;
        srcY = 0;
      }

      fCtx.save();
      fCtx.translate(frameCanvas.width, 0);
      fCtx.scale(-1, 1); // 거울 모드 반전
      fCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, frameCanvas.width, frameCanvas.height);
      fCtx.restore();

      capturedFrames.push(frameCanvas);

      // 썸네일에 반영
      const slot = document.getElementById(`slot${index + 1}`);
      slot.innerHTML = '';
      const thumb = document.createElement('img');
      thumb.src = frameCanvas.toDataURL('image/jpeg');
      thumb.className = "w-full h-full object-cover";
      slot.appendChild(thumb);
    }

    // 3. 화면 표시용 풀컬러 영수증 스티커 렌더링 (사각 프레임 & 와이드 컷)
    function renderColorSticker() {
      const w = displayCanvas.width;  // 576px (79mm 정밀 규격)
      const h = displayCanvas.height; // 1350px

      // 배경 흰색
      displayCtx.fillStyle = "#FFFFFF";
      displayCtx.fillRect(0, 0, w, h);

      // 상단 테크니컬 마감 바
      displayCtx.fillStyle = "#0f172a";
      displayCtx.fillRect(16, 16, w - 32, 4);

      // 상단 헤더 심볼
      displayCtx.fillStyle = "#334155";
      displayCtx.textAlign = "center";
      displayCtx.font = "bold 13px monospace";
      displayCtx.fillText("◆ ◆ ◆  SPEER 인공지능공학연구반  ◆ ◆ ◆", w / 2, 40);

      // 메인 타이틀
      displayCtx.fillStyle = "#0f172a";
      displayCtx.font = "900 27px sans-serif";
      displayCtx.fillText(CONFIG.FESTIVAL_TITLE, w / 2, 74);

      displayCtx.fillStyle = "#475569";
      displayCtx.font = "bold 15px monospace";
      displayCtx.fillText("― PHOTO STICKER MEMORY ―", w / 2, 100);

      // 점선 구분선
      displayCtx.font = "14px monospace";
      displayCtx.fillText("■ ------------------------------------ ■", w / 2, 120);

      // 3컷 와이드 사각 사진 배치 (544 x 272px)
      const startY = 138;
      const photoWidth = 544;
      const photoHeight = 272;
      const photoX = (w - photoWidth) / 2;
      const photoGap = 300;

      capturedFrames.forEach((frame, idx) => {
        const curY = startY + (idx * photoGap);

        // 1) 외곽 사각 블랙 테두리
        displayCtx.fillStyle = "#0f172a";
        displayCtx.fillRect(photoX - 3, curY - 3, photoWidth + 6, photoHeight + 6);
        
        // 2) 컬러 사진 드로잉
        displayCtx.drawImage(frame, photoX, curY, photoWidth, photoHeight);

        // 3) 사각 코너 브래킷 라인 장식 (흰색 L자 모서리)
        displayCtx.strokeStyle = "#FFFFFF";
        displayCtx.lineWidth = 3;
        const cSize = 16;
        
        // 좌상단
        displayCtx.beginPath();
        displayCtx.moveTo(photoX + 6, curY + 6 + cSize);
        displayCtx.lineTo(photoX + 6, curY + 6);
        displayCtx.lineTo(photoX + 6 + cSize, curY + 6);
        displayCtx.stroke();

        // 우하단
        displayCtx.beginPath();
        displayCtx.moveTo(photoX + photoWidth - 6 - cSize, curY + photoHeight - 6);
        displayCtx.lineTo(photoX + photoWidth - 6, curY + photoHeight - 6);
        displayCtx.lineTo(photoX + photoWidth - 6, curY + photoHeight - 6 - cSize);
        displayCtx.stroke();

        // 4) 좌상단 사각 뱃지 [CUT #N]
        displayCtx.fillStyle = "#0f172a";
        displayCtx.fillRect(photoX + 6, curY + 6, 88, 24);
        displayCtx.fillStyle = "#38bdf8";
        displayCtx.font = "900 13px monospace";
        displayCtx.textAlign = "left";
        displayCtx.fillText(`[CUT #${idx + 1}]`, photoX + 14, curY + 23);

        // 5) 우상단 사각 뱃지 [★ AI MEMORY]
        displayCtx.fillStyle = "#0f172a";
        displayCtx.fillRect(photoX + photoWidth - 116, curY + 6, 110, 24);
        displayCtx.fillStyle = "#f43f5e";
        displayCtx.textAlign = "right";
        displayCtx.font = "bold 12px sans-serif";
        displayCtx.fillText("★ AI MEMORY", photoX + photoWidth - 14, curY + 23);
      });

      // 하단 푸터 영역
      const footerY = startY + (3 * photoGap) + 12;
      displayCtx.fillStyle = "#0f172a";
      displayCtx.textAlign = "center";
      displayCtx.font = "15px monospace";
      displayCtx.fillText("=======================================", w / 2, footerY);

      const now = new Date();
      const dateString = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      displayCtx.font = "900 20px sans-serif";
      displayCtx.fillText("SPEER 인공지능공학연구반", w / 2, footerY + 28);

      displayCtx.font = "14px monospace";
      displayCtx.fillStyle = "#334155";
      displayCtx.fillText(`LOG_TIME: ${dateString}`, w / 2, footerY + 50);
      displayCtx.fillText("REMEMBER THIS SPECIAL MOMENT! ✨", w / 2, footerY + 70);

      // 바코드 생성
      drawThermalBarcode(displayCtx, (w - 340) / 2, footerY + 86, 340, 40);

      displayCtx.font = "12px monospace";
      displayCtx.fillText(`RECEIPT NO. SP-${Math.floor(100000 + Math.random() * 900000)}`, w / 2, footerY + 144);

      // 하단 마감 바
      displayCtx.fillStyle = "#0f172a";
      displayCtx.fillRect(16, h - 16, w - 32, 4);
    }

    function drawThermalBarcode(c, x, y, width, height) {
      c.fillStyle = "#000000";
      let curX = x;
      while (curX < x + width - 8) {
        const bWidth = Math.floor(Math.random() * 3) + 2;
        c.fillRect(curX, y, bWidth, height);
        curX += bWidth + Math.floor(Math.random() * 4) + 1;
      }
    }

    // 4. 바로 인쇄하기 (Epson TM-m30II 직접 전송)
    async function printReceiptDirectly() {
      clearAutoResetTimer();
      printBtnText.innerText = "프린터로 즉시 전송 중...";
      printBtn.disabled = true;
      printBtn.classList.add('opacity-75');
      if (retryBtn) retryBtn.disabled = true;

      // 흑백 디더링 캔버스 생성
      monoCtx.drawImage(displayCanvas, 0, 0);
      applyFloydSteinbergDither(monoCtx, monoCanvas.width, monoCanvas.height);

      if (typeof epson === 'undefined') {
        showToast("ePOS-SDK 로드 실패로 브라우저 인쇄 모드로 전환합니다.", "error");
        systemPrintFallback();
        restorePrintButton();
        return;
      }

      try {
        const ePosDev = new epson.ePOSDevice();

        ePosDev.connect(CONFIG.PRINTER_IP, CONFIG.PRINTER_PORT, (connectResult) => {
          if (connectResult === 'OK' || connectResult === 'SSL_CONNECT_OK') {
            ePosDev.createDevice(
              CONFIG.PRINTER_DEV_ID,
              ePosDev.DEVICE_TYPE_PRINTER,
              { crypto: false, buffer: false },
              (printer, errorCode) => {
                if (printer) {
                  printer.addAlign(printer.ALIGN_CENTER);
                  printer.addImage(monoCtx, 0, 0, monoCanvas.width, monoCanvas.height, printer.COLOR_1, printer.MODE_MONO);
                  printer.addFeedLine(3);
                  printer.addCut(printer.CUT_FEED);

                  printer.send();

                  setTimeout(() => {
                    ePosDev.disconnect();
                    showToast("🎉 스티커 출력이 완료되었습니다!", "success");
                    // 3.5초 뒤 다음 사람을 위해 자동 초기화
                    setTimeout(() => {
                      resetBooth();
                    }, 3500);
                  }, 1200);
                } else {
                  fallbackToSystemPrint(`프린터 연결 실패 (${errorCode})`);
                }
              }
            );
          } else {
            fallbackToSystemPrint(`프린터 IP 연결 실패 (${connectResult})`);
          }
        });
      } catch (err) {
        console.error("Print Error:", err);
        fallbackToSystemPrint("네트워크 전송 오류");
      }
    }

    function fallbackToSystemPrint(reason) {
      restorePrintButton();
      showToast(`${reason}\n브라우저 인쇄창을 엽니다.`);
      systemPrintFallback();
      setTimeout(() => {
        resetBooth();
      }, 5000);
    }

    function restorePrintButton() {
      printBtnText.innerText = "🖨️ 인쇄하기";
      printBtn.disabled = false;
      printBtn.classList.remove('opacity-75');
      if (retryBtn) retryBtn.disabled = false;
    }

    function systemPrintFallback() {
      const dataUrl = monoCanvas.toDataURL('image/png');
      const pFrame = document.getElementById('printFrame');
      const doc = pFrame.contentWindow.document;

      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>79mm 인쇄</title>
          <style>
            @page { margin: 0; size: 79mm auto; }
            body { margin: 0; padding: 0; display: flex; justify-content: center; }
            img { width: 100%; max-width: 576px; height: auto; }
          </style>
        </head>
        <body>
          <img src="${dataUrl}" onload="window.print();" />
        </body>
        </html>
      `);
      doc.close();
    }

    // Floyd-Steinberg 감열 디더링 알고리즘
    function applyFloydSteinbergDither(context, width, height) {
      const imgData = context.getImageData(0, 0, width, height);
      const d = imgData.data;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const oldVal = 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          const newVal = oldVal < 128 ? 0 : 255;

          d[idx] = newVal;
          d[idx + 1] = newVal;
          d[idx + 2] = newVal;

          const err = oldVal - newVal;

          distributeDitherError(d, width, height, x + 1, y, err * 0.4375);
          distributeDitherError(d, width, height, x - 1, y + 1, err * 0.1875);
          distributeDitherError(d, width, height, x, y + 1, err * 0.3125);
          distributeDitherError(d, width, height, x + 1, y + 1, err * 0.0625);
        }
      }
      context.putImageData(imgData, 0, 0);
    }

    function distributeDitherError(d, w, h, x, y, val) {
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      const idx = (y * w + x) * 4;
      d[idx] = Math.min(255, Math.max(0, d[idx] + val));
      d[idx + 1] = Math.min(255, Math.max(0, d[idx + 1] + val));
      d[idx + 2] = Math.min(255, Math.max(0, d[idx + 2] + val));
    }

    // 5. 다시 촬영 및 초기 화면 복귀
    function resetBooth() {
      clearAutoResetTimer();

      resultView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      cameraFooter.classList.remove('hidden');

      document.getElementById('shotStepIndicator').classList.add('hidden');
      thumbnailStrip.classList.add('hidden');

      statusText.innerText = "카메라 준비 완료";
      restorePrintButton();
    }

    function startAutoResetTimer(seconds) {
      clearAutoResetTimer();
      autoResetTimer = setTimeout(() => {
        resetBooth();
      }, seconds * 1000);
    }

    function clearAutoResetTimer() {
      if (autoResetTimer) {
        clearTimeout(autoResetTimer);
        autoResetTimer = null;
      }
    }

    // 전체화면 토글
    function toggleFullScreen() {
      const icon = document.getElementById('fsIcon');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          icon.className = "fa-solid fa-compress text-sky-400";
        }).catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            icon.className = "fa-solid fa-expand text-sky-400";
          });
        }
      }
    }

    function showToast(msg, type = "info") {
      const toast = document.getElementById('toastNotification');
      const icon = document.getElementById('toastIcon');
      const text = document.getElementById('toastMessage');

      text.innerText = msg;

      if (type === "error") {
        icon.className = "fa-solid fa-triangle-exclamation text-rose-400";
        toast.style.borderColor = "rgba(244, 63, 94, 0.7)";
      } else if (type === "success") {
        icon.className = "fa-solid fa-circle-check text-emerald-400";
        toast.style.borderColor = "rgba(52, 211, 153, 0.7)";
      } else {
        icon.className = "fa-solid fa-circle-info text-sky-400";
        toast.style.borderColor = "rgba(56, 189, 248, 0.7)";
      }

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 3000);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    window.addEventListener('load', () => {
      initCamera();
    });
  </script>
